seaborn.", "همه‌ی گزینه‌های سلول‌های رسم نمودار را تغییر دهید. اگر نموداری را تصور کنید، seaborn و matplotlib می‌توانند رسمش کنند.", "به جدول‌های ویژگی‌محور فکر کنید: ردیف‌ها رکوردند و ستون‌ها ویژگی‌ها."]}}, "quiz": [{"q": "What is data, according to the lecture?", "o": ["Any list of numbers", "The recorded output of a process", "A pandas DataFrame", "A function"], "a": 1, "why": "Data records what a process produced."}, {"q": "How many dimensions does [[4]] have?", "o": ["0", "1", "2", "4"], "a": 2, "why": "A list of lists is a matrix: 2 dimensions, here of shape (1, 1)."}, {"q": "A 3×2 matrix has how many dimensions?", "o": ["2", "3", "5", "6"], "a": 0, "why": "Two dimensions, with sizes 3 and 2. Don't confuse dimensions with sizes."}, {"q": "Which shape describes a 4d tensor?", "o": ["(4,)", "(2, 2)", "(2, 3, 4, 3)", "(4, 4)"], "a": 2, "why": "The number of sizes in the shape is the number of dimensions."}, {"q": "How many dimensions does a colour image have?", "o": ["1", "2", "3", "4"], "a": 2, "why": "Height, width and colour channels."}, {"q": "Which layout is more common in data analytics?", "o": ["Records-first", "Features-first", "Neither", "Alphabetical"], "a": 1, "why": "Features-first: one named column per feature, like a dict of lists."}, {"q": "What does ŷ (y hat) mean?", "o": ["The true value", "The model's prediction", "The input", "The error"], "a": 1, "why": "y is the real label, ŷ the model's prediction. Never mix them up."}, {"q": "What is f̂?", "o": ["The true process", "Our model of the process", "A plot", "A dataset"], "a": 1, "why": "The hat marks the approximation."}, {"q": "In a plot, what is x?", "o": ["Always the function input", "The horizontal axis", "The colour", "The vertical axis"], "a": 1, "why": "In plots, x and y are coordinates."}, {"q": "What does np.array([1, 2]) + np.array([3, 4]) give?", "o": ["[1, 2, 3, 4]", "[4, 6]", "10", "An error"], "a": 1, "why": "NumPy arithmetic is element-wise."}, {"q": "What does [1, 2] + [3, 4] give with plain lists?", "o": ["[4, 6]", "[1, 2, 3, 4]", "10", "An error"], "a": 1, "why": "+ joins lists. Only NumPy adds element-wise."}, {"q": "What is the dot product of (1, 2) and (3, 4)?", "o": ["10", "11", "[3, 8]", "24"], "a": 1, "why": "1×3 + 2×4 = 11."}, {"q": "How do you convert a NumPy array to a list?", "o": ["arr.to_list()", "arr.tolist()", "list.arr()", "arr.list"], "a": 1, "why": "tolist(), without an underscore, despite the notebook's typo."}, {"q": "What is a pandas DataFrame most like?", "o": ["A single number", "A dict of named columns with superpowers", "A string", "A function"], "a": 1, "why": "Each column is a Series, reached by its name."}, {"q": "How do you access the row labels of a DataFrame df?", "o": ["df.index()", "df.index", "df['index']", "df.rows()"], "a": 1, "why": "index is a property, so no parentheses."}, {"q": "Which seaborn option colours points by a column?", "o": ["s", "size", "hue", "color_by"], "a": 2, "why": "hue colours points using a column's values."}], "exercises": [{"t": "Records to features", "lvl": "Easy", "task": "Turn these records into a features-first dict: <code>records = [[\"Bern\", 3.5], [\"Fribourg\", 4.1], [\"Zurich\", 2.9]]<\/code>, with keys <code>city<\/code> and <code>temp<\/code>.", "hint": "Use list comprehensions to pull out each position, or zip(*records) to turn rows into columns.", "sol": "records = [[\"Bern\", 3.5], [\"Fribourg\", 4.1], [\"Zurich\", 2.9]]\ndata = {\n    \"city\": [r[0] for r in records],\n    \"temp\": [r[1] for r in records],\n}\nprint(data)", "saved": {"stdout": "{'city': ['Bern', 'Fribourg', 'Zurich'], 'temp': [3.5, 4.1, 2.9]}\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Weekly temperatures", "lvl": "Easy", "task": "Make a NumPy array of 7 daily temperatures for 3 cities (3 rows, 7 columns, any values). Print its shape, its number of dimensions and the average of each city.", "hint": "np.array of a list of 3 lists, then .shape, .ndim and .mean(axis=1).", "sol": "import numpy as np\ntemps = np.array([\n    [3, 5, 4, 6, 7, 5, 4],\n    [4, 6, 5, 7, 8, 6, 5],\n    [2, 4, 3, 5, 6, 4, 3],\n])\nprint(temps.shape, temps.ndim)\nprint(temps.mean(axis=1).round(2))", "saved": {"stdout": "(3, 7) 2\n[4.86 5.86 3.86]\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Shopping bill", "lvl": "Easy", "task": "With <code>prices = [2.8, 1.6, 0.5]<\/code> and <code>quantities = [2, 3, 6]<\/code>, compute the cost of each item and the total bill using NumPy.", "hint": "Convert both to arrays and multiply element-wise, then .sum().", "sol": "import numpy as np\nprices = np.array([2.8, 1.6, 0.5])\nquantities = np.array([2, 3, 6])\nper_item = prices * quantities\nprint(per_item)\nprint(round(per_item.sum(), 2))", "saved": {"stdout": "[5.6 4.8 3. ]\n13.4\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Model error", "lvl": "Medium", "task": "The true process is <code>y = 3x - 2<\/code>. Your model guesses <code>y = 2.8x - 1<\/code>. For x = 0 to 9, compute y, ŷ and the average absolute error.", "hint": "Two lambdas, two comprehensions, then the mean of abs(y - y_hat).", "sol": "f = lambda x: 3 * x - 2\nf_hat = lambda x: 2.8 * x - 1\nxs = range(10)\ny = [f(x) for x in xs]\ny_hat = [f_hat(x) for x in xs]\nerrors = [abs(a - b) for a, b in zip(y, y_hat)]\nprint(round(sum(errors) / len(errors), 2))", "saved": {"stdout": "0.5\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Sales table", "lvl": "Medium", "task": "Build a DataFrame of 5 products with columns <code>product<\/code>, <code>price<\/code> and <code>units<\/code>. Add a <code>revenue<\/code> column, sort by it and show the top 3.", "hint": "df['revenue'] = df['price'] * df['units'] works column by column, like NumPy.", "sol": "import pandas as pd\ndf = pd.DataFrame({\n    'product': ['apple', 'bread', 'milk', 'cheese', 'coffee'],\n    'price':   [0.5, 2.8, 1.6, 6.9, 8.5],\n    'units':   [120, 40, 75, 12, 9],\n})\ndf['reven  feature names of the dogs dict as a list of strings.", "Print the character of the second dog.", "Your underlying function is y = x². Generate 10 data points.", "Plot a lineplot of a logarithm between 1 and 100.", "Use linspace to print 21 evenly spaced numbers from -5 to 5, and explain why 21 looks better than 20.", "Make two vectors of 5 integers as lists and compute their dot product by hand, without NumPy.", "Convert those lists to NumPy arrays and check your dot product with a NumPy method.", "Print the type of the index of the dogs DataFrame.", "Scatterplot the Iris dataset: sepal_length on x, sepal_width on y, colour by petal_length (hue) and size by petal_width (size)."], "next": {"title": "Before Week 4", "summary": "This week only touched the basics of plotting and pandas. Next week goes deeper and starts doing useful things with real data.", "bullets": ["Install the libraries in your own environment: numpy, pandas, matplotlib and seaborn.", "Try changing every option in the plotting cells. If you can imagine a chart, seaborn and matplotlib can draw it.", "Keep thinking in features-first tables: rows are records, columns are features."]}}, {"n": 4, "title": "Data and plotting, part 2", "short": "Debugging, selecting data with pandas, distributions, files and data defects", "topics": [{"id": "info", "title": "Data vs information", "summary": "Data is the recorded output of a process. Information is the presence of patterns in that data, and only information matters.", "bullets": ["All numbers from 0 to 10,000,000 are informative: they show one consistent pattern across the whole feature space.", "10 GB of constant zeros is a lot of <i>data<\/i> but almost no <i>information<\/i>.", "A feature is useful according to how much information it gives, and how it relates to the other features.", "Data is <b>information-dense<\/b> when there's a lot of information in little data. Summarising your notes is compression, ideally without losing information."], "cells": [{"label": "Same size, different information", "code": "import pandas as pd\nconstant = pd.Series([0] * 10)\nvarying = pd.Series([3, 7, 1, 9, 4, 6, 2, 8, 5, 0])\nprint(len(constant), constant.nunique(), constant.std())\nprint(len(varying), varying.nunique(), round(varying.std(), 2))", "saved": {"stdout": "10 1 0.0\n10 10 3.03\n", "value": null, "error": null, "images": [], "html": null}}], "note": "Both series hold 10 values, the same amount of data. Only the second carries information: it has 10 distinct values and a real spread."}, {"id": "debugger", "title": "Quick primer on using a debugger", "summary": "A debugger pauses your program at a breakpoint so you can inspect variables and step through the code line by line.", "bullets": ["Python's debugger is <code>pdb<\/code>. In Jupyter you use <code>ipdb<\/code>, the IPython debugger: same commands, better integration.", "Set a breakpoint with <code>IPython.core.debugger.set_trace()<\/code>, inside a function. Execution stops there and an input line appears in the output.", "<code>IPython.embed()<\/code> opens a REPL, which is <b>not<\/b> a debugger. <code>breakpoint()<\/code> works in .py files.", "Leave the debugger with <code>exit()<\/code>. Changes you make to variables while paused are kept when you <code>continue<\/code>, which is handy for testing a fix.", "Run <code>help<\/code> for all commands, or <code>help list<\/code> for one. That's debugger syntax, with no parentheses."], "tables": [{"caption": "Debugger commands and their shortcuts", "head": ["Command", "Short", "What it does"], "rows": [["<code>list<\/code>", "<code>l<\/code>", "Show the line about to run, with context around it"], ["<code>where<\/code>", "<code>w<\/code>", "Show the current line and the whole call stack"], ["<code>up<\/code> / <code>down<\/code>", "<code>u<\/code> / <code>d<\/code>", "Move to the function that called this one, or back down"], ["<code>next<\/code>", "<code>n<\/code>", "Run the current line as one step"], ["<code>step<\/code>", "<code>s<\/code>", "Step <i>into<\/i> a function call on the current line"], ["<code>continue<\/code>", "<code>c<\/code>", "Resume normal execution"], ["<code>p name<\/code>", "", "Print a variable's value"], ["<code>!command<\/code>", "", "Send a command straight to Python, skipping the debugger"]]}], "cells": [{"label": "The crash from the lecture", "code": "def first(n):\n    print('first:', n)\n    return second(n - 1)\n\ndef second(n):\n    print('second:', n)\n    n -= 1\n    return n\n\ndef main():\n    print(1 / first(2))\n\nmain()", "saved": {"stdout": "first: 2\nsecond: 1\n", "value": null, "error": "ZeroDivisionError: division by zero", "images": [], "html": null}}], "trap": "Inside the debugger, its commands are <b>reserved words<\/b>. <code>list()<\/code>, <code>n = 3<\/code> or <code>l = [1, 2]<\/code> fail with confusing errors, because the debugger grabs them first. Check whether the prompt says <code>ipdb&gt;<\/code>, rename your variables (<code>nn<\/code>, <code>ll<\/code>), or prefix with <code>!<\/code>: <code>!list()<\/code>.", "note": "The debugger needs Jupyter's interactive input, so it can't run on this page. Practise Q1 in your own notebook. The cell above shows the crash you'll be tracking down."}, {"id": "views", "title": "Views, copies, lazy loading and copy-on-write", "summary": "pandas avoids copying data whenever it can. Knowing when you get a view and when you get a copy saves you from silent bugs.", "bullets": ["<b>Optimisation<\/b> means choosing, among several ways from A to B, the one that's best on some measure. In programming that's usually speed or memory. Leave it to library experts, but understand their choices.", "Selecting with <code>[]<\/code> (which calls the special method <code>__getitem__()<\/code>) often gives a <b>view<\/b>: a look at the stored data, not a copy of it.", "<b>Lazy loading<\/b>: some tools only read the part of a file or database you actually ask for. This matters for huge files or remote databases.", "<b>Copy-on-write<\/b>: when you change a view, pandas makes a copy and changes that instead. Your view looks right, but the original data is unchanged. That bug is hard to spot.", "To change the original, use the accessors <code>loc<\/code> and <code>iloc<\/code>, or a method option like <code>inplace=True<\/code>.", "<code>df = df.drop_duplicates()<\/code> is popular, but it creates a whole new DataFrame and keeps the old one in memory until it's cleaned up. Prefer being explicit."], "cells": [{"label": "Copy vs in place", "code": "import pandas as pd\ndf = pd.DataFrame({'city': ['Bern', 'Bern', 'Zurich'], 'temp': [3, 3, 5]})\nno_dups = df.drop_duplicates()\nprint(len(df), len(no_dups))\ndf.drop_duplicates(inplace=True)\nprint(len(df))", "saved": {"stdout": "3 2\n2\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Changing a selection doesn't change the original", "code": "import pandas as pd\ndf = pd.DataFrame({'a': [2, 5, 3, 6], 'b': [9, 4, 2, 6]})\nsub = df[df['a'] > 2].copy()\nsub['b'] = 0\nprint(sub)\nprint(df)", "saved": {"stdout": "   a  b\n1  5  0\n2  3  0\n3  6  0\n   a  b\n0  2  9\n1  5  4\n2  3  2\n3  6  6\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "Plain <code>pd.read_csv()<\/code> reads the whole file into memory. Lazy loading comes from tools built for it, such as databases or libraries like Dask and Polars. Also, since pandas 3.0 copy-on-write is always on, so changing a selection <b>never<\/b> changes the original.", "note": "Q2 may be a trick question, as its hints say. Read the <code>astype<\/code> documentation and think about what float64 and int32 mean in memory."}, {"id": "boolean", "title": "Selecting rows with Boolean vectors", "summary": "Comparing arrays gives an array of True and False. Pass that to [] and pandas keeps the rows that are True.", "bullets": ["<code>x &gt; y<\/code> between NumPy arrays gives a <code>bool<\/code> array, element by element. Between pandas Series it gives a boolean Series with the <b>same index<\/b>, so each value lines up with a row.", "\"Boolean\" is capitalised because it's named after <a href=\"https://en.wikipedia.org/wiki/George_Boole\">George Boole<\/a>. The data type is lowercase: <code>bool<\/code>.", "Truth values in Python: <code>0<\/code>, empty structures, <code>None<\/code> and <code>False<\/code> are false, and almost everything else is true. Test it with <code>bool([])<\/code>, and write <code>return bool(a)<\/code> rather than an if/else.", "Read <code>df[df['a'] &gt; df['b']]<\/code> from the inside out: first each column, then the comparison, then the selection.", "Combine conditions with <code>&amp;<\/code> (and), <code>|<\/code> (or) and <code>~<\/code> (not), with each condition in parentheses. Python's <code>and<\/code> and <code>or<\/code> don't work here.", "Strings in NumPy and pandas usually have the generic type <code>object<\/code>, because strings differ in length."], "cells": [{"label": "NumPy comparisons", "code": "import numpy as np\nx = np.array([2, 6, 3])\ny = np.array([3, 3, 3])\nprint(x > y)\nprint(bool([]), bool([0]), bool(0), bool(0.1), bool(None))", "saved": {"stdout": "[False  True False]\nFalse True False True False\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "From the lecture", "code": "import pandas as pd\ndf = pd.DataFrame({'a': [2, 5, 3, 6], 'b': [9, 4, 2, 6]})\nselector = df['a'] > df['b']\nprint(selector)\ndf[selector]", "saved": {"stdout": "0    False\n1     True\n2     True\n3    False\ndtype: bool\n", "value": null, "error": null, "images": [], "html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>a<\/th>\n      <th>b<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>1<\/th>\n      <td>5<\/td>\n      <td>4<\/td>\n    <\/tr>\n    <tr>\n      <th>2<\/th>\n      <td>3<\/td>\n      <td>2<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}, {"label": "Data example: two conditions", "code": "import pandas as pd\nsales = pd.DataFrame({\n    'store': ['Bern', 'Zurich', 'Bern', 'Zurich', 'Bern'],\n    'sales': [120, 95, 210, 180, 160]\n})\nsales[(sales['store'] == 'Bern') & (sales['sales'] > 150)]", "saved": {"stdout": "", "value": null, "error": null, "images": [], "html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>store<\/th>\n      <th>sales<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>2<\/th>\n      <td>Bern<\/td>\n      <td>210<\/td>\n    <\/tr>\n    <tr>\n      <th>4<\/th>\n      <td>Bern<\/td>\n      <td>160<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}], "trap": "Since pandas 3.0, text columns show the type <code>str<\/code> instead of <code>object<\/code>. Older versions, including the one on this page, still show <code>object<\/code>."}, {"id": "accessors", "title": "The index and the accessors loc and iloc", "summary": "loc selects by label (index values and column names). iloc selects by position, like a list. Both give access to the original data.", "bullets": ["The index is a Series that gives each row an identifier. By default it's the row number, but it can be names, dates or anything else.", "Both accessors take one entry per dimension, rows first, then columns: <code>df.loc[rows, columns]<\/code>.", "Both accept slices and lists: <code>[:3]<\/code>, <code>[2:]<\/code>, <code>[:]<\/code>, or <code>[::2, [2, 3]]<\/code> for every other row and the third and fourth columns.", "With <code>loc<\/code>, a label slice <b>includes<\/b> its end. With <code>iloc<\/code>, as with lists, the end is excluded.", "Because these reach the original data, assigning through them changes it.", "<b>Course rule:<\/b> don't use <code>at<\/code>, <code>iat<\/code> or <code>df.column_name<\/code> in the exercises. Stick to <code>loc<\/code>, <code>iloc<\/code> and <code>[]<\/code>."], "tables": [{"caption": "loc vs iloc", "head": ["", "loc", "iloc"], "rows": [["Selects by", "Labels: index values and column names", "Positions: 0, 1, 2…"], ["Example", "<code>df.loc['Bern', 'sales']<\/code>", "<code>df.iloc[0, 1]<\/code>"], ["Slice end", "Included", "Excluded"], ["Best for", "Readable code that says what it means", "Position-based work, such as first or last rows"]]}], "cells": [{"label": "From the lecture", "code": "import pandas as pd\nmovie_scores = pd.DataFrame(\n    [[3, 4], [5, 3]],\n    columns=['movie_A', 'movie_B'],\n    index=['my_score', 'friends_score'])\nprint(movie_scores.loc[:, 'movie_A'])\nprint(movie_scores.iloc[0, :])\nmovie_scores.iloc[0, 0] = 100\nmovie_scores", "saved": {"stdout": "my_score         3\nfriends_score    5\nName: movie_A, dtype: int64\nmovie_A    3\nmovie_B    4\nName: my_score, dtype: int64\n", "value": null, "error": null, "images": [], "html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>movie_A<\/th>\n      <th>movie_B<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>my_score<\/th>\n      <td>100<\/td>\n      <td>4<\/td>\n    <\/tr>\n    <tr>\n      <th>friends_score<\/th>\n      <td>5<\/td>\n      <td>3<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}, {"label": "Data example", "code": "import pandas as pd\nprices = pd.DataFrame({\n    'price': [0.5, 2.8, 1.6, 6.9],\n    'units': [120, 40, 75, 12]\n}, index=['apple', 'bread', 'milk', 'cheese'])\nprint(prices.loc['bread':'milk', 'price'])\nprint(prices.iloc[-1])\nprices.loc[prices['units'] > 50, ['price']]", "saved": {"stdout": "bread    2.8\nmilk     1.6\nName: price, dtype: float64\nprice     6.9\nunits    12.0\nName: cheese, dtype: float64\n", "value": null, "error": null, "images": [], "html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>price<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>apple<\/th>\n      <td>0.5<\/td>\n    <\/tr>\n    <tr>\n      <th>milk<\/th>\n      <td>1.6<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}], "trap": "Small slips in the notebook: <code>dogs[:, ['name', 'weight']]<\/code> needs <code>.loc<\/code>, as in <code>dogs.loc[:, ['name', 'weight']]<\/code>. And <code>at<\/code> and <code>iat<\/code> are accessors used with square brackets, <code>df.at[...]<\/code>, not methods called with ().", "note": "Q4 also asks for a written answer in professional English. As the lecture says: if you can't explain your work, nobody will know how good it is."}, {"id": "studying", "title": "Studying the data", "summary": "Data doesn't matter, only information does. Metadata, data about the data, makes that information easier to work with.", "bullets": ["<b>Metadata<\/b> describes the data. A photo's pixels are the data. The date and GPS position stored with it are metadata.", "Summaries create metadata: even the number of rows in a DataFrame is metadata.", "Summarising doesn't add new information, but making a perspective explicit simplifies the methods that use it later.", "<code>describe()<\/code> gives a statistical summary in one call: count, mean, standard deviation, minimum, quartiles and maximum. It returns a Series or DataFrame with a custom index, so you can pick values with <code>loc<\/code>.", "Convert results with <code>to_numpy()<\/code> or <code>to_list()<\/code> when a question asks for an array or a list.", "Booleans convert to numbers: <code>int(True)<\/code> is 1 and <code>int(False)<\/code> is 0. Think about what that means for counting."], "cells": [{"label": "Metadata of a DataFrame", "code": "import seaborn as sns\niris = sns.load_dataset('iris')\nprint(iris.shape)\nprint(list(iris.columns))\nprint(iris.dtypes)", "saved": {"stdout": "(150, 5)\n['sepal_length', 'sepal_width', 'petal_length', 'petal_width', 'species']\nsepal_length    float64\nsepal_width     float64\npetal_length    float64\npetal_width     float64\nspecies             str\ndtype: object\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example: describe()", "code": "import pandas as pd\ntemps = pd.Series([3.5, 7.2, 4.8, -1.0, 5.5, 6.1, 2.2], name='temp')\nsummary = temps.describe()\nprint(summary)\nprint(summary.loc[['25%', '50%', '75%']].to_list())", "saved": {"stdout": "count    7.000000\nmean     4.042857\nstd      2.769391\nmin     -1.000000\n25%      2.850000\n50%      4.800000\n75%      5.800000\nmax      7.200000\nName: temp, dtype: float64\n[2.85, 4.8, 5.8]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Booleans as numbers", "code": "print('int of True:', int(True), '; of False:', int(False))", "saved": {"stdout": "int of True: 1 ; of False: 0\n", "value": null, "error": null, "images": [], "html": null}}]}, {"id": "hist", "title": "Histograms", "summary": "A histogram counts how many values fall into each value or range, and draws the counts as bars.", "bullets": ["Features are <b>discrete<\/b> (a limited set of values) or <b>continuous<\/b> (any value in a range). Some, like timestamps or click counts, can be treated either way: think it through.", "Continuous features are counted in ranges called <b>buckets<\/b> or bins. Putting values into buckets is called <b>discretisation<\/b>.", "Quickest option: <code>df.hist()<\/code> draws a histogram of every numeric column.", "seaborn does the high-level work, splitting the data and counting. matplotlib's pyplot handles the layout: subplots, titles and labels.", "Check <code>type()<\/code> to see who does what: <code>sns.histplot()<\/code> returns a matplotlib Axes, which you can adjust further.", "Read the lecture's code line by line, running each line if needed, until it all makes sense."], "cells": [{"label": "From the lecture", "code": "import matplotlib.pyplot as plt\nimport seaborn as sns\niris = sns.load_dataset('iris')\nsns.set_theme(rc={'figure.figsize': (8, 6)}, style='whitegrid')\nfig, axes = plt.subplots(2, 2)\nplt.subplots_adjust(wspace=0.3, hspace=0.3)\nfor idx, fname in enumerate(iris.iloc[:, :-1]):\n    ax = axes[idx // 2, idx % 2]\n    ax.title.set_text(fname)\n    subplt = sns.histplot(iris[fname], ax=ax)\n    subplt.set(xlabel=None, ylabel=None)", "saved": {"stdout": "", "value": null, "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAeQAAAF+CAYAAABTU2ncAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAQhdJREFUeF7t3QeUE1XbB/CH3nvvvbeXXgSRKtI7CkhREaQ3BfkEXxAQRVQUsdBBUKQjCEiRrjSV3hHpvbelbL7zf3wTs0uykzKbnWT/v3NyNrtJZu6dzZ1nbpl749hsNpsQERFRjIobo3snIiIixYBMRERkAQzIREREFsCATEREZAEMyERERBbAgBzCNmzYIH/++WeUOTx9+rQsWrQoRo7C2rVrZf/+/TGyb6JQtnLlSjl8+LApWfz1119l586dbrf17bffyrVr19y+Pn36dLl165YpaQl1DMgh7Oeff5bt27dHmcO//vpLZs2aFe1HAYX6vffei7CfZcuWyR9//BHt+yaKbXCRbdbFLs4hv//+u9tD+OWXX8qVK1f09a+++kqWLl0a4b0TJkyQ69evx7Z/gU/i+/Qp8tnDhw8lXrx4+ojs0aNHkiBBArfbxmcTJkzo8vWoXvOF2WnBFfSRI0d8yhtRKEAZjR8/vsSN+3Q9  holds the feature names, and each following line is one data point. Separators can be changed, and values can be quoted.", "CSV only holds 2D data, but it works directly with databases and spreadsheets like Excel.", "<b>JSON<\/b> (JavaScript Object Notation) holds nested lists and dicts, but one JSON file is one data structure. Python's <a href=\"https://docs.python.org/3/library/json.html\">json library<\/a> reads, writes and pretty-prints it.", "Open files with <code>with open(filename, mode) as fd:<\/code>. The mode is 'r' to read or 'w' to write. The file closes by itself when the block ends.", "pandas reads and writes both formats directly, for example <code>to_csv()<\/code> and <a href=\"https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.read_json.html\">read_json()<\/a>.", "Turning an object into text or bytes, for a file or a network, is called <b>serialisation<\/b>. Python's main serialiser is <code>pickle<\/code>. NumPy has its own compact binary format, <code>np.save()<\/code>."], "cells": [{"label": "Writing and reading a CSV", "code": "import pandas as pd\ndf = pd.DataFrame({'city': ['Bern', 'Zurich'], 'temp': [3.5, 2.9]})\ndf.to_csv('temps.csv', index=False)\nwith open('temps.csv', 'r') as fd:\n    print(fd.read())\nprint(pd.read_csv('temps.csv'))", "saved": {"stdout": "city,temp\nBern,3.5\nZurich,2.9\n\n     city  temp\n0    Bern   3.5\n1  Zurich   2.9\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Writing and reading JSON", "code": "import json\nstore = {'name': 'Bern', 'sales': [120, 95, 210], 'open': True}\nwith open('store.json', 'w') as fd:\n    json.dump(store, fd)\nwith open('store.json', 'r') as fd:\n    loaded = json.load(fd)\nprint(loaded)\nprint(json.dumps(loaded, indent=2))", "saved": {"stdout": "{'name': 'Bern', 'sales': [120, 95, 210], 'open': True}\n{\n  \"name\": \"Bern\",\n  \"sales\": [\n    120,\n    95,\n    210\n  ],\n  \"open\": true\n}\n", "value": null, "error": null, "images": [], "html": null}}], "note": "Files written on this page live in the browser's memory only and disappear when you reload. In Jupyter, they're saved next to your notebook. For Q9, part of the answer is explaining your choice of format in English."}, {"id": "defects", "title": "Common defects in the data", "summary": "Defects are values we expected from the underlying process, but that were corrupted or produced by a fault instead.", "bullets": ["These categories explain rather than split: a misread is a missing value that shows up as a wrong number, and a missing value can be treated as an estimate plus noise.", "Repairing missing values is called <b>imputation<\/b>. Removing noise is <b>denoising<\/b>. Imputation can be seen as a first guess that is then denoised.", "The lecture's real story: a numeric column contained the text \"Zrro\", a typo that slipped through a find-and-replace meant to mark missing values. If you can imagine a defect, it has happened."], "tables": [{"caption": "The four common defects", "head": ["Defect", "What happens", "Example"], "rows": [["Noise", "The true value is shifted by some amount from external causes", "A scale that's always off by a few grams"], ["Missing value", "The value is absent, replaced by a placeholder", "NaN, an empty cell, or None"], ["Misread", "The value is completely wrong, from a broken sensor or human error", "A hidden missing value that looks like a number"], ["Error code", "A device signals a fault through a special value", "speed = 9999999"]]}], "cells": [{"label": "Data example: finding defects", "code": "import numpy as np\nimport pandas as pd\nspeed = pd.Series([52.0, 49.5, 9999999, np.nan, 51.2, 50.8])\nprint(speed.isna().to_list())\nspeed = speed.replace(9999999, np.nan)\nprint(speed.to_list())\nprint(speed.isna().sum(), 'missing values')", "saved": {"stdout": "[False, False, False, True, False, False]\n[52.0, 49.5, nan, nan, 51.2, 50.8]\n2 missing values\n", "value": null, "error": null, "images": [], "html": null}}]}, {"id": "mitigation", "title": "Preview: defect mitigation", "summary": "You can't fix a defect, only mitigate it. A reconstructed value is built from data you already have, so it never adds new information.", "bullets": ["Your code always has bugs and your data is always polluted. Defects are the reason data analysis exists at all.", "To produce the correct value, you'd need the process that generated it. If you had that, you wouldn't need data analysis.", "Imputed values come from your existing data. More data with the same information <b>dilutes<\/b> it.", "Imputation is valuable when it unlocks data you otherwise couldn't use: a row with 99 good values and 1 missing one can crash an algorithm. A sensible placeholder lets you use the other 99.", "Artificial data has uses, but when it helps, that's because of a limit in the learning algorithm, not because the data has value of its own.", "Coming in the next lectures: regression and denoising for imputation."], "cells": [{"label": "Imputation adds no information", "code": "import numpy as np\nimport pandas as pd\nspeed = pd.Series([52.0, 49.5, np.nan, 51.2, 50.8])\nfilled = speed.fillna(speed.mean())\nprint(filled.to_list())\nprint(round(speed.mean(), 3), round(filled.mean(), 3))\nprint(round(speed.std(), 3), round(filled.std(), 3))", "saved": {"stdout": "[52.0, 49.5, 50.875, 51.2, 50.8]\n50.875 50.875\n1.044 0.904\n", "value": null, "error": null, "images": [], "html": null}}], "note": "Filling with the mean leaves the mean unchanged and shrinks the spread. The row becomes usable, but nothing new was learned."}], "errors": [["ZeroDivisionError", "division by zero", "A 0 reached a division. Use the debugger's up, down and p to see where it came from."], ["ValueError", "The truth value of a Series is ambiguous", "You used and / or with Series. Use & and | with each condition in parentheses."], ["KeyError", "'friends_score'", "loc couldn't find that label in the index or the columns. Check the spelling."], ["IndexError / ValueError", "Location based indexing can only have [integer, …] types", "You gave iloc a label. iloc only takes positions."], ["Warning", "SettingWithCopyWarning (older pandas)", "You changed a selection, not the original. Use .loc on the original, or .copy() on purpose."], ["IntCastingNaNError", "Cannot convert non-finite values (NA or inf) to integer", "Integer columns can't hold NaN. Handle missing values first."], ["FileNotFoundError", "No such file or directory: 'iris.csv'", "The path is wrong, or the file is in another folder."], ["*** (in ipdb)", "*** NameError / *** Error in argument", "You typed a debugger command (list, n, l, p…) as Python. Rename it or add !."]], "glossary": [["Information", "Patterns in the data. What actually matters."], ["Metadata", "Data about the data, such as row counts or a photo's date."], ["Debugger / breakpoint", "A tool that pauses your code / the place where it pauses."], ["Call stack", "The chain of functions that called each other, explored with up and down."], ["View / copy", "A look at the stored data / an independent duplicate."], ["Copy-on-write", "Changing a view creates a copy instead of changing the original."], ["Lazy loading", "Reading only the data you actually ask for."], ["inplace", "An option that makes a method change the original DataFrame."], ["Boolean mask", "A True/False Series used to select rows."], ["loc / iloc", "Select by label / by position."], ["Discrete / continuous", "A limited set of values / any value in a range."], ["Bin (bucket)", "A range of values counted together in a histogram."], ["Discretisation", "Putting continuous values into buckets."], ["Outlier", "A value far from the rest of the data."], ["Quartile", "The values that split sorted data into four equal parts."], ["Serialisation", "Turning an object into text or bytes to save or send it."], ["Imputation", "Filling in missing values."], ["Mitigation", "Reducing a defect's impact, since it can't be truly fixed."]], "fa": {"title": "داده و رسم نمودار، بخش ۲", "short": "دیباگ، انتخاب داده با پانداس، توزیع‌ها، فایل‌ها و نقص‌های داده", "topics": [{"title": "داده در برابر اطلاعات", "summary": "داده خروجی ثبت‌شده‌ی یک فرایند است. اطلاعات یعنی وجود الگو در آن داده، و فقط اطلاعات اهمیت دارد.", "bullets": ["همه‌ی اعداد 0 تا ۱۰٬۰۰۰٬۰۰۰ اطلاعات دارند: یک الگوی یکدست را در کل فضای ویژگی نشان می‌دهند.", "۱۰ گیگابایت صفر ثابت، <i>داده<\/i>ی زیادی است اما تقریباً هیچ <i>اطلاعاتی<\/i> ندارد.", "مفید بودن یک ویژگی به این بستگی دارد که چقدر اطلاعات می‌دهد و چه رابطه‌ای با ویژگی‌های دیگر دارد.", "داده وقتی <b>پرمحتوا<\/b> است که اطلاعات زیادی در داده‌ی کمی باشد. خلاصه کردن یادداشت‌هایتان فشرده‌سازی است، به‌شرط آنکه اطلاعاتی از دست نرود."], "note": "هر دو سری ۱۰ مقدار دارند، یعنی حجم داده‌شان یکی است. فقط دومی اطلاعات دارد: ۱۰ مقدار متمایز و پراکندگی واقعی.", "labels": ["حجم یکسان، اطلاعات متفاوت"]}, {"title": "آشنایی سریع با دیباگر", "summary": "دیباگر برنامه را در یک نقطه‌ی توقف (breakpoint) نگه می‌دارد تا بتوانید متغیرها را بررسی کنید و کد را خط‌به‌خط جلو ببرید.", "bullets": ["دیباگر پایتون <code>pdb<\/code> است. در ژوپیتر از <code>ipdb<\/code>، دیباگر IPython، استفاده می‌کنید: همان دستورها با هماهنگی بهتر.", "نقطه‌ی توقف را با <code>IPython.core.debugger.set_trace()<\/code> داخل یک تابع بگذارید. اجرا آنجا متوقف می‌شود و یک خط ورودی در خروجی ظاهر می‌شود.", "<code>IPython.embed()<\/code> یک REPL باز می‌کند که دیباگر <b>نیست<\/b>. <code>breakpoint()<\/code> در فایل‌های <code>.py<\/code> کار می‌کند.", "با <code>exit()<\/code> از دیباگر بیرون بیایید. تغییراتی که هنگام توقف به متغیرها می‌دهید با <code>continue<\/code> حفظ می‌شوند، که برای آزمودن یک اصلاح مفید است.", "برای همه‌ی دستورها <code>help<\/code> و برای یکی <code>help list<\/code> را اجرا کنید. این نحو دیباگر است، بدون پرانتز."], "tables": [{"caption": "دستورهای دیباگر و میان‌برهایشان", "head": ["دستور", "کوتاه", "کارش"], "rows": [["<code>list<\/code>", "<code>l<\/code>", "نمایش خطی که قرار است اجرا شود، با خط‌های اطرافش"], ["<code>where<\/code>", "<code>w<\/code>", "نمایش خط فعلی و کل پشته‌ی فراخوانی"], ["<code>up<\/code> / <code>down<\/code>", "<code>u<\/code> / <code>d<\/code>", "رفتن به تابعی که این تابع را صدا زده، یا برگشتن به پایین"], ["<code>next<\/code>", "<code>n<\/code>", "اجرای خط فعلی به‌صورت یک گام"], ["<code>step<\/code>", "<code>s<\/code>", "رفتن به <i>داخل<\/i> تابعی که در خط فعلی صدا زده می‌شود"], ["<code>continue<\/code>", "<code>c<\/code>", "ادامه‌ی اجرای عادی"], ["<code>p name<\/code>", "", "چاپ مقدار یک متغیر"], ["<code>!command<\/code>", "", "فرستادن مستقیم دستور به پایتون، بدون دیباگر"]]}], "note": "دیباگر به ورودی تعاملی ژوپیتر نیاز دارد، پس در این صفحه اجرا نمی‌شود. Q1 را در نوت‌بوک خودتان تمرین کنید. سلول بالا کرشی را نشان می‌دهد که باید ردش را بگیرید.", "trap": "داخل دیباگر، دستورهایش <b>کلمه‌های رزروشده<\/b> هستند. <code>list()<\/code>، <code>n = 3<\/code> یا <code>l = [1, 2]<\/code> با خطاهای گیج‌کننده شکست می‌خورند، چون اول دیباگر آن‌ها را می‌گیرد. ببینید خط ورودی <code>ipdb&gt;<\/code> است یا نه، نام متغیرها را عوض کنید (<code>nn<\/code>، <code>ll<\/code>) یا <code>!<\/code> بگذارید: <code>!list()<\/code>.", "labels": ["کرش درس"]}, {"title": "نما، کپی، بارگذاری تنبل و کپی هنگام نوشتن", "summary": "پانداس هر جا بتواند از کپی کردن داده پرهیز می‌کند. دانستن اینکه کی یک نما (view) می‌گیرید و کی یک کپی، شما را از باگ‌های بی‌صدا نجات می‌دهد.", "bullets": ["<b>بهینه‌سازی<\/b> یعنی از میان چند راه از A به B، راهی را انتخاب کنید که بر اساس یک معیار بهترین است. در برنامه‌نویسی معمولاً سرعت یا حافظه. آن را به متخصصان کتابخانه‌ها بسپارید، اما انتخاب‌هایشان را بفهمید.", "انتخاب با <code>[]<\/code> (که متد ویژه‌ی <code>__getitem__()<\/code> را صدا می‌زند) اغلب یک <b>نما<\/b> می‌دهد: نگاهی به داده‌ی ذخیره‌شده، نه کپی آن.", "<b>بارگذاری تنبل<\/b>: بعضی ابزارها فقط بخشی از فایل یا پایگاه داده را می‌خوانند که واقعاً خواسته‌اید. این برای فایل‌های بسیار بزرگ یا پایگاه‌های داده‌ی راه دور مهم است.", "<b>کپی هنگام نوشتن<\/b>: وقتی یک نما را تغییر می‌دهید، پانداس یک کپی می‌سازد و آن را تغییر می‌دهد. نمای شما درست به نظر می‌رسد، اما داده‌ی اصلی تغییر نکرده است. پیدا کردن این باگ سخت است.", "برای تغییر داده‌ی اصلی از دسترسی‌دهنده‌های <code>loc<\/code> و <code>iloc<\/code> یا گزینه‌ای مثل <code>inplace=True<\/code> در متد استفاده کنید.", "<code>df = df.drop_duplicates()<\/code> رایج است، اما یک DataFrame کاملاً تازه می‌سازد و قبلی را تا پاک شدن در حافظه نگه می‌دارد. صریح بودن را ترجیح دهید."], "note": "همان‌طور که نکته‌هایش می‌گویند، Q2 ممکن است سؤالی انحرافی باشد. مستندات <code>astype<\/code> را بخوانید و فکر کنید float64 و int32 در حافظه چه معنایی دارند.", "trap": "<code>pd.read_csv()<\/code> معمولی کل فایل را در حافظه می‌خواند. بارگذاری تنبل از ابزارهایی می‌آید که برایش ساخته شده‌اند، مثل پایگاه‌های داده یا کتابخانه‌هایی مثل Dask و Polars. همچنین از پانداس ۳٫۰ به بعد کپی هنگام نوشتن همیشه فعال است، پس تغییر یک انتخاب <b>هرگز<\/b> داده‌ی اصلی را تغییر نمی‌دهد.", "labels": ["کپی در برابر تغییر درجا", "تغییر یک انتخاب، داده‌ی اصلی را تغییر نمی‌دهد"]}, {"title": "انتخاب ردیف‌ها با بردارهای بولی", "summary": "مقایسه‌ی آرایه‌ها آرایه‌ای از True و False می‌دهد. آن را به [] بدهید تا پانداس ردیف‌های True را نگه دارد.", "bullets": ["<code>x &gt; y<\/code> بین آرایه‌های NumPy، عضوبه‌عضو، یک آرایه‌ی <code>bool<\/code> می‌دهد. بین Seriesهای پانداس یک Series بولی با <b>همان اندیس<\/b> می‌دهد، تا هر مقدار با یک ردیف جور شود.", "«بولی» از نام <a href=\"https://en.wikipedia.org/wiki/George_Boole\">جورج بول<\/a> آمده و در انگلیسی با حرف بزرگ نوشته می‌شود. نوع داده با حرف کوچک است: <code>bool<\/code>.", "مقادیر درستی در پایتون: <code>0<\/code>، ساختارهای خالی، <code>None<\/code> و <code>False<\/code> نادرست‌اند و تقریباً بقیه درست. با <code>bool([])<\/code> آزمایش کنید و به‌جای if/else بنویسید <code>return bool(a)<\/code>.", "<code>df[df['a'] &gt; df['b']]<\/code> را از داخل به بیرون بخوانید: اول هر ستون، بعد مقایسه، بعد انتخاب.", "شرط‌ها را با <code>&amp;<\/code> (و)، <code>|<\/code> (یا) و <code>~<\/code> (نقیض) ترکیب کنید و هر شرط را در پرانتز بگذارید. <code>and<\/code> و <code>or<\/code> پایتون اینجا کار نمی‌کنند.", "رشته‌ها در NumPy و پانداس معمولاً نوع کلی <code>object<\/code> دارند، چون طول رشته‌ها متفاوت است."], "trap": "از پانداس ۳٫۰ به بعد، ستون‌های متنی نوع <code>str<\/code> را به‌جای <code>object<\/code> نشان می‌دهند. نسخه‌های قدیمی‌تر، از جمله نسخه‌ی این صفحه، هنوز <code>object<\/code> نشان می‌دهند.", "labels": ["مقایسه در NumPy", "از درس", "مثال داده: دو شرط"]}, {"title": "اندیس و دسترسی‌دهنده‌های loc و iloc", "summary": "loc با برچسب انتخاب می‌کند (مقادیر اندیس و نام ستون‌ها). iloc با جایگاه، مثل لیست. هر دو به داده‌ی اصلی دسترسی می‌دهند.", "bullets": ["اندیس یک Series است که به هر ردیف یک شناسه می‌دهد. به‌طور پیش‌فرض شماره‌ی ردیف است، اما می‌تواند نام، تاریخ یا هر چیز دیگری باشد.", "هر دو برای هر بُعد یک ورودی می‌گیرند، اول ردیف‌ها و بعد ستون‌ها: <code>df.loc[rows, columns]<\/code>.", "هر دو برش و لیست می‌پذیرند: <code>[:3]<\/code>، <code>[2:]<\/code>، <code>[:]<\/code>، یا <code>[::2, [2, 3]]<\/code> برای یک ردیف در میان و ستون‌های سوم و چهارم.", "در <code>loc<\/code>، برش با برچسب پایانش را <b>شامل می‌شود<\/b>. در <code>iloc<\/code>، مثل لیست‌ها، پایان کنار گذاشته می‌شود.", "چون این‌ها به داده‌ی اصلی دسترسی دارند، مقداردهی از طریقشان داده را تغییر می‌دهد.", "<b>قانون دوره:<\/b> در تمرین‌ها از <code>at<\/code>، <code>iat<\/code> یا <code>df.column_name<\/code> استفاده نکنید. به <code>loc<\/code>، <code>iloc<\/code> و <code>[]<\/code> بسنده کنید."], "tables": [{"caption": "loc در برابر iloc", "head": ["", "loc", "iloc"], "rows": [["انتخاب بر اساس", "برچسب‌ها: مقادیر اندیس و نام ستون‌ها", "جایگاه‌ها: 0، 1، 2…"], ["مثال", "<code>df.loc['Bern', 'sales']<\/code>", "<code>df.iloc[0, 1]<\/code>"], ["پایان برش", "شامل می‌شود", "کنار گذاشته می‌شود"], ["مناسب برای", "کد خوانایی که منظورش را می‌گوید", "کار بر اساس جایگاه، مثل ردیف‌های اول یا آخر"]]}], "note": "Q4 جوابی نوشتاری به انگلیسی حرفه‌ای هم می‌خواهد. همان‌طور که درس می‌گوید: اگر نتوانید کارتان را توضیح دهید، هیچ‌کس نمی‌فهمد چقدر خوب است.", "trap": "لغزش‌های کوچک نوت‌بوک: <code>dogs[:, ['name', 'weight']]<\/code> به <code>.loc<\/code> نیاز دارد، یعنی <code>dogs.loc[:, ['name', 'weight']]<\/code>. و <code>at<\/code> و <code>iat<\/code> دسترسی‌دهنده‌هایی هستند که با کروشه استفاده می‌شوند، <code>df.at[...]<\/code>، نه متدهایی که با () صدا زده شوند.", "labels": ["از درس", "مثال داده"]}, {"title": "بررسی داده", "summary": "داده مهم نیست، فقط اطلاعات مهم است. فراداده، یعنی داده درباره‌ی داده، کار با آن اطلاعات را آسان‌تر می‌کند.", "bullets": ["<b>فراداده<\/b> داده را توصیف می‌کند. پیکسل‌های یک عکس داده‌اند. تاریخ و موقعیت GPS که همراهش ذخیره می‌شود فراداده است.", "خلاصه‌ها فراداده می‌سازند: حتی تعداد ردیف‌های یک DataFrame فراداده است.", "خلاصه کردن اطلاعات تازه‌ای اضافه نمی‌کند، اما صریح کردن یک دیدگاه کار روش‌هایی را که بعداً از آن استفاده می‌کنند ساده‌تر می‌کند.", "<code>describe()<\/code> در یک فراخوانی خلاصه‌ی آماری می‌دهد: تعداد، میانگین، انحراف معیار، کمینه، چارک‌ها و بیشینه. یک Series یا DataFrame با اندیس سفارشی برمی‌گرداند، پس می‌توانید مقدارها را با <code>loc<\/code> بردارید.", "وقتی سؤالی آرایه یا لیست می‌خواهد، نتیجه را با <code>to_numpy()<\/code> یا <code>to_list()<\/code> تبدیل کنید.", "مقادیر بولی به عدد تبدیل می‌شوند: <code>int(True)<\/code> برابر 1 و <code>int(False)<\/code> برابر 0 است. فکر کنید این برای شمردن چه معنایی دارد."], "labels": ["فراداده‌ی یک DataFrame", "مثال داده: describe()", "مقادیر بولی به‌عنوان عدد"]}, {"title": "هیستوگرام‌ها", "summary": "هیستوگرام می‌شمارد چند مقدار در هر مقدار یا بازه قرار می‌گیرند و تعدادها را به شکل میله رسم می‌کند.", "bullets": ["ویژگی‌ها یا <b>گسسته<\/b>اند (مجموعه‌ای محدود از مقادیر) یا <b>پیوسته<\/b> (هر مقداری در یک بازه). بعضی، مثل زمان یا تعداد کلیک، به هر دو شکل قابل بررسی‌اند: درباره‌اش فکر کنید.", "ویژگی‌های پیوسته در بازه‌هایی به نام <b>سطل<\/b> یا bin شمرده می‌شوند. گذاشتن مقادیر در سطل‌ها <b>گسسته‌سازی<\/b> نام دارد.", "سریع‌ترین راه: <code>df.hist()<\/code> برای هر ستون عددی یک هیستوگرام می‌کشد.", "seaborn کار سطح بالا، یعنی تقسیم و شمردن داده، را انجام می‌دهد. pyplot در mat ng"], "a": 1, "why": "Each bucket becomes one histogram bar."}, {"q": "What does a violin plot add to a boxplot?", "o": ["Outliers", "The shape of the distribution", "Colours", "A title"], "a": 1, "why": "Useful when data has several peaks."}, {"q": "Which format can hold nested dictionaries?", "o": ["CSV", "JSON", "Both equally", "Neither"], "a": 1, "why": "CSV is a flat 2D table."}, {"q": "A sensor reporting speed = 9999999 is…", "o": ["Noise", "A missing value", "An error code", "Information"], "a": 2, "why": "A special value used to signal a fault."}, {"q": "Imputing missing values with the mean…", "o": ["Adds new information", "Adds no new information", "Fixes the defect", "Removes outliers"], "a": 1, "why": "It's built from data you already have."}], "exercises": [{"t": "Two-condition filter", "lvl": "Easy", "task": "From the sales table below, select Zurich rows with sales of at least 175: <code>store = ['Bern', 'Zurich', 'Bern', 'Zurich', 'Zurich']<\/code>, <code>sales = [120, 180, 210, 95, 175]<\/code>.", "hint": "(df['store'] == 'Zurich') & (df['sales'] >= 175), each part in parentheses.", "sol": "import pandas as pd\ndf = pd.DataFrame({\n    'store': ['Bern', 'Zurich', 'Bern', 'Zurich', 'Zurich'],\n    'sales': [120, 180, 210, 95, 175]\n})\nprint(df[(df['store'] == 'Zurich') & (df['sales'] >= 175)])", "saved": {"stdout": "    store  sales\n1  Zurich    180\n4  Zurich    175\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Label vs position", "lvl": "Easy", "task": "Make a DataFrame of 4 products indexed by name with a <code>price<\/code> column. Print the price of milk with <code>loc<\/code>, and the last product's row with <code>iloc<\/code>.", "hint": "df.loc['milk', 'price'] and df.iloc[-1].", "sol": "import pandas as pd\ndf = pd.DataFrame({'price': [0.5, 2.8, 1.6, 6.9]},\n                  index=['apple', 'bread', 'milk', 'cheese'])\nprint(df.loc['milk', 'price'])\nprint(df.iloc[-1])", "saved": {"stdout": "1.6\nprice    6.9\nName: cheese, dtype: float64\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Change through loc", "lvl": "Easy", "task": "In the same table, raise the price of bread to 3.0 so the original DataFrame changes, then print it.", "hint": "Assign through the accessor: df.loc['bread', 'price'] = 3.0.", "sol": "import pandas as pd\ndf = pd.DataFrame({'price': [0.5, 2.8, 1.6, 6.9]},\n                  index=['apple', 'bread', 'milk', 'cheese'])\ndf.loc['bread', 'price'] = 3.0\nprint(df)", "saved": {"stdout": "        price\napple     0.5\nbread     3.0\nmilk      1.6\ncheese    6.9\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Spread of temperatures", "lvl": "Medium", "task": "For <code>[3.5, 7.2, 4.8, -1.0, 5.5, 6.1, 2.2]<\/code>, use <code>describe()<\/code> to print the median and the interquartile range (75% minus 25%).", "hint": "describe() returns a Series. Pick values with loc['50%'], loc['75%'] and loc['25%'].", "sol": "import pandas as pd\nd = pd.Series([3.5, 7.2, 4.8, -1.0, 5.5, 6.1, 2.2]).describe()\nprint('median:', d.loc['50%'])\nprint('IQR:', round(d.loc['75%'] - d.loc['25%'], 2))", "saved": {"stdout": "median: 4.8\nIQR: 2.95\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Clean error codes", "lvl": "Medium", "task": "A sensor logs <code>[21.5, -999, 22.1, 21.8, -999, 22.4]<\/code>, where -999 means failure. Replace the error code with NaN and print how many readings are missing and the mean of the rest.", "hint": "replace(-999, np.nan), then isna() and mean(), which skips NaN.", "sol": "import numpy as np\nimport pandas as pd\ntemps = pd.Series([21.5, -999, 22.1, 21.8, -999, 22.4]).replace(-999, np.nan)\nprint(temps.isna().sum(), 'missing')\nprint(round(temps.mean(), 2))", "saved": {"stdout": "2 missing\n21.95\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Round trip to CSV", "lvl": "Medium", "task": "Save a small DataFrame to CSV without the index, load it back with <code>pd.read_csv()<\/code>, and check the two are equal.", "hint": "to_csv(..., index=False), then read_csv(), then df.equals(loaded).", "sol": "import pandas as pd\ndf = pd.DataFrame({'city': ['Bern', 'Fribourg'], 'temp': [3.5, 4.1]})\ndf.to_csv('cities.csv', index=False)\nloaded = pd.read_csv('cities.csv')\nprint(loaded)\nprint(df.equals(loaded))", "saved": {"stdout": "       city  temp\n0      Bern   3.5\n1  Fribourg   4.1\nTrue\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Distribution check", "lvl": "Harder", "task": "Draw a histogram and a boxplot of the same 12 temperatures side by side, using <code>plt.subplots(1, 2)<\/code>.", "hint": "Pass ax=axes[0] to histplot and ax=axes[1] to boxplot.", "sol": "import seaborn as sns\nimport matplotlib.pyplot as plt\ntemps = [3.5, 7.2, 4.8, -1.0, 5.5, 6.1, 2.2, 4.0, 5.1, 6.8, 3.9, 14.0]\nfig, axes = plt.subplots(1, 2, figsize=(8, 3.5))\nsns.histplot(temps, bins=5, ax=axes[0])\nsns.boxplot(y=temps, ax=axes[1])\naxes[0].set_title('histogram')\naxes[1].set_title('boxplot')\nNone", "saved": {"stdout": "", "value": null, "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAe0AAAD0CAYAAAC2Gn4cAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAJDBJREFUeF7t3QuYTfX++PHPuI5hym1kMO6GYRCKkBQThqjToROScqvM4ZwKp6Mf3ejo6HQRiVIHUUrJUcolouRyUGqQ+10xLmOMGWOw/8/n+3/2PnOfvadZ216z3q/n2Y/Za6+191rf7bs/63sPcrlcLgEAAAGvWMCfIQAAMAjaAADYBEEbAACbIGgDAGATBG0AAGyCoA0AgE0QtG3s4MGD8qc//SnXK5g1a5bMnDkz3ys8cOCApKen57sfgGvnlVdekQ8//NCvJ7Bt2zYZOnSoV5956tQpOXPmjFf7ouAI2jZ26dIlOXr0aK5X0LBhQ2nUqFG+V9irVy85ceJEvvsBuHZOnz4tSUlJfj2Bixcvyq+//urVZ06ZMkXmzZvn1b4ouBIFPxSBIjk5WVasWCFBQUESExMj5cqVM6cWHh6e6RR3794tW7duNfvVr19fWrVqJT/88IPo/DobNmyQSpUqSePGjeWGG24wNwTffvut+aFo1qxZtuD//fffmxJ6mzZtzPElSpSQOnXqmLvtw4cPS82aNWX16tXSoEEDc/yPP/5oPr906dLmmGrVqplz02O/+eYbueWWW8z+58+fly5dukiFChVk/fr1pjahbdu2Urt27UBJbuCa0tJvfHy8NG3a1OStjDQ/79q1S6pXry7t27eXYsWKyZEjR+S3336Tm2++2bOr5t+6detK1ap both for two other functions, in English."}, {"id": "approximators", "title": "Function approximators, functions and values", "summary": "A value is a reading. A function maps inputs to values. A family of functions, also called a function approximator, gives a different function for each parametrization.", "bullets": ["Maths is just the language for describing the process, in the same way that data isn't the point either. Described in maths, a computer can try to <b>approximate<\/b> it.", "A <b>value<\/b> is a quantity with a unit, such as <code>3.-chf<\/code>.", "A <b>function<\/b> is a mapping: see one value here, expect a matching value there. Six eggs at 0.50 chf each means 3.- at checkout: <code>lambda n_eggs: n_eggs * 0.50<\/code>.", "A <b>family of functions<\/b> behaves the same way but depends on a <b>parametrization<\/b>: <code>lambda n_eggs: n_eggs * egg_cost<\/code>. Change <code>egg_cost<\/code> and you get a different, similar function.", "Fix the parameters and you get <i>one function<\/i>. Give that function an input and you get <i>one value<\/i>.", "A function returns a value. A function approximator returns a function, so it's itself a function whose output has type <i>function<\/i>."], "tables": [{"caption": "Three levels of abstraction", "head": ["Level", "Example", "Gives you"], "rows": [["Family of functions", "<code>n_eggs * egg_cost<\/code>", "A function, once egg_cost is fixed"], ["Function", "<code>lambda n_eggs: n_eggs * 0.50<\/code>", "A value, once you give n_eggs"], ["Value", "<code>3.0<\/code>", "Nothing more: it's a reading"]]}], "cells": [{"label": "From the lecture: eggs", "code": "egg_cost = 0.50\nfn = lambda n_eggs: n_eggs * egg_cost\nprint(fn(6))\n\negg_cost = 0.65\nfn = lambda n_eggs: n_eggs * egg_cost\nprint(fn(6))\nprint(type(fn))", "saved": {"stdout": "3.0\n3.9000000000000004\n<class 'function'>\n", "value": null, "error": null, "images": [], "html": null}}], "note": "Q2 asks you to write a <code>def<\/code> that returns a <code>lambda<\/code>. It sounds strange, but you already have every piece. As the lecture puts it, you're rediscovering machine learning yourself."}, {"id": "linear", "title": "Linear models", "summary": "In machine learning, a model is a family of functions. A trained model is one specific function: the family plus a chosen parametrization.", "bullets": ["<b>Model<\/b>: a function approximator that you expect to include your target function.", "<b>Trained model<\/b> (also learned model or candidate solution): the approximator with specific parameters. \"Trained\" is often left out, so read the context.", "Among all the functions in the family, one is closest to the target. Your goal is to find the parametrization that produces it.", "For lines, the family is <code>y = m*x + q<\/code>. Finding good <code>m<\/code> and <code>q<\/code> by hand is exactly what training does automatically.", "In Jupyter, <code>@ipywidgets.interact(...)<\/code> above <code>def plot(m, q):<\/code> adds sliders. That <code>@<\/code> line is a <b>decorator<\/b>: a function that changes another function's behaviour.", "On a local installation you need to install <code>ipywidgets<\/code> first. On Colab and the course server it's already there."], "widget": "linefit", "cells": [{"label": "From the lecture (with one guess)", "code": "import seaborn as sns\nimport numpy as np\n\nnpoints = 100\nplot_range = 5\np_x = np.linspace(-plot_range, plot_range, npoints)\nnoise_mu = 0\nnoise_sigma = 2\np_y_noise = np.random.normal(noise_mu, noise_sigma, npoints)\ntrue_m = -2\ntrue_q = 3\np_y_true = true_m * p_x + true_q\np_y = p_y_true + p_y_noise\n\ndef plot(m, q):\n    print(f\"y = {m} x + {q}  (m=`{m}`, q=`{q}`)\")\n    x = np.linspace(-plot_range, plot_range, 5)\n    y = m*x+q\n    sns.scatterplot(x=p_x, y=p_y)\n    sns.lineplot(x=x, y=y, c='r')\n\nplot(0.0, 0.0)", "saved": {"stdout": "y = 0.0 x + 0.0  (m=`0.0`, q=`0.0`)\n", "value": null, "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAeYAAAFvCAYA <\/b> form hides q: add it as the last weight and append a 1 to the inputs. Then the whole model is just <code>np.dot(w, x)<\/code>.", "That dot product is a <b>linear combination<\/b>, and in all its forms it's the only linear function. Everything else is nonlinear, and so is your data.", "Why study linear models, then? They're the simplest approximator to learn from, and a theorem says they can approximate any nonlinear function within a small range."], "formula": "f(x₁, x₂, …, xₙ) = w₁×x₁ + w₂×x₂ + … + wₙ×xₙ + q", "cells": [{"label": "Data example: segments approximating a curve", "code": "import numpy as np\nimport seaborn as sns\nimport matplotlib.pyplot as plt\nfig, axes = plt.subplots(1, 3, figsize=(9, 3))\ntrue_x = np.linspace(0, 2 * np.pi, 200)\nfor ax, nsegs in zip(axes, [3, 6, 20]):\n    sns.lineplot(x=true_x, y=np.sin(true_x), ax=ax, color='green')\n    seg_x = np.linspace(0, 2 * np.pi, nsegs + 1)\n    sns.lineplot(x=seg_x, y=np.sin(seg_x), ax=ax, marker='o')\n    ax.set_title(f\"{nsegs} segments\")\n    ax.set(xticks=[], yticks=[])", "saved": {"stdout": "", "value": null, "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAgQAAADDCAYAAAD9cAmzAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAUr9JREFUeF7tnQd8VFX2x3+Z9F5IL4RACjUNQic0aQLSq1jAxq4FdV1XXd3/usuurrqKYhdREWmK0qu0UENJISSBECCF9N7LJDP/z7nsYIDEZDIlU87388kHZpL33r33nXffuaddE7lcLgfDMAzDMEaNxKh7zzAMwzCMgBUChmEYhmFYIWAYhmEYhhUChmEYhmFYIWAYhmEYhjDT52HIyMhASkoKampq4OvriyFDhkAi4bAIRv84f/48rl+/jm7dumHw4MGwt7fXv04wRsO1a9eQnJwMU1NTDBo0CB4eHnf0vbKyEseOHQMlsY0ZMwYODg5GMzb6jIk+px3ef//9CAwMFJPnhQsX4OLigm+//RYWFhb6fE9aZeXKlfDy8sJjjz1mcH0zZpqamvDcc88hLS1NTKylpaUYN24cFi5caHDDsmfPHuzatQuffvqpwfXNmPj888+xceNGDBw4EFKpFCdPnsR7770n5JbIy8vD/PnzER4eDhMTE8THx2PLli1i/jI0jh8/ji+//BLff/+9QXRNry0ENMEoqKurE5oorbSGDx/e6s2hyfbmzZtCW/X39xfCqoA02pycHHTv3h22trZ3HF9RUSGOI+WjublZHGdtbY3GxkY0NDTAzs4OV65cEef19vYWx2ZnZ4vf9+rV65620ANDVo0ePXrAzOzWLaAXQ21trThHenq6UGqoLQS d": "regression", "title": "Regression", "summary": "Regression means using a model to predict the underlying function's output for inputs you have no data for.", "bullets": ["Algorithms named regression (linear, logistic and others) all do three things: pick a model, find parameters that match the data, and use the result to predict outputs for new inputs.", "The notebook creates your personal data once, saves it to <code>data_lect_5.csv<\/code>, and reuses it afterwards. Everyone gets different data, so don't share it.", "<code>os.path.exists(fname)<\/code> checks whether a file is already there. The <code>os<\/code> module talks to your operating system.", "<code>np.random.normal<\/code> draws from a Gaussian (normal) distribution, with values clustered around the mean. <code>np.random.uniform<\/code> draws every value in a range with equal chance.", "For Q7, build the figure in layers: one scatterplot for the data, a lineplot for your model, and a second scatterplot for your predictions."], "cells": [{"label": "From the lecture: your personal data", "code": "import os\nimport numpy as np\nimport pandas as pd\nfname = 'data_lect_5.csv'\nif os.path.exists(fname):\n    data = pd.read_csv(fname, index_col=0)\nelse:\n    pts = np.linspace(-5, 5, 1000)\n    x = np.random.choice(pts, 100, replace=False)\n    n = np.random.normal(0, 3, 100)\n    m, q = np.random.uniform(-5, 5, 2)\n    y = m*x+q+n\n    data = pd.DataFrame({'x': x, 'y': y})\n    data.to_csv(fname, index=False)\nprint(list(data.columns))\nprint(data.shape)", "saved": {"stdout": "['x', 'y']\n(100, 2)\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "A bug in the notebook. The file is saved with <code>index=False<\/code> but read back with <code>index_col=0<\/code>, so the second time, <code>x<\/code> becomes the index and the DataFrame only has a <code>y<\/code> column. Later, <code>df['x']<\/code> fails with <code>KeyError: 'x'<\/code>. Run this cell twice to see it happen. The fix is to read it with plain <code>pd.read_csv(fname)<\/code>."}, {"id": "sklearn", "title": "Trying out linear regression with scikit-learn", "summary": "scikit-learn trains the model for you: create it, fit it on a matrix X and labels y, then read its parameters or predict.", "bullets": ["<code>from sklearn.linear_model import LinearRegression<\/code>. The library is installed as <code>scikit-learn<\/code> but imported as <code>sklearn<\/code>.", "<b>X must always be a matrix<\/b>, a strictly 2D tensor, even with a single feature. <code>[[n] for n in df['x']]<\/code>, <code>df[['x']]<\/code> and <code>arr.reshape(-1, 1)<\/code> all make one.", "<code>model.fit(X, y)<\/code> trains the model and returns it, so calls can be chained: <code>LinearRegression().fit(X, y)<\/code>.", "The learned parameters are in <code>model.coef_<\/code> (always a vector, one weight per column of X) and <code>model.intercept_<\/code> (a scalar).", "<code>model.predict(X)<\/code> gives ŷ. It also needs a matrix, even for a single row.", "Doing maths on a whole column at once, like <code>df['x'] * m + q<\/code>, is called <b>vectorization<\/b>. <code>np.all()<\/code> is True if every value is True, <code>np.any()<\/code> if at least one is.", "<b>Refactoring<\/b> changes code without changing what it does, to make it easier to read, debug, maintain and reuse."], "cells": [{"label": "Data example: fit, inspect, predict", "code": "import numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\n\nrng = np.random.default_rng(0)\ndf = pd.DataFrame({'x': np.linspace(-5, 5, 50)})\ndf['y'] = 1.5 * df['x'] - 2 + rng.normal(0, 1, 50)\n\nmodel = LinearRegression().fit(X=df[['x']], y=df['y'])\nm = model.coef_[0]\nq = model.intercept_\nprint(f\"y = {m:.2f}x {'+' if q >= 0 else '-'} {abs(q):.2f}\")\nprint(model.predict(pd.DataFrame({'x': [-7, 7]})).round(2))", "saved": {"stdout": "y = 1.62x - 1.87\n[-13.18   9.44]\n", "value": null, "error": null, "images": [], "html": null}}, { oduleNotFoundError", "No module named 'sklearn'", "Install the package scikit-learn (its import name is sklearn)."], ["FileNotFoundError", "No such file or directory: 'data_lect_5.csv'", "Run the cell that creates the file first, from the same folder."], ["ValueError", "Found input variables with inconsistent numbers of samples: [100, 99]", "X and y have different lengths. Check how you built them."], ["UserWarning", "X does not have valid feature names", "You fitted with a DataFrame but predicted with a plain list, or the reverse. Use the same kind for both."]], "glossary": [["Function approximation", "Finding a function close to the unknown process behind the data."], ["Family of functions", "Functions that behave the same way and differ only in their parameters."], ["Function approximator", "The equation of a family of functions."], ["Parametrization", "The specific parameter values that pick one function from a family."], ["Model / trained model", "A family of functions / one function from it, with parameters chosen."], ["Linear function", "y = mx + q, or a linear combination of inputs plus an intercept."], ["Weights (W)", "The coefficients, one per input."], ["Intercept / bias (q)", "Where the line crosses the y axis."], ["Linear combination", "The dot product of weights and inputs."], ["Affine form", "The intercept treated as one more weight, with a 1 added to the inputs."], ["Regression", "Using a model to predict outputs for new inputs."], ["fit / predict", "Train a model on data / compute its predictions ŷ."], ["coef_ / intercept_", "Where scikit-learn stores the learned weights and intercept."], ["Vectorization", "Applying an operation to a whole array or column at once."], ["Gaussian noise", "Random values from a normal (bell-shaped) distribution."], ["Decorator", "A function, written with @, that changes another function's behaviour."], ["Refactoring", "Changing code to be clearer without changing what it does."]], "fa": {"title": "مدل‌سازی خطی و رگرسیون", "short": "تقریب تابع، مدل‌های خطی، رگرسیون و اولین مدل شما با scikit-learn", "topics": [{"title": "داده، اطلاعات و توابع مشابه", "summary": "داده مهم نیست، اطلاعات مهم است. اطلاعات به ما کمک می‌کند تابع زیربنایی را که داده را می‌سازد مدل کنیم.", "bullets": ["داده‌ی بیشتر بدون اطلاعات بیشتر کمکی نمی‌کند. کتابی که جمله‌ی «خودکار روی میز است» را ۱۰٬۰۰۰ بار تکرار کند، انگلیسی کمی یادتان می‌دهد.", "یک فایل ۳ گیگابایتی پر از صفر تقریباً هیچ چیزی درباره‌ی فرایندی که آن را ساخته نمی‌گوید.", "یک تُن آرد و یک هکتولیتر آب با فقط سه تخم‌مرغ هنوز فقط کیک کمی می‌سازد: کمیاب‌ترین ماده محدودتان می‌کند، درست مثل اطلاعات.", "سؤال بعدی این است که اصلاً چطور از داده استفاده کنیم. برای جواب، درس از سر دیگر شروع می‌کند: <b>تقریب تابع<\/b>.", "برای رسم یک تابع: با <code>np.linspace()<\/code> مقادیر x را بسازید، تابع را اعمال کنید تا y به دست آید (NumPy خودش نگاشت می‌کند) و یک نمودار خطی seaborn بکشید. ۱۰۰ نقطه در یک بازه‌ی معنادار کافی است."], "note": "sin و cos دقیقاً یک شکل دارند که فقط به پهلو جابه‌جا شده. شبیه‌اند یا متفاوت؟ برای هر دو جواب می‌شود دلیل آورد، و Q1 از شما می‌خواهد برای دو تابع دیگر هر دو را به انگلیسی استدلال کنید.", "labels": ["رسم دو تابع"]}, {"title": "تقریب‌زننده‌های تابع، توابع و مقادیر", "summary": "مقدار یک خوانش است. تابع ورودی‌ها را به مقادیر نگاشت می‌کند. خانواده‌ای از توابع، که به آن تقریب‌زننده‌ی تابع هم می‌گویند، برای هر پارامتری‌سازی یک تابع متفاوت می‌دهد.", "bullets": ["ریاضی فقط زبانی برای توصیف فرایند است، همان‌طور که داده هم هدف نیست. وقتی با ریاضی توصیف شود، کامپیوتر می‌تواند آن را <b>تقریب<\/b> بزند.", "<b>مقدار<\/b> کمیتی با واحد است، مثل <code>3.-chf<\/code>.", "<b>تابع<\/b> یک نگاشت است: یک مقدار را اینجا ببینید و مقدار متناظرش را آنجا انتظار داشته باشید. شش تخم‌مرغ با قیمت هر کدام ۰٫۵۰ فرانک یعنی ۳ فرانک سر صندوق: <code>lambda n_eggs: n_eggs * 0.50<\/code>.", "<b>خانواده‌ای از توابع<\/b> یکسان رفتار می‌کنند اما به یک <b>پارامتری‌سازی<\/b> بستگی دارند: <code>lambda n_eggs: n_eggs * egg_cost<\/code>. <code>egg_cost<\/code> را عوض کنید و تابعی متفاوت اما مشابه می‌گیرید.", "پارامترها را ثابت کنید تا <i>یک تابع<\/i> بگیرید. به آن تابع یک ورودی بدهید تا <i>یک مقدار<\/i> بگیرید.", "تابع مقدار برمی‌گرداند. تقریب‌زننده‌ی تابع یک تابع برمی‌گرداند، پس خودش تابعی است که خروجی‌اش از نوع <i>تابع<\/i> است."], "tables": [{"caption": "سه سطح انتزاع", "head": ["سطح", "مثال", "چه می‌دهد"], "rows": [["خانواده‌ای از توابع", "<code>n_eggs * egg_cost<\/code>", "یک تابع، وقتی egg_cost ثابت شود"], ["تابع", "<code>lambda n_eggs: n_eggs * 0.50<\/code>", "یک مقدار، وقتی n_eggs را بدهید"], ["مقدار", "<code>3.0<\/code>", "دیگر چیزی نمی‌دهد: یک خوانش است"]]}], "note": "Q2 از شما می‌خواهد یک <code>def<\/code> بنویسید که یک <code>lambda<\/code> برگرداند. عجیب به نظر می‌رسد، اما همه‌ی قطعه‌هایش را دارید. به قول درس، دارید یادگیری ماشین را خودتان کشف می‌کنید.", "labels": ["از درس: تخم‌مرغ‌ها"]}, {"title": "مدل‌های خطی", "summary": "در یادگیری ماشین، مدل خانواده‌ای از توابع است. مدل آموزش‌دیده یک تابع مشخص است: خانواده به‌علاوه‌ی یک پارامتری‌سازی انتخاب‌شده.", "bullets": ["<b>مدل<\/b>: تقریب‌زننده‌ای از تابع که انتظار دارید تابع هدف شما را در بر داشته باشد.", "<b>مدل آموزش‌دیده<\/b> (یا مدل یادگرفته، راه‌حل نامزد): تقریب‌زننده با پارامترهای مشخص. کلمه‌ی «آموزش‌دیده» اغلب حذف می‌شود، پس از متن بفهمید.", "در میان همه‌ی توابع خانواده، یکی به هدف نزدیک‌تر است. هدف شما پیدا کردن پارامتری‌سازی‌ای است که آن را می‌سازد.", "برای خط‌ها، خانواده <code>y = m*x + q<\/code> است. پیدا کردن <code>m<\/code> و <code>q<\/code> خوب با دست، دقیقاً همان کاری است که آموزش خودکار انجام می‌دهد.", "در ژوپیتر، <code>@ipywidgets.interact(...)<\/code> بالای <code>def plot(m, q):<\/code> اسلایدر اضافه می‌کند. آن خط <code>@<\/code> یک <b>دکوراتور<\/b> است: تابعی که رفتار تابع دیگری را تغییر می‌دهد.", "روی نصب محلی اول باید <code>ipywidgets<\/code> را نصب کنید. روی Colab و سرور دوره از قبل نصب است."], "note": "اسلایدرهای ipywidgets به ژوپیتر نیاز دارند، پس این صفحه زمین بازی اسلایدری خودش را بالاتر دارد. سلول، کد درس را با یک حدس دستی نشان می‌دهد. اعداد داخل <code>plot(0 طی نیست."}], "assignment": ["y=2x+2 و y=2x+3 را با رنگ‌های متفاوت رسم کنید و به انگلیسی استدلال کنید چرا می‌شود آن‌ها را شبیه و چرا متفاوت دانست.", "یک تقریب‌زننده‌ی تابع add_n(n) با def بنویسید که یک lambda برگرداند که n را به ورودی x اضافه می‌کند. آزمایشش کنید.", "کد رسم درس را اجرا کنید، m و q نزدیک به (اما نه دقیقاً برابر با) مقادیر واقعی پیدا کنید و نقطه‌های نمودار پراکندگی را سبز کنید.", "دو باگ کد تقریب با پاره‌خط را پیدا و اصلاح کنید.", "آیا y=x² خطی است یا غیرخطی؟ توضیح دهید چرا.", "با کد درس یک پارامتری‌سازی برای داده‌ی شخصی‌تان پیدا کنید و بعد y را برای x=-7 و x=7 پیش‌بینی کنید.", "در یک شکل، با رنگ‌های متفاوت رسم کنید: داده‌تان، مدلتان به شکل خط و نقطه‌های پیش‌بینی‌شده.", "خط‌های طولانی print درباره‌ی coef_ و intercept_ را بازسازی کنید تا خواندنشان آسان‌تر شود.", "توضیح دهید چرا x_matrix مثل y_hat به DataFrame اضافه نشد.", "در یک سلول: ۱۰۰ نقطه‌ی x، یک تابع مربع‌کننده، نویز گاوسی روی y، یک رگرسیون خطی scikit-learn و رسم مدل روی داده، همه با pandas و seaborn. درباره‌ی کیفیت برازش نظر بدهید."], "next": {"title": "پیش از هفته‌ی ۶", "summary": "همین حالا اولین روش واقعی یادگیری ماشین را به کار بردید. هفته‌ی بعد معرفی درستی از scikit-learn می‌دهد.", "bullets": ["مطمئن شوید می‌توانید فرق یک مقدار، یک تابع و یک خانواده از توابع را توضیح دهید.", "Q10 را با بازه‌های مختلف x امتحان کنید: خط در یک بازه‌ی کوچک یک منحنی را خوب برازش می‌دهد و در یک بازه‌ی بزرگ بد.", "قانون scikit-learn را به یاد داشته باشید: X همیشه دوبعدی است."]}}, "quiz": [{"q": "A book repeats one sentence 10,000 times. What does that show?", "o": ["More data means more information", "More data without new information doesn't help", "The book is compressed", "Repetition is noise"], "a": 1, "why": "Data only helps through the information it carries."}, {"q": "Which of these is a value?", "o": ["lambda n: n * 0.5", "n * egg_cost", "3.0", "LinearRegression"], "a": 2, "why": "A value is a reading. The others are functions or families."}, {"q": "What does a function approximator return, once its parameters are fixed?", "o": ["A value", "A function", "A dataset", "An error"], "a": 1, "why": "Fix the parametrization and you get one function."}, {"q": "What is a \"trained model\"?", "o": ["A family of functions", "A specific function: the family plus chosen parameters", "The training data", "A plot"], "a": 1, "why": "\"Model\" alone often means the family."}, {"q": "In y = mx + q, what is q?", "o": ["The slope", "The intercept", "The input", "The noise"], "a": 1, "why": "Where the line crosses the y axis."}, {"q": "What is the only kind of linear function?", "o": ["Any polynomial", "A linear combination of inputs plus an intercept", "Anything with x", "A sine"], "a": 1, "why": "Everything else is nonlinear."}, {"q": "Why use linear models for a nonlinear world?", "o": ["The world is linear", "They approximate any smooth function well over small ranges", "They're always exact", "Nonlinear models don't exist"], "a": 1, "why": "More, shorter segments give a closer fit."}, {"q": "What is the affine form?", "o": ["Removing the inputs", "Treating the intercept as one more weight, with a 1 added to the inputs", "Squaring the inputs", "Dividing by q"], "a": 1, "why": "Then the model is just a dot product."}, {"q": "What does regression do?", "o": ["Deletes outliers", "Predicts outputs for new inputs", "Sorts data", "Draws histograms"], "a": 1, "why": "Model, fit, then predict."}, {"q": "What shape must X have for scikit-learn?", "o": ["1D vector", "2D matrix", "Scalar", "Any shape"], "a": 1, "why": "Even one feature must be a matrix with one column."}, {"q": "Which gives a 2D input from a DataFrame column x?", "o": ["df['x']", "df[['x']]", "df.x", "list(df['x'])"], "a": 1, "why": "Double brackets select a DataFrame, which is 2D."}, {"q": "Where does LinearRegression store the slope?", "o": ["model.slope", "model.coef_", "model.m", "model.weights()"], "a": 1, "why": "coef_ is a vector, with one weight per feature."}, {"q": "What does fit() return?", "o": ["None", "The predictions", "The model itself", "The error"], "a": 2, "why": "So you can chain LinearRegression().fit(X, y)."}, {"q": "How should you compare two float arrays?", "o": ["a == b", "np.allclose(a, b)", "a is b", "a.equals(b)"], "a": 1, "why": "Floats can differ in the last digits."}, {"q": "What does the @ line above a def do?", "o": ["Comments it out", "Applies a decorator that changes the function", "Makes it private", "Imports it"], "a": 1, "why": "@ipywidgets.interact adds sliders, for example."}, {"q": "What is refactoring?", "o": ["Adding features", "Changing code to be clearer without changing what it does", "Deleting tests", "Speeding up only"], "a": 1, "why": "It's done for the humans who read the code."}], "exercises": [{"t": "Prices as functions", "lvl": "Easy", "task": "With the family <code>total = n_eggs * egg_cost<\/code>, compute the price of 6 eggs for egg costs 0.45, 0.50 and 0.65.", "hint": "Loop over the costs and fix egg_cost each time.", "sol": "for egg_cost in [0.45, 0.50, 0.65]:\n    fn = lambda n_eggs: n_eggs * egg_cost\n    print(egg_cost, round(fn(6), 2))", "saved": {"stdout": "0.45 2.7\n0.5 3.0\n0.65 3.9\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Predict with a line", "lvl": "Easy", "task": "A trained model is <code>y = 1.5x - 2<\/code>. Use NumPy to predict y for x = -2, 0 and 4 in one vectorized line.", "hint": "Make an array of x, then 1.5 * x - 2.", "sol": "import numpy as np\nx = np.array([-2, 0, 4])\nprint(1.5 * x - 2)", "saved": {"stdout": "[-5. -2.  4.]\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Which line is better?", "lvl": "Medium", "task": "For <code>x = [0, 1, 2, 3]<\/code> and <code>y = [1.1, 2.9, 5.2, 6.8]<\/code>, compute the mean squared error of two guesses: <code>y = 2x + 1<\/code> and <code>y = 1.5x + 1.5<\/code>. Which is better?", "hint": "Mean of (y - y_hat) ** 2 for each guess. Smaller is better.", "sol": "import numpy as np\nx = np.array([0, 1, 2, 3])\ny = np.array([ your personal data, then predict y for x=-7 and x=7.", "Plot in one figure, in different colours: your data, your model as a line, and your predicted points.", "Refactor the long print lines about coef_ and intercept_ so they're easier to read.", "Explain why x_matrix wasn't added to the DataFrame the way y_hat was.", "In one cell: 100 x points, a squaring function, Gaussian noise on y, a scikit-learn linear regression, and a plot of the model over the data, all with pandas and seaborn. Comment on the quality of the fit."], "next": {"title": "Before Week 6", "summary": "You've just used your first proper machine learning method. Next week gives scikit-learn a proper introduction.", "bullets": ["Make sure you can explain the difference between a value, a function and a family of functions.", "Try Q10 with different x ranges: a line fits a curve well over a small range, and badly over a large one.", "Remember the scikit-learn rule: X is always 2D."]}}, {"n": 6, "title": "scikit-learn and classification", "short": "Risk minimization, decision boundaries, the Perceptron and Logistic Regression", "topics": [{"id": "libraries", "title": "Libraries seen so far", "summary": "Your toolbox keeps growing. This week adds scipy and scikit-learn on top of NumPy, pandas, matplotlib and seaborn.", "bullets": ["<a href=\"https://scipy.org/\"><b>scipy<\/b><\/a> extends NumPy with advanced scientific tools, such as special data structures and <b>sparse matrices<\/b> (mostly zeros or missing values).", "It holds algorithms used across many sciences. Over time, many moved into NumPy submodules like <code>linalg<\/code> and <code>random<\/code>.", "<a href=\"https://scikit-learn.org/stable/index.html\"><b>scikit-learn<\/b><\/a> began about 15 years ago as the attempt to extend scipy into a machine learning library.", "Today it's fast and very reliable for the fundamental methods. It's seen mostly as a data analysis tool because it never moved into deep learning.", "Start notebooks with one import cell (numpy, pandas, seaborn, pyplot) and run cells in order. Copy it from old notebooks when it's missing."], "tables": [{"caption": "Your toolbox so far", "head": ["Library", "Usual import", "Used for"], "rows": [["NumPy", "<code>import numpy as np<\/code>", "Fast arrays and maths"], ["pandas", "<code>import pandas as pd<\/code>", "Tables of data (DataFrames)"], ["matplotlib", "<code>from matplotlib import pyplot as plt<\/code>", "Low-level plotting"], ["seaborn", "<code>import seaborn as sns<\/code>", "Good-looking statistical plots"], ["scipy", "<code>import scipy<\/code>", "Advanced scientific computing"], ["scikit-learn", "<code>import sklearn<\/code>", "Machine learning: fit, predict"]]}], "cells": [], "note": "Q1 asks how to check whether scipy and scikit-learn are installed, and how to install them on <i>your<\/i> system. Week 2's imports topic and the ModuleNotFoundError rows in earlier error guides are good starting points."}, {"id": "sklearn", "title": "Introducing scikit-learn", "summary": "scikit-learn covers classification, regression, clustering, dimensionality reduction, model selection and preprocessing, and every model follows the same pattern.", "bullets": ["Import what you need, such as <code>from sklearn.linear_model import Perceptron<\/code>. A short alias like <code>skl<\/code> exists but isn't as standard as <code>np<\/code> or <code>pd<\/code>.", "<a href=\"https://scikit-learn.org/stable/index.html\">Its home page<\/a> lists the main areas. Some algorithms there are outdated, and the course will skip them for better alternatives.", "<b>Clustering<\/b> is the core of unsupervised learning. So far the course has only done supervised learning.", "<b>Dimensionality<\/b> methods lower the number of features (easier for humans) or raise it (easier for machines).", "<b>Input X must be 2D<\/b>, a matrix with one row per point. <b>Labels y must be 1D<\/b>, one label per point.", "Every model works the same way: create it, <code>fit(X, y)<\/code>, then <code>predict(X)<\/code> and read the learned parameters."], "cells": [{"label": "Shapes scikit-learn expects", "code": "from sklearn.datasets import load_iris\niris = load_iris()\nX = iris['data']\ny = iris['target']\nprint('X:', X.shape, '(2D: points x features)')\nprint('y:', y.shape, '(1D: one label per point)')", "saved": {"stdout": "X: (150, 4) (2D: points x features)\ny: (150,) (1D: one label per point)\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "The notebook says scikit-learn can't take DataFrames. Recent versions do accept DataFrames and Series, as the notebook itself says later. Just make sure X is still 2D (<code>df[['a', 'b']]<\/code>) and y is 1D (<code>df['label']<\/code>)."}, {"id": "risk", "title": "Improving on regression: risk minimization", "summary": "Training means defining how bad a model is, then searching for the parameters that make it as good as possible. Linear regression does this with the square loss.", "bullets": ["Two ways to find parameters: <b>closed form<\/b> (solve an equation for the optimum directly) or <b>iterative<\/b> (try, fail, adjust, repeat).", "Most machine learning models are iterative, which lets them improve as more data arrives. Linear regression is closed form.", "The error on one point is called the <b>loss<\/b>. The simplest is |y − ŷ|, where |…| means absolute value.", "Linear regression uses the <b>square loss<\/b>, (y − ŷ)². It's always positive and makes a few big errors cost more than many small ones: (3+2)² = 25, almost three times 3² = 9.", "The <b>risk<\/b> is the total loss over the whole dataset. Training minimises the risk.", "Most material online only talks about the loss, because that's the part that changes between methods."], "formula": "Risk(dataset) = Σ Loss(x) = Σ (y − model(x))²", "cells": [{"label": "Data example: losses as vertical lines", "code": "import numpy as np\nimport pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\nfrom sklearn.linear_model import LinearRegression\n\nrng = np.random.default_rng(3)\ndf = pd.DataFrame({'x': np.linspace(-5, 5, 12)})\ndf['y'] = 1.2 * df['x'] + 1 + rng.normal(0, 1.5, 12)\nmodel = LinearRegression().fit(df[['x']], df['y'])\ndf['y_hat'] = model.predict(df[['x']])\n\nplt.figure(figsize=(6, 4))\nsns.scatterplot(data=df, x='x', y='y')\nsns.lineplot(data=df, x='x', y='y_hat', color='red')\nplt.vlines(df['x'], df['y'], df['y_hat'], colors='green')\nlosses = (df['y'] - df['y_hat']) ** 2\nprint('Risk:', round(losses.sum(), 2))", "saved": {"stdout": "Risk: 60.62\n", "value": null, "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAZEAAAEQCAYAAABxzUkqAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAALUFJREFUeF7t3QlYVGX7BvAbBBEBF1QUTMXcUHHFL3NLLJc2l7QstT4zS61/Zi6lqemXuaWJYtlirqVpueuXaeWemiluKGouuWDuqCAgAsP/et7j8KGADMMMnDNz/65rrphpYM45g9zzbs/rkpaWlgYiIiIruFrxPURERApDhIiIrMYQISIiqzFEiIjIagwRIiKympvV32kwJpMJ8fHxcHd3h4uLi8GOnoioYMgE3uTkZHh5ecHVNXO7w2lCRALkr7/+Kph3gYjI4KpXrw4fH59MZ+E0ISItECEXonDhwoZ6Ow8dOoTg4GBDHXNe8ZydA99n/btz5476AG7+G3o/pwkRcxeWBIiHh4f+37n7GPGY84rn7Bz4PhtDdsMA+RYi0p20f/9+HD16FJUqVULr1q3vuXIHDx7EihUrUKRIEXTv3h0VKlTI8spKKi5YsAAnT55Ew4YN0blz52xPjoiI7CvfZmft2LEDc+fOxebNm7Fu3bp7zkoCoW/fvioU/P390aNHDxU6WRk1ahQOHDiAtm3bYtmyZepnEhFRwci3lkibNm3Ubd68eaofNKNFixaha9euaN++vXp4z549+Omnn9RjGV27dg3r16/H77//rmYKSOC8/vrr6NWrF1sjREQFIN9aIg9y5MgR1K1bN/0pMogsj91PBncCAwNVgAgZJL9x4wauX79eAJeOiIjyrSXyIBIE3t7e6U+RaWRRUVGZvuX+5wl5roSIr6+vRe/m/a0go4iIiDDKodoMz9k56OF9dnNzAwoXx63bJvgUKYS0OzeQkpJitzdAD+dsK7oIkeLFi98zBnLr1i2UKFEi0znKY/ePlWT33OxIK8dos0HkFy4kJMRW77kh8Jydgx7eZ5MpDTsjL2Dq/L1ISk6Fh3shDOzWEE0a+MPV1fYLk/VwzrmRlJT0wA/fuujOkm6pw4cPp5+XfF2tWrVM51mlShX8/fffSExMVP9PBuSlBWNpK4SI6H4XrsZj6iItQIT8V+7L45SzfAuRmJgYLF++HJGRkYiOjlZfnzp1Sh3hSy+9pAbXN2zYgKVLl2L37t3o0KGD+n9r167FyJEj1dd+fn5o2bIlxowZo54zduxYNZMru/nLREQ5iYlNVMGxo+gIdTMHSUyc9mGVHizfQkSaRBIaMqOqUaNG6uu4uDh1dEFBQZg6dSp++eUXtV5EZnCZl9eXL18e9erVSz+L8ePHIyAg
