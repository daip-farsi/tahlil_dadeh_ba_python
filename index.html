t bug", "A mistake that gives wrong results without an error message."], ["snake_case", "Naming style with lowercase words joined by underscores."]], "quiz": [{"q": "In what order does the Jupyter kernel remember your code?", "o": ["Top to bottom, as the cells appear", "The order you ran the cells", "Alphabetical by variable name", "Only the last cell you ran"], "a": 1, "why": "The kernel follows execution order. That's why the In [n] numbers matter."}, {"q": "What is the keyboard shortcut to run a cell?", "o": ["Ctrl + S", "Alt + R", "Shift + Enter", "Tab"], "a": 2, "why": "Shift + Enter runs the cell and moves to the next one."}, {"q": "What does REPL stand for?", "o": ["Run, Edit, Print, Leave", "Read, Eval, Print Loop", "Repeat Every Python Line", "Return, Evaluate, Pass, Loop"], "a": 1, "why": "The kernel reads your code, evaluates it, prints the result and loops back."}, {"q": "What does 7 // 2 give?", "o": ["3.5", "3", "1", "4"], "a": 1, "why": "// is integer division: it drops the remainder."}, {"q": "What does 7 % 2 give?", "o": ["1", "3", "3.5", "0"], "a": 0, "why": "% returns the remainder of integer division."}, {"q": "What does print() return?", "o": ["The text it printed", "True", "None", "0"], "a": 2, "why": "print() shows its argument but returns None."}, {"q": "Which structure is ordered but can't be changed?", "o": ["list", "set", "dict", "tuple"], "a": 3, "why": "Tuples are immutable lists."}, {"q": "lst = [10, 20, 30]. What is lst[-1]?", "o": ["10", "20", "30", "Error"], "a": 2, "why": "Negative positions count from the end."}, {"q": "How many items are in {1, True, 2}?", "o": ["3", "2", "1", "Error"], "a": 1, "why": "True equals 1 in Python, so the set treats them as the same value."}, {"q": "What does range(4) produce?", "o": ["1, 2, 3, 4", "0, 1, 2, 3", "0, 1, 2, 3, 4", "4"], "a": 1, "why": "range starts at 0 and stops before the number you give."}, {"q": "Which of these is a reserved keyword?", "o": ["sum", "list", "for", "len"], "a": 2, "why": "for is a keyword. The others are built-in functions, which you can overwrite by mistake."}, {"q": "After running sum = 0, what happens with sum([1, 2])?", "o": ["It returns 3", "It returns 0", "TypeError: 'int' object is not callable", "Nothing"], "a": 2, "why": "The name sum now points to an integer, which can't be called."}, {"q": "What does a function without a return statement give back?", "o": ["0", "None", "An empty string", "The last printed value"], "a": 1, "why": "Python returns None when there is no return."}, {"q": "What does int(3.7) give?", "o": ["4", "3", "3.7", "Error"], "a": 1, "why": "int() cuts off the decimals. It does not round."}, {"q": "According to the lecture, what is the programmer's real enemy?", "o": ["Error messages", "Silent bugs", "Slow typing", "Long variable names"], "a": 1, "why": "Crashes are easy to spot and fix. Silent bugs cause damage without anyone noticing."}], "exercises": [{"t": "Even or odd", "lvl": "Easy", "task": "Store a number in <code>n<\/code> and print whether it is even or odd.", "hint": "Check the remainder with % 2.", "sol": "n = 7\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")", "saved": {"stdout": "odd\n", "value": null, "error": null}}, {"t": "Shopping total", "lvl": "Easy", "task": "Store <code>{\"apple\": 0.5, \"bread\": 2.8, \"milk\": 1.6}<\/code> in a dict. Loop over it to print each item and the total cost.", "hint": "Use .items() to get the key and the value together.", "sol": "prices = {\"apple\": 0.5, \"bread\": 2.8, \"milk\": 1.6}\ntotal = 0\nfor item, price in prices.items():\n    print(item, price)\n    total += price\nprint(f\"Total: {total:.2f}\")", "saved": {"stdout": "apple 0.5\nbread 2.8\nmilk 1.6\nTotal: 4.90\n", "value": null, "error": null}}, {"t": "Unique customers", "lvl": "Easy", "task": "Remove duplicates from <code>[3, 1, 3, 2, 1]<\/code> and get them back as a sorted list.", "hint": "set() removes duplicates. sorted() turns any collection into a sorted list.", "sol": "ids = [3, 1, 3, 2, 1]\nprint(sorted(set(ids)))", "saved": {"stdout": "[1, 2, 3]\n", "value": null, "error": null}}, {"t": "Grade function", "lvl": "Medium", "task": "Write <code>get_grade(score)<\/code> that returns \"A\" (90+), \"B\" (70+), \"C\" (50+) or \"F\". Apply it to <code>[95, 72, 58, 41]<\/code>.", "hint": "if / elif / else inside the function, each branch with return. Then a for loop over the list.", "sol": "def get_grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 70:\n        return \"B\"\n    elif score >= 50:\n        return \"C\"\n    else:\n        return \"F\"\n\nfor s in [95, 72, 58, 41]:\n    print(s, get_grade(s))", "saved": {"stdout": "95 A\n72 B\n58 C\n41 F\n", "value": null, "error": null}}, {"t": "Word counter", "lvl": "Medium", "task": "Split a sentence into words and count how often each word appears, using a dict.", "hint": "Start with an empty dict. For each word, use counts.get(word, 0) + 1.", "sol": "text = \"the data and the code and the notes\"\ncounts = {}\nfor word in text.split():\n    counts[word] = counts.get(word, 0) + 1\nprint(counts)", "saved": {"stdout": "{'the': 3, 'data': 1, 'and': 2, 'code': 1, 'notes': 1}\n", "value": null, "error": null}}, {"t": "Sales summary", "lvl": "Medium", "task": "For <code>daily_sales = [120, 95, 210, 180]<\/code>, print the total, the average, the best day's position and how many days beat 150.", "hint": "sum(), len(), max() and .index() do most of the work. Count with a loop and an if.", "sol": "daily_sales = [120, 95, 210, 180]\nprint(\"total:\", sum(daily_sales))\nprint(\"average:\", sum(daily_sales) / len(daily_sales))\nprint(\"best day:\", daily_sales.index(max(daily_sales)))\nabove = 0\nfor s in daily_sales:\n    if s > 150:\n        above += 1\nprint(\"days above 150:\", above)", "saved": {"stdout": "total: 605\naverage: 151.25\nbest day: 2\ndays above 150: 2\n", "value": null, "error": null}}, {"t": "Savings goal", "lvl": "Harder", "task": "You save CHF 350 a month and earn 0.5% interest a month. Use a <code>while<\/code> loop to find how many months it takes to reach CHF 5,000.", "hint": "Each month: balance = balance * 1.005 + 350, and add 1 to a month counter.", "sol": "balance = 0\nmonths = 0\nwhile balance < 5000:\n    balance = balance * 1.005 + 350\n    months += 1\nprint(months, round(balance, 2))", "saved": {"stdout": "14 5062.48\n", "value": null, "error": null}}], "assignment": ["Create text cells below the questions and write Python to answer.", "Write Python three times: in bold, in italic and inside LaTeX.", "Write the linear equation y=mx+q in the $$ ... $$ LaTeX environment.", "Find out what happens when you mix indentation (2 spaces and 3 spaces) in one if block.", "Write an if / elif / else conditional using only Booleans, combined with and, or and not.", "Test each feature of variables, strings and numbers with your own variations.", "Make a dict with two entries: one key points to a list, the other to a set containing a tuple.", "Do one multiple assignment with 2 names on the left and a list of 3+ items on the right. What happens?", "Run the sum-overwriting code, then try summing a list again. What happens?", "Fix that code so you can sum 0 to 9 without breaking sum(). Restart the kernel first and test sum() afterwards.", "Explore the methods of a list and call two whose purpose you can guess.", "Look up the Python list documentation and try two more methods from it.", "Write a function that returns the square of a number, then test it.", "Use callable() on one callable object and one non-callable object."], "next": {"title": "Before Week 2", "summary": "You can't learn Python in a day, but you can see everything you need in a couple of days and then practise for weeks. Memorise like a new language, and have fun with it.", "bullets": ["Bookmark the <a href=\"https://docs.python.org/3/library/functions.html\">built-in functions page<\/a>. You already know many of them, and others are easy to guess: try <code>max()<\/code> on a list of numbers.", "Week 2 covers <code>zip()<\/code>, <code>map()<\/code> and much more.", "Each week the instructor helps less. Reading the docs becomes your main skill."]}}, {"n": 2, "title": "Crash course in Python, part 2", "short": "Ranges, zip, splats, comprehensions, lambdas, classes, errors", "topics": [{"id": "ranges", "title": "Ranges and stepping", "summary": "range() takes up to three arguments, start, stop and step, and the same idea powers slicing with [start:stop:step].", "bullets": ["<code>range(5)<\/code> uses 5 as <code>stop<\/code>. Add <code>start<\/code> to begin elsewhere and <code>step<\/code> to jump by more than 1. Steps can be negative.", "<code>stop<\/code> is always excluded: <code>range(2, 5)<\/code> gives 2, 3, 4.", "Square brackets with one number <i>index<\/i>. With colons they <i>slice<\/i>: <code>seq[start:stop:step]<\/code>.", "Leave a part out to use its default: start 0, stop at the end, step 1. Negative numbers count from the end.", "Wrap a range in <code>list()<\/code> to see all its numbers at once."], "cells": [{"label": "From the lecture", "code": "print(list(range(5)))\nprint(list(range(2, 10)))\nprint(list(range(0, 20, 5)))\nprint(list(range(10, 0, -3)))", "saved": {"stdout": "[0, 1, 2, 3, 4]\n[2, 3, 4, 5, 6, 7, 8, 9]\n[0, 5, 10, 15]\n[10, 7, 4, 1]\n", "value": null, "error": null}}, {"label": "Index vs slice", "code": "r = range(10)\nprint(r[5])\nprint(r[3:5])\nprint(list(r[3:5]))\nprint(list(r[2:8:2]))", "saved": {"stdout": "5\nrange(3, 5)\n[3, 4]\n[2, 4, 6]\n", "value": null, "error": null}}, {"label": "Data example", "code": "daily_sales = [120, 95, 210, 180, 160, 75, 230]\nprint(daily_sales[:3])   # first three days\nprint(daily_sales[-2:])  # last two days\nprint(daily_sales[::2])  # every other day", "saved": {"stdout": "[120, 95, 210]\n[75, 230]\n[120, 210, 160, 230]\n", "value": null, "error": null}}], "note": "The notebook says <code>range(10)[3:5]<\/code> gives the items in positions 3 and 5. Because <code>stop<\/code> is excluded, it's really positions <b>3 and 4<\/b>, as the second cell shows.", "data": "Slicing is how you take the first rows of a dataset, the last week of a time series, or every n-th sample."}, {"id": "enumerate", "title": "Enumerate", "summary": "enumerate() gives you each element together with its position, as (index, element) pairs.", "bullets": ["In a <code>for<\/code> loop, bind two names at once: <code>for idx, el in enumerate(items):<\/code>.", "Wrap it in <code>list()<\/code> to see all the pairs.", "<code>enumerate(items, start=1)<\/code> counts from 1, which reads better in reports."], "cells": [{"label": "From the lecture", "code": "print(list(enumerate(range(3, 10, 2))))\nfor idx, el in enumerate(range(3, 10, 2)):\n    print('number', el, 'in position', idx)", "saved": {"stdout": "[(0, 3), (1, 5), (2, 7), (3, 9)]\nnumber 3 in position 0\nnumber 5 in position 1\nnumber 7 in position 2\nnumber 9 in position 3\n", "value": null, "error": null}}, {"label": "Data example", "code": "products = [\"apple\", \"bread\", \"milk\"]\nfor rank, name in enumerate(products, start=1):\n    print(rank, name)", "saved": {"stdout": "1 apple\n2 bread\n3 milk\n", "value": null, "error": null}}]}, {"id": "zip", "title": "Zipping", "summary": "zip() walks through several lists at the same time and gives you tuples with one element from each.", "bullets": ["It works like <code>enumerate()<\/code>, but the pairs come from your own lists instead of a counter.", "This becomes very useful later, so take the time to understand it now.", "The lecture asks you to think about lists of <b>different lengths<\/b>. Edit the cell below to make one list shorter and see for yourself what <code>zip()<\/code> does."], "cells": [{"label": "Data example", "code": "products = [\"apple\", \"bread\", \"milk\"]\nprices = [0.5, 2.8, 1.6]\nfor name, price in zip(products, prices):\n    print(f\"{name}: {price:.2f} CHF\")\nprint(list(zip(products, prices)))", "saved": {"stdout": "apple: 0.50 CHF\nbread: 2.80 CHF\nmilk: 1.60 CHF\n[('apple', 0.5), ('bread', 2.8), ('milk', 1.6)]\n", "value": null, "error": null}}], "data": "<code>dict(zip(products, prices))<\/code> turns two matching columns into a lookup table in one line."}, {"id": "splat", "title": "Splat", "summary": "The splat * in an assignment means: this name takes the rest of the elements.", "bullets": ["It only works with iterables: lists, tuples, ranges and argument lists.", "You can have normal names before and after the splat, but only <b>one<\/b> splat per assignment.", "The splatted name always gets a list, even if it's empty."], "cells": [{"label": "From the lecture", "code": "a = list(range(3))\nb, *c = a\nprint('b', b, '- c', c)", "saved": {"stdout": "b 0 - c [1, 2]\n", "value": null, "error": null}}, {"label": "Data example", "code": "daily_sales = [120, 95, 210, 180, 160]\n*earlier, today = daily_sales\nprint('today:', today)\nprint('before:', earlier)", "saved": {"stdout": "today: 160\nbefore: [120, 95, 210, 180]\n", "value": null, "error": null}}, {"label": "Only one splat allowed", "code": "a, *b, *c = [1, 2, 3, 4]", "saved": {"stdout": "", "value": null, "error": "SyntaxError: multiple starred expressions in assignment (line 1)"}}]}, {"id": "args", "title": "Default values, named arguments and *args", "summary": "Arguments can have defaults, can be passed by name, and a splat can collect any number of them.", "bullets": ["An argument with a default is <i>optional<\/i>. One without a default is <i>mandatory<\/i>, and leaving it out raises an error.", "With many arguments, or a mix of optional and mandatory ones, pass them <b>by name<\/b>: it's clearer and order no longer matters.", "<code>def my_fn(x, *y):<\/code> collects every extra positional argument into <code>y<\/code>.", "The splat also works the other way round: <code>my_fn(*args)<\/code> spreads a list out into separate arguments."], "cells": [{"label": "Defaults and names", "code": "def my_fn(x, y=5):\n    print(x, y)\n\nmy_fn(2, 3)\nmy_fn(2)\nmy_fn(y=2, x=3)\nmy_fn(x=3)\nmy_fn(y=3)", "saved": {"stdout": "2 3\n2 5\n3 2\n3 5\n", "value": null, "error": "TypeError: my_fn() missing 1 required positional argument: 'x'"}}, {"label": "Collecting arguments", "code": "def my_fn(x, *y):\n    print(x, y)\n\nmy_fn(2)\nmy_fn(2, 3)\nmy_fn(2, 3, 4, 5)", "saved": {"stdout": "2 ()\n2 (3,)\n2 (3, 4, 5)\n", "value": null, "error": null}}, {"label": "Spreading a list", "code": "def my_fn(a, b, c):\n    print(a, b, c)\n\nargs = [1, 2, 3]\nmy_fn(*args)\nmy_fn(args)", "saved": {"stdout": "1 2 3\n", "value": null, "error": "TypeError: my_fn() missing 2 required positional arguments: 'b' and 'c'"}}], "trap": "<code>*y<\/code> collects a <b>tuple<\/b>, not a list. The notebook's comments show <code>[3, 4, 5]<\/code>, but Python prints <code>(3, 4, 5)<\/code>, as the second cell shows. Convert with <code>list(y)<\/code> when you need a list.", "analyst": "From here the questions ask you to <b>think<\/b>. A data analyst first understands the task (often complex and badly explained), then designs a solution, and only then writes the code. The exam is almost entirely questions like this, so build that habit week by week."}, {"id": "kwargs", "title": "Keyword arguments and double splat", "summary": "Arguments passed by position form a tuple. Arguments passed by name form a dictionary, collected with the double splat **.", "bullets": ["Named arguments are called <i>keyword arguments<\/i>, because the argument's name is used as the key.", "<code>def my_fn(*args, **kwargs):<\/code> accepts anything: <code>args<\/code> gets the unnamed ones, <code>kwargs<\/code> the named ones.", "<code>print(*args)<\/code> spreads the tuple out. <code>print(**kwargs)<\/code> only works if <code>print()<\/code> has arguments with those names.", "A dictionary of settings plus <code>**<\/code> is a readable way to configure a complex function. Here are the <a href=\"https://docs.python.org/3/library/functions.html#print\">options print() accepts<\/a>."], "cells": [{"label": "From the lecture", "code": "def my_fn(*args, **kwargs):\n    print(args)\n    print(*args)\n    print(kwargs)\n    print(**kwargs)\n\nmy_fn(1, 2, 3, x=4, y=5)", "saved": {"stdout": "(1, 2, 3)\n1 2 3\n{'x': 4, 'y': 5}\n", "value": null, "error": "TypeError: print() got an unexpected keyword argument 'x'"}}, {"label": "Settings as a dict", "code": "conf = {\n    'sep': '; ',\n    'end': \"\\nThat's all!\\n\"\n}\nprint('one', 'two', 'three', **conf)", "saved": {"stdout": "one; two; three\nThat's all!\n", "value": null, "error": null}}], "data": "Later, plotting and data libraries take dozens of options. Keeping them in a dict and passing <code>**settings<\/code> makes analysis code much easier to read."}, {"id": "imports", "title": "Importing modules", "summary": "Modules (Python's word for libraries) are loaded with import. Many come with Python, others you install first.", "bullets": ["Install extra modules with <code>pipenv<\/code> (or <code>pip<\/code>), then load them with <code>import<\/code>.", "<code>import math<\/code> loads the whole module, and you use <code>math.factorial()<\/code>.", "<code>from math import factorial<\/code> loads just one name.", "<code>as<\/code> gives a shorter handle. The classic example is <code>import matplotlib.pyplot as plt<\/code>, which you'll use for charts.", "<code>from math import *<\/code> dumps everything into your namespace. It's bad practice: avoid it."], "cells": [{"label": "Three ways to import", "code": "import math\nprint(math.factorial(3))\n\nfrom math import factorial\nprint(factorial(3))\n\nimport statistics as st\nprint(st.mean([120, 95, 210, 180]))", "saved": {"stdout": "6\n6\n151.25\n", "value": null, "error": null}}], "trap": "<code>from module import *<\/code> can silently overwrite names you already have, just like <code>sum = 0<\/code> did in Week 1. Always import what you need, or use <code>as<\/code>."}, {"id": "comprehensions", "title": "Comprehensions", "summary": "A comprehension builds a list or dict by describing its content in one line.", "bullets": ["List: <code>[expression for item in iterable]<\/code>.", "Dict: <code>{key: value for item in iterable}<\/code>. Note the colon between key and value.", "You can add <code>if<\/code> to keep only some items. The lecture covers this properly later."], "cells": [{"label": "From the lecture", "code": "lst = [f\"The square of {i} is {i**2}\" for i in range(2, 10, 2)]\nprint(*lst, sep='\\n', end='\\n[done]\\n')", "saved": {"stdout": "The square of 2 is 4\nThe square of 4 is 16\nThe square of 6 is 36\nThe square of 8 is 64\n[done]\n", "value": null, "error": null}}, {"label": "Dict comprehension", "code": "print({i: i**2 for i in range(2, 11, 2)})", "saved": {"stdout": "{2: 4, 4: 16, 6: 36, 8: 64, 10: 100}\n", "value": null, "error": null}}, {"label": "Data example", "code": "prices = [0.5, 2.8, 1.6]\nwith_vat = [round(p * 1.081, 2) for p in prices]\nprint(with_vat)\nprint([p for p in prices if p > 1])", "saved": {"stdout": "[0.54, 3.03, 1.73]\n[2.8, 1.6]\n", "value": null, "error": null}}], "note": "For Q8, follow the lecture's tip: first write a small example of the output, neatly laid out, then design the function."}, {"id": "underscores", "title": "Underscores", "summary": "The underscore _ is a normal character in names, but Python has conventions for it.", "bullets": ["A name starting with <code>_<\/code> is \"private\": not meant for users to call.", "Names with double underscores on both sides, like <code>__init__<\/code>, are special names reserved by Python.", "A lone <code>_<\/code> means \"I won't use this value\": <code>for _ in range(5):<\/code>."], "cells": [{"label": "Examples", "code": "for _ in range(3):\n    print('ALARM!')\n\nprint(len(\"abc\"), \"abc\".__len__())", "saved": {"stdout": "ALARM!\nALARM!\nALARM!\n3 3\n", "value": null, "error": null}}], "note": "<code>len(x)<\/code> actually calls the special method <code>x.__len__()<\/code>. Special names like this are how Python's built-ins work with your own classes."}, {"id": "lambdas", "title": "Lambdas", "summary": "A lambda is an unnamed one-line function that you can pass around like any other value.", "bullets": ["<code>lambda a, b: a + b<\/code> is the same as a <code>def<\/code> that returns <code>a + b<\/code>.", "Only use it for one expression. Anything with several steps belongs in a normal <code>def<\/code>.", "Lambdas shine when a function takes another function as input, such as <code>sorted(..., key=...)<\/code> or <code>map()<\/code>.", "The name comes from the Greek letter λ and lambda calculus. You don't need to know more than that."], "cells": [{"label": "From the lecture", "code": "def my_fn(a, b):\n    print(a, b)\n\nmy_fn_lambda = lambda a, b: print(a, b)\nmy_fn(1, 2)\nmy_fn_lambda(1, 2)", "saved": {"stdout": "1 2\n1 2\n", "value": null, "error": null}}, {"label": "Data example: sort by price", "code": "products = [(\"apple\", 0.5), (\"bread\", 2.8), (\"milk\", 1.6)]\nprint(sorted(products, key=lambda item: item[1], reverse=True))", "saved": {"stdout": "[('bread', 2.8), ('milk', 1.6), ('apple', 0.5)]\n", "value": null, "error": null}}], "data": "You'll pass small lambdas to data tools all the time: to sort, to transform a column, or to pick rows."}, {"id": "map", "title": "Mapping", "summary": "map() applies one function to every element of an iterable.", "bullets": ["<code>map()<\/code> returns a <i>map object<\/i>, not a list. It's lazy: it only computes values when you ask for them.", "Wrap it in <code>list()<\/code> to see the results.", "The function can be a lambda, a built-in like <code>float<\/code>, or any function you defined with <code>def<\/code>.", "Mapping, filtering and reducing together are very powerful for processing data. <a href=\"https://realpython.com/python-map-function/\">Real Python's guide to map()<\/a> goes further."], "cells": [{"label": "From the lecture", "code": "list(map(lambda x: x**2, range(2, 9, 2)))", "saved": {"stdout": "", "value": "[4, 16, 36, 64]", "error": null}}, {"label": "It's lazy", "code": "m = map(lambda x: x**2, range(3))\nprint(type(m))\nprint(list(m))\nprint(list(m))", "saved": {"stdout": "<class 'map'>\n[0, 1, 4]\n[]\n", "value": null, "error": null}}, {"label": "Data example", "code": "prices_text = [\"0.5\", \"2.8\", \"1.6\"]\nprices = list(map(float, prices_text))\nprint(prices)\nprint(list(filter(lambda p: p > 1, prices)))", "saved": {"stdout": "[0.5, 2.8, 1.6]\n[2.8, 1.6]\n", "value": null, "error": null}}], "trap": "A map object can only be used once. The second <code>list(m)<\/code> in the middle cell is empty, because the values were already consumed.", "note": "For Q9, the lecture's tip helps: <code>dict()<\/code> can build a dictionary from a list of (key, value) pairs."}, {"id": "classes", "title": "Basic classes and object-oriented programming", "summary": "A class bundles data and the functions that work on it. Each object you create from it is an instance.", "bullets": ["Class names use TitleCase: <code>SalesLog<\/code>, <code>Square<\/code>.", "Every instance method takes <code>self<\/code> first. It refers to the object the method is called on.", "<code>__init__()<\/code> runs when you create an instance with <code>ClassName(...)<\/code> and sets up its data.", "<code>self.length = length<\/code> stores the argument on the object, so other methods can use it later."], "cells": [{"label": "From the lecture", "code": "class Square:\n    def __init__(self, length):\n        self.length = length\n\n    def area(self):\n        return self.length**2\n\nmy_square = Square(length=2)\nprint(my_square.area())", "saved": {"stdout": "4\n", "value": null, "error": null}}, {"label": "Data example", "code": "class SalesLog:\n    def __init__(self, store, sales):\n        self.store = store\n        self.sales = sales\n\n    def total(self):\n        return sum(self.sales)\n\n    def average(self):\n        return self.total() / len(self.sales)\n\nzurich = SalesLog(\"Zurich\", [120, 95, 210, 180])\nprint(zurich.store, zurich.total(), zurich.average())", "saved": {"stdout": "Zurich 605 151.25\n", "value": null, "error": null}}], "trap": "Forgetting <code>self<\/code> is the classic mistake. Writing <code>length<\/code> instead of <code>self.length<\/code> inside a method gives <code>NameError: name 'length' is not defined<\/code>."}, {"id": "inheritance", "title": "Basic inheritance", "summary": "A subclass inherits everything from its parent class and can replace (override) any method.", "bullets": ["<code>class Cube(Square):<\/code> makes <code>Square<\/code> the parent of <code>Cube<\/code>.", "When you call a method, Python looks in the object's own class first, then in each parent in order. <code>__init__()<\/code> is found the same way.", "A class can have several parents, listed in the brackets.", "<code>isinstance(obj, Parent)<\/code> is <code>True<\/code> for instances of subclasses too."], "cells": [{"label": "From the lecture", "code": "class Square:\n    def __init__(self, length):\n        self.length = length\n\n    def area(self):\n        return self.length**2\n\nclass Cube(Square):\n    def area(self):\n        return self.length**3\n\nmy_cube = Cube(length=2)\nprint(my_cube.area())\nprint(isinstance(my_cube, Square))", "saved": {"stdout": "8\nTrue\n", "value": null, "error": null}}], "trap": "Inheritance means \"is a\": every subclass instance <b>is a<\/b> parent instance. A cube is not a kind of square, so this design is wrong even though it runs, and Q10 asks you to fix it. Ask yourself: is every child truly a kind of parent?"}, {"id": "exceptions", "title": "Interrupts, exceptions and errors", "summary": "When something goes wrong, Python raises an exception. You can catch specific ones with try / except, or raise your own.", "bullets": ["Errors are your best friends: you want code to fail loudly. The dangerous case is code that runs fine but gives wrong output.", "An error creates an exception object with information about the problem, and execution jumps to an exception handler. With no handler, the program stops and prints the message.", "<code>try: ... except ZeroDivisionError as e:<\/code> catches one specific type of error.", "<code>raise ValueError('message')<\/code> throws an exception yourself.", "<b>Never<\/b> use a bare <code>except:<\/code> with no error type. It catches everything and hides the real cause."], "cells": [{"label": "An unhandled error", "code": "print(8/0)", "saved": {"stdout": "", "value": null, "error": "ZeroDivisionError: division by zero"}}, {"label": "Catching it", "code": "try:\n    print(8/0)\nexcept ZeroDivisionError as e:\n    print(\"Oops, division by zero:\", e)\n    print(type(e).__name__)", "saved": {"stdout": "Oops, division by zero: division by zero\nZeroDivisionError\n", "value": null, "error": null}}, {"label": "Data example: messy values", "code": "raw = [\"12\", \"n/a\", \"7\", \"\"]\nclean = []\nfor value in raw:\n    try:\n        clean.append(int(value))\n    except ValueError:\n        print(\"skipping\", repr(value))\nprint(clean, sum(clean))", "saved": {"stdout": "skipping 'n/a'\nskipping ''\n[12, 7] 19\n", "value": null, "error": null}}, {"label": "Raising your own", "code": "def check_price(p):\n    if p < 0:\n        raise ValueError(f\"price can't be negative: {p}\")\n    return p\n\nprint(check_price(2.8))\ncheck_price(-1)", "saved": {"stdout": "2.8\n", "value": null, "error": "ValueError: price can't be negative: -1"}}], "analyst": "<b>Red, green, refactor.<\/b> First write a small test of what you need, which fails (red). Then write code that works, even if it isn't pretty (green). Then, as soon as you have time, rewrite it to be clearer or faster (refactor). The lecture is serious about the last step: at the exam you can reuse old exercises, but only clean code is quick to adapt."}], "errors": [["ZeroDivisionError", "division by zero", "You divided by 0. Check the value first, or catch the error with try / except."], ["TypeError", "my_fn() missing 1 required positional argument: 'x'", "A mandatory argument wasn't given."], ["TypeError", "my_fn() got an unexpected keyword argument 'z'", "You passed a name the function doesn't have. Check the spelling."], ["TypeError", "print() got an unexpected keyword argument 'x'", "You double-splatted a dict with keys the function doesn't accept. Older Python versions word it as 'x' is an invalid keyword argument for print()."], ["SyntaxError", "multiple starred expressions in assignment", "Only one * is allowed on the left of an assignment."], ["NameError", "name 'length' is not defined", "Inside a method you probably forgot self., as in self.length."], ["AttributeError", "'Square' object has no attribute 'lenght'", "A typo in an attribute name, or it was never set in __init__."], ["ModuleNotFoundError", "No module named 'pandas'", "The module isn't installed. Install it with pipenv or pip first."], ["ValueError", "invalid literal for int() with base 10: 'n/a'", "The text can't be turned into a number. Clean it or catch the error."]], "glossary": [["start, stop, step", "The three arguments of range() and of slices. stop is excluded."], ["Slice", "Part of a sequence, written seq[start:stop:step]."], ["enumerate()", "Pairs each element with its position: (index, element)."], ["zip()", "Walks through several iterables together, one element from each."], ["Splat (*)", "Takes the rest of the elements, or spreads a list out into arguments."], ["Optional argument", "An argument with a default value."], ["Keyword argument", "An argument passed by name, like y=2."], ["*args / **kwargs", "Collect extra positional arguments (a tuple) and keyword arguments (a dict)."], ["Module", "Python's word for a library, loaded with import."], ["Comprehension", "A one-line way to build a list or dict from an iterable."], ["Lambda", "An unnamed one-line function."], ["map()", "Applies a function to every element. Returns a lazy map object."], ["Lazy evaluation", "Values are only computed when you ask for them."], ["Class / instance", "A blueprint, and an object made from it."], ["self", "The instance a method is working on."], ["__init__()", "The method that sets up a new instance."], ["Inheritance", "A subclass reusing and overriding a parent class's code."], ["Exception", "An object Python creates when an error happens."], ["Refactor", "Rewrite working code so it's clearer or faster."]], "quiz": [{"q": "What does list(range(2, 10, 3)) give?", "o": ["[2, 5, 8]", "[2, 5, 8, 11]", "[3, 6, 9]", "[2, 3, 4]"], "a": 0, "why": "Start at 2, add 3 each time, and stop before 10."}, {"q": "What does 'abcdef'[1:4] give?", "o": ["'abcd'", "'bcd'", "'bcde'", "'b'"], "a": 1, "why": "Positions 1, 2 and 3. The stop position 4 is excluded."}, {"q": "What does daily_sales[-2:] give?", "o": ["The first two items", "Everything except the last two", "The last two items", "An error"], "a": 2, "why": "-2 starts two from the end, and an empty stop goes to the end."}, {"q": "What does list(enumerate(['a', 'b'])) give?", "o": ["['a', 'b']", "[(0, 'a'), (1, 'b')]", "[(1, 'a'), (2, 'b')]", "[0, 1]"], "a": 1, "why": "enumerate counts from 0 unless you pass start=."}, {"q": "After first, *rest = [1, 2, 3], what is rest?", "o": ["3", "[2, 3]", "(2, 3)", "[1, 2, 3]"], "a": 1, "why": "The splat takes the rest of the elements, as a list."}, {"q": "def f(x, y=5): print(x, y). What does f(2) print?", "o": ["2 5", "2", "5 2", "An error"], "a": 0, "why": "y is optional, so its default 5 is used."}, {"q": "With the same f, what happens with f(y=3)?", "o": ["Prints None 3", "Prints 3 5", "TypeError: missing argument 'x'", "Prints 3"], "a": 2, "why": "x has no default, so it's mandatory."}, {"q": "In def f(*args), what type is args?", "o": ["list", "tuple", "dict", "set"], "a": 1, "why": "*args collects a tuple, whatever the notebook comments suggest."}, {"q": "In def f(**kwargs), what type is kwargs?", "o": ["list", "tuple", "dict", "str"], "a": 2, "why": "Keyword arguments arrive as a dictionary of name: value."}, {"q": "What does [i * 2 for i in range(3)] give?", "o": ["[0, 2, 4]", "[2, 4, 6]", "[0, 1, 2]", "6"], "a": 0, "why": "range(3) is 0, 1, 2, and each is doubled."}, {"q": "What does map() return?", "o": ["A list", "A dict", "A lazy map object", "None"], "a": 2, "why": "Wrap it in list() to get the values."}, {"q": "What is a lambda?", "o": ["A loop", "An unnamed one-line function", "A type of list", "A module"], "a": 1, "why": "lambda x: x + 1 is a function without a name."}, {"q": "What does self refer to in a method?", "o": ["The class", "The parent class", "The instance the method is called on", "The module"], "a": 2, "why": "self is the specific object, such as my_square."}, {"q": "When does __init__() run?", "o": ["When you import the class", "When you create an instance with ClassName()", "When the program ends", "Never automatically"], "a": 1, "why": "It prepares each new instance."}, {"q": "Why is a bare except: a bad idea?", "o": ["It's slower", "It catches every error and hides the real cause", "It's a syntax error", "It only catches ZeroDivisionError"], "a": 1, "why": "Always name the exception you expect."}, {"q": "What does a lone _ as a variable name mean?", "o": ["A private variable", "A special Python name", "A value you won't use", "An error"], "a": 2, "why": "for _ in range(5): repeats without using the counter."}], "exercises": [{"t": "Every other day", "lvl": "Easy", "task": "From <code>daily_sales = [120, 95, 210, 180, 160, 75, 230]<\/code>, print the first three days, the last three days and every other day, using slices only.", "hint": "seq[:3], seq[-3:] and seq[::2].", "sol": "daily_sales = [120, 95, 210, 180, 160, 75, 230]\nprint(daily_sales[:3])\nprint(daily_sales[-3:])\nprint(daily_sales[::2])", "saved": {"stdout": "[120, 95, 210]\n[160, 75, 230]\n[120, 210, 160, 230]\n", "value": null, "error": null}}, {"t": "Ranking report", "lvl": "Easy", "task": "Sort <code>[210, 95, 180, 120]<\/code> from highest to lowest and print each value with its rank, starting at 1.", "hint": "sorted(..., reverse=True), then enumerate(..., start=1).", "sol": "sales = [210, 95, 180, 120]\nfor rank, value in enumerate(sorted(sales, reverse=True), start=1):\n    print(f\"#{rank}: {value}\")", "saved": {"stdout": "#1: 210\n#2: 180\n#3: 120\n#4: 95\n", "value": null, "error": null}}, {"t": "Price lookup", "lvl": "Easy", "task": "Combine <code>products = [\"apple\", \"bread\", \"milk\"]<\/code> and <code>prices = [0.5, 2.8, 1.6]<\/code> into a dictionary, then print the price of bread.", "hint": "dict(zip(a, b)) builds the lookup in one line.", "sol": "products = [\"apple\", \"bread\", \"milk\"]\nprices = [0.5, 2.8, 1.6]\nprice_of = dict(zip(products, prices))\nprint(price_of)\nprint(price_of[\"bread\"])", "saved": {"stdout": "{'apple': 0.5, 'bread': 2.8, 'milk': 1.6}\n2.8\n", "value": null, "error": null}}, {"t": "Parse prices", "lvl": "Medium", "task": "Turn <code>[\"2.80 CHF\", \"1.60 CHF\", \"0.50 CHF\"]<\/code> into a list of floats using <code>map()<\/code> and a lambda, then print the total.", "hint": "Inside the lambda: remove \" CHF\" with .replace(), then float().", "sol": "raw = [\"2.80 CHF\", \"1.60 CHF\", \"0.50 CHF\"]\nprices = list(map(lambda s: float(s.replace(\" CHF\", \"\")), raw))\nprint(prices)\nprint(round(sum(prices), 2))", "saved": {"stdout": "[2.8, 1.6, 0.5]\n4.9\n", "value": null, "error": null}}, {"t": "Summary with options", "lvl": "Medium", "task": "Write <code>summarize(values, decimals=1, label=\"Average\")<\/code> that prints the label and the rounded average. Call it with defaults, and with keyword arguments.", "hint": "Defaults go in the def line. Call with summarize(data, label=\"Mean\", decimals=2).", "sol": "def summarize(values, decimals=1, label=\"Average\"):\n    avg = sum(values) / len(values)\n    print(f\"{label}: {round(avg, decimals)}\")\n\ndata = [120, 95, 210, 180]\nsummarize(data)\nsummarize(data, label=\"Mean sales\", decimals=2)", "saved": {"stdout": "Average: 151.2\nMean sales: 151.25\n", "value": null, "error": null}}, {"t": "Discount list", "lvl": "Medium", "task": "Use a list comprehension to apply a 15% discount to <code>[19.9, 4.5, 12.0]<\/code>, rounding to 2 decimals. Then keep only prices under 10.", "hint": "[round(p * 0.85, 2) for p in prices], then add if p < 10.", "sol": "prices = [19.9, 4.5, 12.0]\ndiscounted = [round(p * 0.85, 2) for p in prices]\nprint(discounted)\nprint([p for p in discounted if p < 10])", "saved": {"stdout": "[16.91, 3.82, 10.2]\n[3.82]\n", "value": null, "error": null}}, {"t": "Store class", "lvl": "Harder", "task": "Write a class <code>Store<\/code> with a name and a list of daily sales, and methods <code>total()<\/code> and <code>best_day()<\/code> that returns the position of the highest sale.", "hint": "Store the data in __init__ with self. Use max() and .index() in best_day().", "sol": "class Store:\n    def __init__(self, name, sales):\n        self.name = name\n        self.sales = sales\n\n    def total(self):\n        return sum(self.sales)\n\n    def best_day(self):\n        return self.sales.index(max(self.sales))\n\nbern = Store(\"Bern\", [80, 140, 95, 160])\nprint(bern.name, bern.total(), bern.best_day())", "saved": {"stdout": "Bern 475 3\n", "value": null, "error": null}}], "assignment": ["Using range(), create and print a list containing [4, 2, 0, -2, -4].", "Use the slice operator to reverse a list of the numbers 0 to 4.", "Write a function that prints n tuples (i, n-i) using a reversed list and enumerate(), without subtraction.", "Make a list from 4 to 10 and one from 8 to 2, zip them and print the product of each pair.", "From [0, 2, 4, 6] made with range(), write one assignment equivalent to a=0; b=[2,4]; c=6.", "Define a function that accepts any number of arguments (including 0) and returns them in a list.", "Define a function with a mandatory, an optional (None) and a splat argument that prints how many arguments it got. Test with 1, 2 and 3.", "Write a function returning a dict from 0 to n-1, where each value lists the squares from 0 to the key. Use a dict comprehension with a list comprehension inside.", "Produce the same output as Q8 using map().", "Write a better parent class and subclass example than Square and Cube.", "Define a safe fraction function that returns 1/n, or 0 when it catches a ZeroDivisionError."], "next": {"title": "Before Week 3", "summary": "The intermediate features, lambdas, map, classes and exceptions, take time to sink in. That's normal: know they exist, play with them now, and you'll practise them for real when you need them.", "bullets": ["Practise <code>*args<\/code>, <code>**kwargs<\/code> and comprehensions even where no question asks you to. They come back in later questions.", "Questions now ask you to design a solution first. Write a small example of the output before you code.", "Refactor your answers once they work. You can reuse them at the exam, but only if they're clear."]}}], "kernel": "import ast, io, contextlib\n\ndef _input_blocked(prompt=\"\"):\n    raise RuntimeError(\"input() isn't available on this page. Set the value directly, for example n = 7\")\n\ndef run_cell(src, g):\n    \"\"\"Run src in namespace g like a Jupyter cell. Returns (stdout, last_value_repr_or_None, error_or_None).\"\"\"\n    buf = io.StringIO()\n    shown, err = None, None\n    g.setdefault(\"input\", _input_blocked)\n    with contextlib.redirect_stdout(buf):\n        try:\n            tree = ast.parse(src, \"<cell>\")\n            last = None\n            if tree.body and isinstance(tree.body[-1], ast.Expr):\n                last = ast.Expression(tree.body.pop().value)\n            exec(compile(tree, \"<cell>\", \"exec\"), g)\n            if last is not None:\n                v = eval(compile(last, \"<cell>\", \"eval\"), g)\n                if v is not None:\n                    shown = repr(v)\n        except SyntaxError as e:\n            err = f\"{type(e).__name__}: {e.msg} (line {e.lineno})\"\n        except Exception as e:\n            err = f\"{type(e).__name__}: {e}\"\n    return buf.getvalue(), shown, err\n"}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("course-data").textContent);
  var PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";

  var WEEKS = [];
  for (var w = 1; w <= 12; w++) {
    var wd = D.weeks.filter(function (x) { return x.n === w; })[0];
    WEEKS.push(wd ? { n: w, title: wd.title, note: wd.short, ready: true, data: wd } : { n: w, title: "Week " + w, note: "Not added yet", ready: false });
  }

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  /* ---------- highlighter ---------- */
  var KW = /^(def|return|if|elif|else|for|while|in|and|or|not|pass|True|False|None|import|from|as|break|continue|is|lambda|class|try|except|with)$/;
  var BI = /^(print|sum|len|type|int|float|str|range|sorted|max|min|tuple|list|set|dict|input|enumerate|round|callable|dir|help|zip|map|abs)$/;
  function hl(code) {
    var re = /(#[^\n]*)|(f?"(?:[^"\\\n]|\\.)*"|f?'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_]\w*)/g, out = "", last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      var t = m[0];
      if (m[1]) out += '<span class="tok-c">' + esc(t) + "</span>";
      else if (m[2]) out += '<span class="tok-s">' + esc(t) + "</span>";
      else if (m[3]) out += '<span class="tok-n">' + t + "</span>";
      else if (KW.test(t)) out += '<span class="tok-k">' + t + "</span>";
      else if (BI.test(t) && code.charAt(re.lastIndex) === "(") out += '<span class="tok-f">' + t + "</span>";
      else out += esc(t);
      last = re.lastIndex;
    }
    return out + esc(code.slice(last));
  }

  /* ---------- kernel (Pyodide, loaded on first Run) ---------- */
  var kernel = { state: "idle", py: null, loading: null, count: 0 };
  var cells = [];
  function setStatus(s, text) {
    kernel.state = s;
    var el = document.getElementById("kstat");
    if (!el) return;
    el.dataset.s = s;
    el.querySelector("span.t").textContent = text;
  }
  function statusText() {
    return { idle: "Python: starts on first Run", loading: "Python: starting…", ready: "Python 3.12: ready", busy: "Python: running…", failed: "Python unavailable: showing saved outputs" }[kernel.state];
  }
  function loadKernel() {
    if (kernel.loading) return kernel.loading;
    setStatus("loading", "Python: starting… (first time takes a few seconds)");
    kernel.loading = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = PYODIDE + "pyodide.js";
      s.onload = function () {
        window.loadPyodide({ indexURL: PYODIDE }).then(function (py) {
          py.runPython(D.kernel);
          py.runPython("_G = {}");
          kernel.py = py;
          setStatus("ready", statusText());
          resolve(py);
        }).catch(reject);
      };
      s.onerror = function () { reject(new Error("load failed")); };
      document.head.appendChild(s);
    }).catch(function (e) { setStatus("failed", statusText()); throw e; });
    return kernel.loading;
  }
  function restartKernel() {
    kernel.count = 0;
    if (kernel.py) kernel.py.runPython("_G = {}");
    cells.forEach(function (c) { c.prompt.innerHTML = "In [&nbsp;]:"; c.outRow.hidden = true; });
    var b = document.getElementById("restart");
    if (b) { b.textContent = "Kernel restarted"; setTimeout(function () { b.textContent = "Restart kernel"; }, 1400); }
  }

  function renderOutput(c, r, note) {
    c.outBox.innerHTML = "";
    function add(cls, text) { var s = document.createElement("span"); s.className = cls; s.textContent = text; c.outBox.appendChild(s); }
    if (r.stdout) add("std", r.stdout.replace(/\n$/, ""));
    if (r.value != null) add("val", r.value);
    if (r.error) add("err", r.error);
    if (!r.stdout && r.value == null && !r.error) add("empty", "No output: the last statement wasn't a value.");
    if (note) add("note", note);
    c.outPrompt.textContent = r.value != null ? "Out[" + kernel.count + "]:" : "";
    c.outRow.hidden = false;
  }

  function runCell(c) {
    kernel.count += 1;
    var n = kernel.count;
    c.prompt.textContent = "In [*]:";
    var code = c.ta.value;
    loadKernel().then(function (py) {
      setStatus("busy", statusText());
      setTimeout(function () {
        try {
          py.globals.set("_SRC", code);
          var res = py.runPython("run_cell(_SRC, _G)");
          var arr = res.toJs(); res.destroy();
          c.prompt.textContent = "In [" + n + "]:";
          renderOutput(c, { stdout: arr[0], value: arr[1] == null ? null : arr[1], error: arr[2] == null ? null : arr[2] });
        } catch (e) {
          c.prompt.textContent = "In [" + n + "]:";
          renderOutput(c, { stdout: "", value: null, error: String(e && e.message || e).split("\n").filter(Boolean).pop() });
        }
        setStatus("ready", statusText());
      }, 10);
    }).catch(function () {
      c.prompt.textContent = "In [" + n + "]:";
      if (code === c.original) renderOutput(c, c.saved, "Saved output: Python couldn't start in this browser.");
      else renderOutput(c, { stdout: "", value: null, error: null }, "Python couldn't start in this browser, so edited code can't run here. Press Reset to see the saved output.");
    });
  }

  function makeCell(host, spec, opts) {
    opts = opts || {};
    host.classList.add("cell");
    host.innerHTML =
      (spec.label ? '<div class="cell-label">' + esc(spec.label) + "</div>" : "") +
      '<div class="prompt">In [&nbsp;]:</div>' +
      '<div class="code"><div class="editor"><pre aria-hidden="true"></pre>' +
      '<textarea spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Python code, editable. Shift+Enter runs it."></textarea></div>' +
      '<div class="cell-tools"><button class="reset" type="button" hidden>Reset</button>' +
      '<button class="run" type="button" title="Run (Shift+Enter)"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z"/></svg>Run</button></div></div>' +
      '<div class="out-row" hidden><div class="prompt outp"></div><div class="output"></div></div>';
    var c = {
      prompt: host.querySelector(".prompt"), pre: host.querySelector("pre"), ta: host.querySelector("textarea"),
      outRow: host.querySelector(".out-row"), outBox: host.querySelector(".output"), outPrompt: host.querySelector(".outp"),
      reset: host.querySelector(".reset"), original: spec.code, saved: spec.saved
    };
    function sync() {
      c.pre.innerHTML = hl(c.ta.value) + "\n";
      c.ta.style.height = "auto";
      c.ta.style.height = c.ta.scrollHeight + "px";
      c.reset.hidden = c.ta.value === c.original;
    }
    c.ta.value = spec.code;
    c.ta.rows = spec.code.split("\n").length;
    c.ta.addEventListener("input", sync);
    c.ta.addEventListener("scroll", function () { c.pre.scrollLeft = c.ta.scrollLeft; });
    c.ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.shiftKey || e.ctrlKey)) { e.preventDefault(); runCell(c); }
      else if (e.key === "Tab" && !e.shiftKey && !c.escaped) {
        e.preventDefault();
        var s = c.ta.selectionStart, en = c.ta.selectionEnd;
        c.ta.value = c.ta.value.slice(0, s) + "    " + c.ta.value.slice(en);
        c.ta.selectionStart = c.ta.selectionEnd = s + 4; sync();
      } else if (e.key === "Escape") { c.escaped = true; }
      else c.escaped = false;
    });
    c.ta.addEventListener("blur", function () { c.escaped = false; });
    host.querySelector(".run").addEventListener("click", function () { runCell(c); });
    c.reset.addEventListener("click", function () { c.ta.value = c.original; sync(); c.ta.focus(); });
    cells.push(c);
    requestAnimationFrame(sync);
    sync();
    return c;
  }

  /* ---------- views ---------- */
  var view = document.getElementById("view");
  var toc = document.getElementById("toc");
  var weeksNav = document.getElementById("weeks");
  var learned = {}, curWeek = null;

  function renderWeeksNav(current) {
    weeksNav.innerHTML = WEEKS.map(function (w) {
      return '<a href="#week-' + w.n + '" class="' + (w.ready ? "ready" : "locked") + (w.n === current ? " current" : "") + '" aria-label="Week ' + w.n + (w.ready ? "" : ", not added yet") + '"' + (w.n === current ? ' aria-current="page"' : "") + ">" + w.n + "</a>";
    }).join("");
  }

  function kernelBar() {
    return '<div class="kernelbar" role="region" aria-label="Python kernel"><span class="kstat" id="kstat" data-s="' + kernel.state + '"><span class="dot"></span><span class="t">' + statusText() + "</span></span>" +
      '<span class="khelp">Every cell is editable and runs real Python. Shift + Enter runs, Tab indents (Esc then Tab leaves the cell). All cells share one kernel, like Jupyter.</span>' +
      '<button class="kbtn" type="button" id="restart">Restart kernel</button></div>';
  }

  function tableHTML(t) {
    return '<div class="tbl"><table>' + (t.caption ? "<caption>" + esc(t.caption) + "</caption>" : "") +
      "<thead><tr>" + t.head.map(function (h) { return "<th scope=\"col\">" + h + "</th>"; }).join("") + "</tr></thead><tbody>" +
      t.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + x + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
  }

  function renderWeek(W) {
    curWeek = W; var P = "w" + W.n + "-";
    learned = store.get("dap-learned-w" + W.n, {});
    cells = [];
    kernel.count = 0;
    if (kernel.py) kernel.py.runPython("_G = {}");
    var h = '<header class="hero"><p class="eyebrow">Week ' + W.n + ' of 12</p>' +
      '<h1>' + esc(W.title) + '</h1><p class="week-sub">' + esc(W.short) + '</p>' +
      '<div class="stats"><div class="stat"><b>' + W.topics.length + '</b><span>Topics</span></div>' +
      '<div class="stat"><b>' + W.topics.reduce(function (n, t) { return n + t.cells.length; }, 0) + '</b><span>Runnable code cells</span></div>' +
      '<div class="stat"><b>' + W.quiz.length + '</b><span>Quiz questions</span></div>' +
      '<div class="stat"><b>' + W.exercises.length + '</b><span>Practice exercises</span></div>' +
      '<div class="stat accent"><b>' + W.assignment.length + '</b><span>Graded questions · pass at 66%</span></div></div>' +
      '<p class="overview-h">In this week</p><div class="overview" id="overview">' +
      W.topics.map(function (t, i) { return '<a href="#' + P + t.id + '" data-id="' + t.id + '"><span class="n">' + String(i + 1).padStart(2, "0") + '</span><span>' + esc(t.title) + '</span></a>'; }).join("") +
      '</div></header>' +
      kernelBar() + '<div id="topics"></div>';
    h += '<section class="topic" id="' + P + 'errors" aria-labelledby="' + P + 'errors-h"><div class="topic-head"><span class="topic-num">Help</span><h2 id="' + P + 'errors-h">Reading error messages</h2></div>' +
      '<p class="summary">Read a traceback from the bottom up: the last line names the error and says what went wrong. These are the ones you\'ll meet most in Week ' + W.n + '.</p>' +
      tableHTML({ head: ["Error", "Example message", "What it usually means"], rows: W.errors.map(function (e) { return ["<code>" + e[0] + "</code>", "<code>" + esc(e[1]) + "</code>", esc(e[2])]; }) }) + "</section>";
    h += '<section class="topic" id="' + P + 'glossary" aria-labelledby="' + P + 'glossary-h"><div class="topic-head"><span class="topic-num">Words</span><h2 id="' + P + 'glossary-h">Glossary</h2></div>' +
      '<p class="summary">The terms from this week, in plain words.</p>' +
      tableHTML({ head: ["Term", "Meaning"], rows: W.glossary.map(function (g) { return ["<b>" + esc(g[0]) + "</b>", esc(g[1])]; }) }) + "</section>";
    h += '<section class="topic" id="' + P + 'quiz" aria-labelledby="' + P + 'quiz-h"><div class="topic-head"><span class="topic-num">Check</span><h2 id="' + P + 'quiz-h">Quick quiz</h2></div>' +
      '<p class="summary">' + W.quiz.length + ' questions on Week ' + W.n + '. Pick an answer to see whether it\'s right and why.</p><div id="quizBody"></div>' +
      '<div class="score"><span>Score <strong id="scoreNum">0</strong> / ' + W.quiz.length + '</span><span id="scoreMsg"></span><button class="btn" type="button" id="quizReset">Reset quiz</button></div></section>';
    h += '<section class="topic" id="' + P + 'practice" aria-labelledby="' + P + 'practice-h"><div class="topic-head"><span class="topic-num">Practice</span><h2 id="' + P + 'practice-h">Practice exercises</h2></div>' +
      '<p class="summary">Extra data exercises, separate from the graded questions. Try each one yourself first, then the hint, and only then the solution, which you can run and change.</p><div id="exBody"></div></section>';
    h += '<section class="topic" id="' + P + 'assignment" aria-labelledby="' + P + 'assignment-h"><div class="topic-head"><span class="topic-num">Graded</span><h2 id="' + P + 'assignment-h">Assignment checklist</h2></div>' +
      '<p class="summary">The ' + W.assignment.length + ' questions from the Week ' + W.n + ' notebook. Answer them in your own notebook and tick them off here. You need 66% correct, and some answers are worth more than others. Never leave one empty: a partial answer can still earn points.</p><ul class="checklist" id="asgList"></ul></section>';
    h += '<section class="topic" id="' + P + 'next" aria-labelledby="' + P + 'next-h"><div class="topic-head"><span class="topic-num">Next</span><h2 id="' + P + 'next-h">' + esc(W.next.title) + '</h2></div>' +
      '<p class="summary">' + W.next.summary + '</p><ul>' + W.next.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("") + '</ul></section>';
    view.innerHTML = h;

    var topicsEl = document.getElementById("topics");
    var tocHTML = "";
    W.topics.forEach(function (t, i) {
      var num = String(i + 1).padStart(2, "0"), id = P + t.id;
      var s = document.createElement("section");
      s.className = "topic"; s.id = id; s.setAttribute("aria-labelledby", id + "-h");
      var html = '<div class="topic-head"><span class="topic-num">' + num + '</span><h2 id="' + id + '-h">' + t.title + "</h2></div>" +
        '<p class="summary">' + t.summary + "</p><ul>" + t.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("") + "</ul>";
      (t.tables || []).forEach(function (tb) { html += tableHTML(tb); });
      t.cells.forEach(function (_, j) { html += '<div data-c="' + j + '"></div>'; });
      if (t.note) html += '<div class="callout note"><span class="tag">Note</span><div>' + t.note + "</div></div>";
      if (t.trap) html += '<div class="callout trap"><span class="tag">Trap</span><div>' + t.trap + "</div></div>";
      if (t.analyst) html += '<div class="callout note"><span class="tag">Think</span><div>' + t.analyst + "</div></div>";
      if (t.data) html += '<div class="callout data"><span class="tag">In data work</span><div>' + t.data + "</div></div>";
      html += '<div class="topic-foot"><button class="learn" type="button" aria-pressed="false" data-id="' + t.id + '">Mark as learned</button></div>';
      s.innerHTML = html;
      topicsEl.appendChild(s);
      t.cells.forEach(function (c, j) { makeCell(s.querySelector('[data-c="' + j + '"]'), c); });
      s.querySelector(".learn").addEventListener("click", function () { learned[t.id] = !learned[t.id]; store.set("dap-learned-w" + W.n, learned); paintLearned(); });
      tocHTML += '<li><a href="#' + id + '" data-id="' + t.id + '"><span class="n">' + num + "</span><span>" + t.title + '</span><span class="tick" aria-hidden="true"></span></a></li>';
    });
    tocHTML += '<li class="sep" aria-hidden="true"></li>';
    [["errors", "Reading error messages", "?!"], ["glossary", "Glossary", "Aa"], ["quiz", "Quick quiz", "✓"], ["practice", "Practice exercises", "Ex"], ["assignment", "Assignment checklist", "Q"], ["next", W.next.title, "→"]].forEach(function (x) {
      tocHTML += '<li><a href="#' + P + x[0] + '"><span class="n">' + x[2] + "</span><span>" + x[1] + "</span><span></span></a></li>";
    });
    toc.innerHTML = tocHTML;
    document.querySelector(".progress").style.display = "";
    paintLearned();

    renderQuiz();
    var exBody = document.getElementById("exBody");
    W.exercises.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "ex";
      d.innerHTML = "<summary>" + (i + 1) + ". " + esc(e.t) + '<span class="ex-level">' + e.lvl + "</span></summary>" +
        '<div class="ex-body"><p>' + e.task + "</p>" +
        '<button type="button" class="reveal" data-k="h">Show hint</button><button type="button" class="reveal" data-k="s">Show solution</button>' +
        '<p class="hint" hidden><b>Hint:</b> ' + esc(e.hint) + '</p><div class="sol" hidden></div></div>';
      exBody.appendChild(d);
      var made = false;
      d.querySelectorAll(".reveal").forEach(function (b) {
        b.addEventListener("click", function () {
          var el = d.querySelector(b.dataset.k === "h" ? ".hint" : ".sol");
          if (b.dataset.k === "s" && !made) { makeCell(el.appendChild(document.createElement("div")), { code: e.sol, saved: e.saved, label: "Solution" }); made = true; }
          el.hidden = !el.hidden;
          b.textContent = (el.hidden ? "Show " : "Hide ") + (b.dataset.k === "h" ? "hint" : "solution");
        });
      });
    });

    var asgDone = store.get("dap-asg-w" + W.n, {});
    var asgList = document.getElementById("asgList");
    W.assignment.forEach(function (text, i) {
      var li = document.createElement("li");
      li.innerHTML = '<label for="' + P + 'asg' + i + '"><input type="checkbox" id="' + P + 'asg' + i + '"' + (asgDone[i] ? " checked" : "") + '><span class="qn">Q' + (i + 1) + "</span><span>" + esc(text) + "</span></label>";
      asgList.appendChild(li);
      li.querySelector("input").addEventListener("change", function (ev) { asgDone[i] = ev.target.checked; store.set("dap-asg-w" + W.n, asgDone); });
    });
    document.getElementById("restart").addEventListener("click", restartKernel);
  }

  function paintLearned() {
    var n = 0;
    curWeek.topics.forEach(function (t) {
      var on = !!learned[t.id]; if (on) n++;
      var b = view.querySelector('.learn[data-id="' + t.id + '"]');
      if (b) { b.setAttribute("aria-pressed", on ? "true" : "false"); b.textContent = on ? "Learned ✓" : "Mark as learned"; }
      var a = toc.querySelector('a[data-id="' + t.id + '"]');
      if (a) a.classList.toggle("done", on);
      var o = view.querySelector('#overview a[data-id="' + t.id + '"]');
      if (o) o.classList.toggle("done", on);
    });
    document.getElementById("progText").textContent = n + " / " + curWeek.topics.length;
    document.getElementById("progBar").style.width = (n / curWeek.topics.length * 100) + "%";
    document.getElementById("progLabel").textContent = "Week " + curWeek.n + " topics learned";
  }

  var answers = {};
  function renderQuiz() {
    var qb = document.getElementById("quizBody");
    qb.innerHTML = "";
    answers = {};
    curWeek.quiz.forEach(function (item, i) {
      var d = document.createElement("div");
      d.className = "q";
      d.innerHTML = '<p class="qt">' + (i + 1) + ". " + esc(item.q) + '</p><div class="opts">' +
        item.o.map(function (o, j) { return '<button type="button" class="opt" data-j="' + j + '">' + esc(o) + "</button>"; }).join("") + '</div><p class="why" hidden></p>';
      qb.appendChild(d);
      d.querySelectorAll(".opt").forEach(function (b) {
        b.addEventListener("click", function () {
          var j = +b.dataset.j;
          answers[i] = j === item.a;
          d.querySelectorAll(".opt").forEach(function (x) { x.disabled = true; if (+x.dataset.j === item.a) x.classList.add("right"); });
          if (j !== item.a) b.classList.add("wrong");
          var w = d.querySelector(".why");
          w.textContent = (j === item.a ? "Correct. " : "Not quite. ") + item.why;
          w.hidden = false;
          paintScore();
        });
      });
    });
    document.getElementById("quizReset").onclick = renderQuiz;
    paintScore();
  }
  function paintScore() {
    var total = curWeek.quiz.length, keys = Object.keys(answers), right = keys.filter(function (k) { return answers[k]; }).length;
    document.getElementById("scoreNum").textContent = right;
    var need = Math.ceil(total * 0.66), pct = Math.round(right / total * 100), msg = document.getElementById("scoreMsg");
    if (keys.length < total) msg.textContent = (total - keys.length) + " left. You need " + need + " right to reach 66%.";
    else msg.textContent = right >= need ? "That's " + pct + "%, above the 66% pass mark." : "That's " + pct + "%. Review the topics you missed and try again.";
  }

  function renderPlaceholder(n) {
    cells = [];
    var w = WEEKS[n - 1];
    view.innerHTML = '<header class="hero placeholder"><p class="eyebrow">Week ' + n + ' of 12</p>' +
      "<h1>Week " + n + " isn't added yet</h1>" +
      '<p class="lede">' + "This page fills in once the week's notebook is added, with notes, runnable cells, a quiz and practice exercises like Week 1.</p></header>" +
      '<section class="topic"><div class="topic-head"><span class="topic-num">Plan</span><h2>The 12 weeks</h2></div>' +
      '<p class="summary">Weeks with a solid border are ready. Dashed weeks are waiting for their notebook.</p><div class="plan">' +
      WEEKS.map(function (x) {
        return '<a href="#week-' + x.n + '" class="' + (x.ready ? "ready" : "locked") + '"><span class="wk">Week ' + String(x.n).padStart(2, "0") + "</span><b>" + esc(x.title) + '</b><span class="s">' + esc(x.note) + "</span></a>";
      }).join("") + "</div></section>";
    toc.innerHTML = WEEKS.filter(function (x) { return x.ready; }).map(function (x) { return '<li><a href="#week-' + x.n + '"><span class="n">' + String(x.n).padStart(2, "0") + '</span><span>Week ' + x.n + ': ' + esc(x.title) + '</span><span></span></a></li>'; }).join("");
    document.querySelector(".progress").style.display = "none";
  }

  var shownWeek = 0;
  function route() {
    var h = location.hash.replace(/^#/, ""), week = 1, target = null, m;
    if ((m = h.match(/^week-(\d+)$/))) week = Math.min(12, Math.max(1, +m[1]));
    else if ((m = h.match(/^w(\d+)-[a-z0-9-]+$/))) { week = +m[1]; target = h; }
    if (week !== shownWeek) {
      shownWeek = week;
      renderWeeksNav(week);
      if (WEEKS[week - 1].ready) renderWeek(WEEKS[week - 1].data); else renderPlaceholder(week);
      if (!target) window.scrollTo(0, 0);
    }
    if (target) { var el = document.getElementById(target); if (el) el.scrollIntoView(); }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
