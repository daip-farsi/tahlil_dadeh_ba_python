-2  sign = -1\npoint (2, 0): -y + mx + q = +3  sign = +1\npoint (1, 2): -y + mx + q = +0  sign = +0\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "To build a column of identical labels, the notebook suggests <code>np.fill()<\/code>, which doesn't exist. The function is <code>np.full(n, 'A')<\/code>. pandas also fills a column automatically: <code>pd.DataFrame({'x': xs, 'class': 'A'})<\/code>.", "note": "Q4's code hides a bug that doesn't raise an error at first, and Q7 asks how you'd handle three or more classes. Both are for you to work out."}, {"id": "iris", "title": "Preparing the Iris dataset for scikit-learn", "summary": "scikit-learn has its own Iris loader. It gives NumPy arrays instead of a DataFrame, so you select features by transposing and masking.", "bullets": ["<code>load_iris()<\/code> returns a dict-like object with keys such as <code>data<\/code>, <code>target<\/code>, <code>target_names<\/code> and <code>DESCR<\/code> (a text description).", "Transposing a matrix swaps rows and columns: points become columns and features become rows. Then a splat can grab the last two features.", "Transposing back turns the selected features into an X matrix with one row per point.", "The labels are numbers 0, 1 and 2. <code>target_names<\/code> gives the species, matched with a dict comprehension.", "A boolean mask selects rows of a NumPy matrix, just as with DataFrames: <code>mask = classes &lt; 2<\/code>.", "A <a href=\"https://seaborn.pydata.org/tutorial/color_palettes.html\">palette<\/a> sets plot colours. With numeric labels, add <code>palette='muted'<\/code> so seaborn treats them as categories."], "cells": [{"label": "From the lecture: the data dictionary", "code": "from sklearn.datasets import load_iris\niris = load_iris()\nprint('Data keys:', list(iris.keys()))\nprint(iris['data'].shape, iris['target'].shape)\nprint(iris['target_names'])", "saved": {"stdout": "Data keys: ['data', 'target', 'frame', 'target_names', 'DESCR', 'feature_names', 'filename', 'data_module']\n(150, 4) (150,)\n['setosa' 'versicolor' 'virginica']\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "From the lecture: transpose and splat", "code": "import numpy as np\nfrom sklearn.datasets import load_iris\ndata = load_iris()['data']\n*_, pl, pw = data.transpose()\npetals = np.array([pl, pw]).transpose()\nprint(data.shape, '->', petals.shape)\npetals[::20]", "saved": {"stdout": "(150, 4) -> (150, 2)\n", "value": "array([[1.4, 0.2],\n       [1.7, 0.2],\n       [1.3, 0.3],\n       [3.5, 1. ],\n       [3.8, 1.1],\n       [6. , 2.5],\n       [5.7, 2.3],\n       [5.6, 2.4]])", "error": null, "images": [], "html": null}}, {"label": "From the lecture: names for the classes", "code": "import numpy as np\nimport seaborn as sns\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import load_iris\niris = load_iris()\npl, pw = iris['data'][:, 2], iris['data'][:, 3]\nclasses = iris['target']\nconv_dict = {val: str(name) for val, name in enumerate(iris['target_names'])}\nprint('Conversion dictionary:', conv_dict)\nmask = classes < 2\nprint('Selecting', mask.sum(), 'points')\nplt.figure(figsize=(6, 4))\nsns.scatterplot(x=pl, y=pw, hue=[conv_dict[c] for c in classes], palette='muted')\nNone", "saved": {"stdout": "Conversion dictionary: {0: 'setosa', 1: 'versicolor', 2: 'virginica'}\nSelecting 100 points\n", "value": null, "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAXgAAAEACAYAAAC57G0KAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAThRJREFUeF7tnQeYVOW5x//T6/bed2GX3kFApCggKCi2iAYMdiVeNNaLyTVqEknURGOM4r0x2NGA0ajEgiU2VJAmnYUFtvdeZnZmp9zn/cYZpi2zZWBnZt+fz3lkz54553znzP7Pd97v/f6vxG6328EwDMNEHNKIaxHDMAwjYIFnGIaJUFjgGYZhIhQWeIZhmAiFBZ5hGCZCkYdCu2w2Gzo6OqBQKCCRSELhlBiGYUIeSoLs6uqCTqeDVOrbXw8JgSdxP3LkSMhfTIZhmFBk2LBhiIqK8jm1kBB46rkTdJJKpbLX12///v0YM2ZMrz8XqnB7Qhe+N6HLYLw3ZrNZdI6dGupNSAi8MyxD4q5Sqfr0Derr50IVbk/owvcmdBms96a70DYPsjIMw0QoLPAM on_function(X)<\/code> computes <code>m1*x1 + m2*x2 + q<\/code> for you, and its sign is the predicted side. That's more reliable than evaluating the plotted line."}, {"id": "logistic", "title": "Selecting rows with pandas, and Logistic Regression", "summary": "Logistic Regression is another linear binary classifier with the same fit and predict pattern. pandas methods like isin() pick exactly the rows you need.", "bullets": ["Comparing with <code>==<\/code> can be ambiguous: same object, same data, or same values? Explicit methods are clearer.", "One value: <code>df['col'].eq(value)<\/code>. Text patterns: <code>df['col'].str.contains('set')<\/code>. Combine with <code>&amp;<\/code>.", "Several allowed values: <code>df['col'].isin([v1, v2])<\/code>. <code>where()<\/code> and <code>mask()<\/code> exist but are overkill here.", "Save a selection in a variable instead of repeating it. Remember the copy-on-write rules from Week 4.", "<a href=\"https://scikit-learn.org/stable/modules/linear_model.html#logistic-regression\">Logistic Regression<\/a> is a <b>classification<\/b> method despite its name. Names in machine learning come from many fields, so check the docs when in doubt.", "It also gives probabilities: <code>predict_proba(X)<\/code> returns the chance of each class."], "cells": [{"label": "Selecting rows: eq, isin, str.contains", "code": "import pandas as pd\ndf = pd.DataFrame({'species': ['setosa', 'versicolor', 'virginica', 'setosa'],\n                   'petal_length': [1.4, 4.7, 6.0, 1.5]})\nprint(df['species'].eq('setosa').tolist())\nprint(df['species'].isin(['setosa', 'versicolor']).tolist())\nprint(df['species'].str.contains('set').tolist())\ndf[df['species'].isin(['setosa', 'versicolor'])]", "saved": {"stdout": "[True, False, False, True]\n[True, True, False, True]\n[True, False, False, True]\n", "value": null, "error": null, "images": [], "html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n bove give you the building blocks, but the pipeline is yours to build. Q10 then compares its boundary with the Perceptron's."}], "errors": [["ValueError", "Expected 2D array, got 1D array instead", "X must be a matrix, such as df[['a', 'b']] or arr.reshape(-1, 1)."], ["DataConversionWarning", "A column-vector y was passed when a 1d array was expected", "y should be 1D: use df['label'], not df[['label']]."], ["ValueError", "This solver needs samples of at least 2 classes in the data", "Your selection kept only one class. Check the mask or isin()."], ["SyntaxError", "invalid syntax (… else return -1)", "A conditional expression can't contain return. Use return 1 if x >= 0 else -1."], ["AttributeError", "module 'numpy' has no attribute 'fill'", "The function is np.full(n, value)."], ["AttributeError", "'Series' object has no attribute 'contains'", "Text methods live under .str: series.str.contains()."], ["ConvergenceWarning", "lbfgs failed to converge", "The iterative solver stopped early. Scale the features or raise max_iter."], ["NotFittedError", "This Perceptron instance is not fitted yet", "Call fit() before predict(), coef_ or decision_function()."]], "glossary": [["scipy", "NumPy's extension for advanced scientific computing."], ["Sparse matrix", "A matrix that is mostly zeros, stored efficiently."], ["Closed form", "Finding the best parameters by solving an equation directly."], ["Iterative method", "Finding parameters by repeated small improvements."], ["Loss", "The error on one point, such as |y − ŷ|."], ["Square loss", "(y − ŷ)², which punishes big errors most."], ["Risk", "The total loss over the whole dataset."], ["Hyperplane", "A line, plane or higher-dimensional flat surface that splits space."], ["Classification", "Predicting which group (class) a point belongs to."], ["Binary classification", "Choosing between exactly two classes."], ["Decision boundary", "The line or plane where the predicted class changes."], ["One-vs-rest", "Separating one class from all the others."], ["Linearly separable", "Classes that a straight line or plane can separate perfectly."], ["Perceptron", "An iterative linear classifier that is the ancestor of neural networks."], ["Transpose", "Swapping the rows and columns of a matrix."], ["Palette", "A coordinated set of plot colours."], ["Logistic Regression", "A linear classifier that also outputs class probabilities."], ["decision_function", "The model's raw boundary value. Its sign gives the side."]], "fa": {"title": "scikit-learn و دسته‌بندی", "short": "کمینه‌سازی ریسک، مرزهای تصمیم، پرسپترون و رگرسیون لجستیک", "topics": [{"title": "کتابخانه‌هایی که تا اینجا دیده‌ایم", "summary": "جعبه‌ابزار شما مدام بزرگ‌تر می‌شود. این هفته scipy و scikit-learn به NumPy، پانداس، matplotlib و seaborn اضافه می‌شوند.", "bullets": ["<a href=\"https://scipy.org/\"><b>scipy<\/b><\/a> ابزارهای علمی پیشرفته به NumPy اضافه می‌کند، مثل ساختارهای داده‌ی ویژه و <b>ماتریس‌های تُنُک<\/b> (که بیشترشان صفر یا خالی‌اند).", "الگوریتم‌هایی دارد که در علوم مختلف استفاده می‌شوند. با گذشت زمان، خیلی از آن‌ها به زیرماژول‌های NumPy مثل <code>linalg<\/code> و <code>random<\/code> منتقل شده‌اند.", "<a href=\"https://scikit-learn.org/stable/index.html\"><b>scikit-learn<\/b><\/a> حدود ۱۵ سال پیش به‌عنوان تلاشی برای تبدیل scipy به یک کتابخانه‌ی یادگیری ماشین شروع شد.", "امروز برای روش‌های بنیادی سریع و بسیار قابل‌اعتماد است. بیشتر به‌عنوان ابزار تحلیل داده شناخته می‌شود، چون هرگز به سمت یادگیری عمیق نرفت.", "نوت‌بوک‌ها را با یک سلول import (numpy، pandas، seaborn، pyplot) شروع کنید و سلول‌ها را به ترتیب اجرا کنید. اگر نبود، از نوت‌بوک‌های قبلی کپی‌اش کنید."], "tables": [{"caption": "جعبه‌ابزار شما تا اینجا", "head": ["کتابخانه", "import معمول", "کاربرد"], "rows": [["NumPy", "<code>import numpy as np<\/code>", "آرایه‌ها و محاسبات سریع"], ["pandas", "<code>import pandas as pd<\/code>", "جدول‌های داده (DataFrame)"], ["matplotlib", "<code>from matplotlib import pyplot as plt<\/code>", "رسم نمودار سطح پایین"], ["seaborn", "<code>import seaborn as sns<\/code>", "نمودارهای آماری خوش‌ظاهر"], ["scipy", "<code>import scipy<\/code>", "محاسبات علمی پیشرفته"], ["scikit-learn", "<code>import sklearn<\/code>", "یادگیری ماشین: fit و predict"]]}], "note": "Q1 می‌پرسد چطور بفهمید scipy و scikit-learn نصب‌اند و چطور آن‌ها را روی سیستم <i>خودتان<\/i> نصب کنید. بخش import هفته‌ی ۲ و ردیف‌های ModuleNotFoundError در راهنماهای خطای قبلی نقطه‌ی شروع خوبی‌اند.", "labels": []}, {"title": "آشنایی با scikit-learn", "summary": "scikit-learn دسته‌بندی، رگرسیون، خوشه‌بندی، کاهش ابعاد، انتخاب مدل و پیش‌پردازش را پوشش می‌دهد و همه‌ی مدل‌هایش از یک الگو پیروی می‌کنند.", "bullets": ["چیزی را که لازم دارید وارد کنید، مثل <code>from sklearn.linear_model import Perceptron<\/code>. نام کوتاه <code>skl<\/code> هم هست اما به استانداردی <code>np<\/code> یا <code>pd<\/code> نیست.", "<a href=\"https://scikit-learn.org/stable/index.html\">صفحه‌ی اصلی‌اش<\/a> بخش‌های اصلی را فهرست می‌کند. بعضی الگوریتم‌های آنجا قدیمی‌اند و دوره به‌جایشان سراغ جایگزین‌های بهتر می‌رود.", "<b>خوشه‌بندی<\/b> هسته‌ی یادگیری بدون نظارت است. تا اینجا دوره فقط یادگیری نظارت‌شده را دیده است.", "روش‌های <b>تغییر ابعاد<\/b> تعداد ویژگی‌ها را کم می‌کنند (برای انسان راحت‌تر) یا زیاد می‌کنند (برای ماشین راحت‌تر).", "<b>ورودی X باید دوبعدی باشد<\/b>، یعنی ماتریسی با یک ردیف برای هر نقطه. <b>برچسب‌های y باید یک‌بعدی باشند<\/b>، یک برچسب برای هر نقطه.", "همه‌ی مدل‌ها یک‌جور کار می‌کنند: بسازید، <code>fit(X, y)<\/code> کنید، بعد <code>predict(X)<\/code> کنید و پارامترهای یادگرفته را بخوانید."], "trap": "نوت‌بوک می‌گوید scikit-learn نمی‌تواند DataFrame بگیرد. نسخه‌های جدید DataFrame و Series را می‌پذیرند، همان‌طور که خود نوت‌بوک بعداً می‌گوید. فقط مطمئن شوید X همچنان دوبعدی است (<code>df[['a', 'b']]<\/code>) و y یک‌بعدی (<code>df['label']<\/code>).", "labels": ["شکل‌هایی که scikit-learn انتظار دارد"]}, {"title": "بهبود رگرسیون: کمینه‌سازی ریسک", "summary": "آموزش یعنی تعریف اینکه یک مدل چقدر بد است و بعد جست‌وجوی پارامترهایی که آن را تا حد ممکن خوب کنند. رگرسیون خطی این کار را با زیان مربعی انجام می‌دهد.", "bullets": ["دو راه برای پیدا کردن پارامترها هست: <b>فرم بسته<\/b> (حل مستقیم یک معادله برای بهینه) یا <b>تکراری<\/b> (امتحان کن، شکست بخور، اصلاح کن، تکرار کن).", "بیشتر مدل‌های یادگیری ماشین تکراری‌اند، که اجازه می‌دهد با رسیدن داده‌ی بیشتر بهتر شوند. رگرسیون خطی فرم بسته است.", "خطا روی یک نقطه <b>زیان<\/b> (Loss) نام دارد. ساده‌ترینش |y − ŷ| است، که |…| یعنی قدرمطلق.", "رگرسیون خطی از <b>زیان مربعی<\/b>، (y − ŷ)²، استفاده می‌کند. همیشه مثبت است و چند خطای بزرگ را گران‌تر از خطاهای کوچک زیاد حساب می‌کند: (3+2)² = 25، تقریباً سه برابر 3² = 9.", "<b>ریسک<\/b> مجموع زیان روی کل مجموعه‌داده است. آموزش ریسک را کمینه می‌کند.", "بیشتر منابع آنلاین فقط از زیان حرف می‌زنند، چون همین بخش است که بین روش‌ها تغییر می‌کند."], "note": "درس هر خطا را با یک lineplot جدا می‌کشد که برای ۱۰۰ نقطه کند است. <code>plt.vlines(x, y_start, y_end)<\/code> همه را در یک فراخوانی می‌کشد، مثل سلول بالا. برای Q3 فکر کنید چطور ۱۲ ردیف <i>با فاصله‌ی یکسان<\/i> انتخاب کنید: یک اندازه‌ی گام یا <code>np.linspace<\/code> با اعداد صحیح.", "labels": ["مثال داده: زیان‌ها به شکل خط‌های عمودی"]}, {"title": "دسته‌بندی", "summary": "یک خط صفحه را دو نیم می‌کند. دسته‌بندی از این تقسیم به‌عنوان مرز تصمیم استفاده می‌کند: نقطه‌های یک طرف به یک دسته تعلق دارند و نقطه‌های طرف دیگر به دسته‌ی دیگر.", "bullets": ["یک مدل خطی یک خط یا، به‌طور کلی‌تر، یک <a href=\"https://en.wikipedia.org/wiki/Hyperplane\">ابرصفحه<\/a> است. فضای ورودی را به «بالا» و «پایین» تقسیم می‌کند.", "<b>دسته‌بندی<\/b> یعنی جدا کردن نقطه‌ها بر اساس یک ویژگی. مدل مرز را یاد می‌گیرد و بعد می‌گوید هر نقطه در کدام طرف است.", "y = mx + q را به شکل <code>-y + mx + q = 0<\/code> بنویسید. x و y یک نقطه را جایگذاری کنید و به علامت نتیجه نگاه کنید.", "صفر یعنی نقطه <b>روی<\/b> خط است. عدد مثبت یا منفی نقطه را در یک طرف یا طرف دیگر می‌گذارد.", "انتخاب بین دو دسته <b>دسته‌بندی دودویی<\/b> است. خط <b>مرز تصمیم<\/b> است: آستانه‌ای که تصمیم در آن عوض می‌شود.", "کتابخانه‌ها معمولاً مرز را به شکل <code>ax + by + c = 0<\/code> یا شکل برداری آفین <code>WX = 0<\/code> برمی‌گردانند."], "note": "کد Q4 باگی دارد که اول خطا نمی‌دهد، و Q7 می‌پرسد سه دسته یا بیشتر را چطور دسته‌بندی می‌کنید. هر دو با خودتان است.", "trap": "نوت‌بوک برای ساختن ستونی از برچسب‌های یکسان <code>np.fill()<\/code> را پیشنهاد می‌کند که وجود ندارد. نام تابع <code>np.full(n, 'A')<\/code> است. پانداس هم یک ستون را خودکار پر می‌کند: <code>pd.DataFrame({'x': xs, 'class': 'A'})<\/code>.", "labels": ["مثال داده: کدام طرف y = x + 1؟"]}, {"title": "آماده کردن مجموعه‌داده‌ی Iris برای scikit-learn", "summary": "scikit-learn بارگذار Iris خودش را دارد. به‌جای DataFrame آرایه‌های NumPy می‌دهد، پس ویژگی‌ها را با ترانهاده و ماسک انتخاب می‌کنید.", "bullets": ["<code>load_iris()<\/code> شیئی شبیه دیکشنری با کلیدهایی مثل <code>data<\/code>، <code>target<\/code>، <code>target_names<\/code> و <code>DESCR<\/code> (یک توضیح متنی) برمی‌گرداند.", "ترانهاده کردن یک ماتریس جای ردیف‌ها و ستون‌ها را عوض می‌کند: نقطه‌ها ستون می‌شوند و ویژگی‌ها ردیف. بعد یک اسپلت می‌تواند دو ویژگی آخر را بردارد.", "ترانهاده‌ی دوباره ویژگی‌های انتخاب‌شده را به ماتریس X با یک ردیف برای هر نقطه تبدیل می‌کند.", "برچسب‌ها اعداد 0، 1 و 2 هستند. <code>target_names<\/code> نام گونه‌ها را می‌دهد که با یک کامپرهنشن دیکشنری جفت می‌شوند.", "یک ماسک بولی ردیف‌های یک ماتریس NumPy را انتخاب می‌کند، درست مثل DataFrameها: <code>mask = classes &lt; 2<\/code>.", "یک <a href=\"https://seaborn.pydata.org/tutorial/color_palettes.html\">پالت<\/a> رنگ‌های نمودار را تعیین می‌کند. با برچسب‌های عددی <code>palette='muted'<\/code> را اضافه کنید تا seaborn آن‌ها را دسته در نظر بگیرد."], "trap": "نوت‌بوک setosa در برابر بقیه را <b>دسته‌بندی تک‌کلاسه<\/b> می‌نامد. نام رایجش <b>یکی در برابر بقیه<\/b> (one-vs-rest) است. دسته‌بندی تک‌کلاسه معمولاً یعنی یادگیری فقط از یک دسته، مثل تشخیص ناهنجاری.", "data": "انتظار داشته باشید آماده‌سازی داده <b>تا ۸۰٪<\/b> یک پروژه را بگیرد. وقتی کسی می‌پرسد کی نتیجه می‌دهید، برایش بودجه بگذارید. زودتر تحویل دادن از قول بیش از حد بهتر است.", "labels": ["از درس: دیکشنری داده", "از درس: ترانهاده و اسپلت", "از درس: نام برای دسته‌ها"]}, {"title": "دسته‌بندی دودویی خطی با پرسپترون", "summary": "پرسپترون یک الگوریتم تکراری است که خط را کم‌کم جابه‌جا می‌کند تا هر نقطه در طرف درستش قرار بگیرد. scikit-learn همان الگوی fit و predict را دارد.", "bullets": ["الگوریتم: با پارامترهای تصادفی شروع کنید، یک نقطه‌ی اشتباه دسته‌بندی‌شده پیدا کنید (<b>علامت<\/b> معادله‌ی مرز را با برچسبش، +1 یا −1، مقایسه کنید)، خط را کمی اصلاح کنید و تکرار کنید تا اشتباهی نماند.", "اگر هیچ خطی نتواند دسته‌ها را جدا کند، آن‌ها <b>جدایی‌پذیر خطی<\/b> نیستند و یک پرسپترون ساده هرگز متوقف نمی‌شود.", "بیشتر به‌عنوان جد نورون‌های شبکه‌های عصبی امروزی معروف است، نه به خاطر عملکردش.", "در دسته‌بندی، <code>coef_<\/code> اینجا <b>دو<\/b> مقدار دارد: یکی برای طول گلبرگ و یکی برای عرض گلبرگ. دسته‌بندی یک بُعد بالاتر از رگرسیون است: <code>class_hat = m1*length + m2*width + q<\/code>.", "چیزی که رسم می‌کنید <b>مرز تصمیم<\/b> است، جایی که مقدار دسته 0 است: <code>m1*length + m2*width + q = 0<\/code>. وقتی برای width حلش کنیم: <code>width = -m1/m2 * length - q/m2<\/code>.", "این گام، از پارامترهای سه‌بعدی مدل به مرز دوبعدی، برای امتحان مهم است. بعد از اجرای سلول‌ها دوباره بخوانیدش."], "note": "اینکه کدام طرف مثبت حساب شود به علامت ضرایب مدل بستگی دارد، نه به شیبی که می‌بینید. <code>model.decision_function(X)<\/code> مقدار <code>m1*x1 + m2*x2 + q<\/code> را برایتان حساب می‌کند و علامتش طرف پیش‌بینی‌شده است. این از ارزیابی خط رسم‌شده قابل‌اعتمادتر است.", "trap": "<code>def sign(x): return +1 if x&gt;=0 else return -1<\/code> در نوت‌بوک خطای نحوی (SyntaxError) است: یک عبارت شرطی نمی‌تواند <code>return<\/code> دوم داشته باشد. بنویسید <code>return 1 if x &gt;= 0 else -1<\/code>، یا فقط از <code>np.sign()<\/code> استفاده کنید.", "labels": ["از درس: آموزش", "از درس: رسم مرز", "بررسی طرف یک نقطه به روش مطمئن"]}, {"title": "انتخاب ردیف‌ها با پانداس، و رگرسیون لجستیک", "summary": "رگرسیون لجستیک یک دسته‌بند دودویی خطی دیگر با همان الگوی fit و predict است. متدهای پانداس مثل isin() دقیقاً ردیف‌هایی ح دهید چطور بررسی می‌کنید scipy و scikit-learn نصب‌اند و چطور آن‌ها را روی سیستم خودتان نصب می‌کنید.", "DataFrame سؤال Q9 هفته‌ی قبل را فقط با x، y و y_hat ذخیره کنید و اینجا به نام df بارگذاری کنید تا کد رسم زیان‌ها اجرا شود.", "کد رسم زیان‌ها را طوری تغییر دهید که فقط ۱۲ نقطه با فاصله‌ی یکسان در طول اندیس نشان دهد.", "کد رسم دسته‌بندی را اصلاح کنید و m و q ای پیدا کنید که دسته‌ی سبز را از قرمز جدا کند.", "هر دو دسته را در یک DataFrame پانداس نگه دارید و با یک فراخوانی scatterplot، به رنگ دسته‌ها، رسمشان کنید.", "از روی نمودارتان حدس بزنید نقطه‌ی [0, 5] به کدام دسته تعلق دارد و بعد با علامت معادله‌ی مرزتان بررسی‌اش کنید.", "با شهودتان و اصطلاحات درست توضیح دهید چطور ممکن است سه دسته یا بیشتر را دسته‌بندی کنید.", "باگ کد انتخاب class_labels را توضیح دهید و اصلاحش کنید.", "فقط با پانداس (و بارگذاری Iris از seaborn)، یک رگرسیون لجستیک روی setosa در برابر versicolor آموزش دهید و داده را به رنگ دسته‌ها با مرز تصمیم روی آن رسم کنید.", "مرز پرسپترون را به همان نمودار اضافه کنید. آیا دو مرز متفاوت‌اند؟ چرا ممکن است این‌طور باشد؟"], "next": {"title": "پیش از هفته‌ی ۷", "summary": "برای رگرسیون، زیان ساده است. هفته‌ی بعد نشان می‌دهد خطاها در دسته‌بندی چطور کار می‌کنند، با ماتریس درهم‌ریختگی.", "bullets": ["مطمئن شوید می‌توانید دو ضریب و عرض از مبدأ یک دسته‌بند را به خط مرز دوبعدی تبدیل کنید و دلیلش را توضیح دهید.", "ماتریس درهم‌ریختگی جواب‌های درست و اشتباه را بر اساس نوعشان می‌شمارد و خیلی از امتیازهای مفید از آن ساخته می‌شوند.", "انتخاب در پانداس با isin()، loc و ماسک‌های بولی را تمرین کنید: امتحان به آن‌ها تکیه دارد."]}}, "quiz": [{"q": "What is scipy?", "o": ["A plotting library", "An extension of NumPy for advanced scientific computing", "A database", "A web framework"], "a": 1, "why": "scikit-learn grew out of it."}, {"q": "What shapes does scikit-learn expect?", "o": ["X 1D, y 2D", "X 2D, y 1D", "Both 2D", "Both 1D"], "a": 1, "why": "X is a matrix of points × features, y one label per point."}, {"q": "Linear regression finds its parameters…", "o": ["Iteratively", "In   function hl(code) {
    var re = /(#[^\n]*)|(f?"(?:[^"\\\n]|\\.)*"|f?'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_]\w*)/g, out = "", last = 0, m;

      out += esc(code.slice(last, m.index));

      if (m[1]) out += '<span class="tok-c">' + esc(t) + "</span>";

      else if (KW.test(t)) out += '<span class="tok-k">' + t + "</span>";
      else if (BI.test(t) && code.charAt(re.lastIndex) === "(") out += '<span class="tok-f">' + t + "</span>";

  function restartKernel() {

  function renderOutput(c, r, note) {

  function runCell(c) {
    kernel.count += 1;
    var n = kernel.count;
    c.prompt.textContent = "In [*]:";
    var code = c.ta.value;
    loadKernel().then(function (py) {
      var needs = /\b(numpy|pandas|seaborn|matplotlib)\b/.test(code) && !kernel.libs;
      setStatus(needs ? "loading" : "busy", needs ? T("stLibs") : statusText());
      return py.loadPackagesFromImports(code).then(function () {
        if (!/\bseaborn\b/.test(code) || kernel.seaborn) return;
        return py.loadPackage("micropip").then(function () {
          py.globals.set("_SNS_SRC", SEABORN);
          return py.runPythonAsync("import micropip\nawait micropip.install(_SNS_SRC)");
        }).then(function () { kernel.seaborn = true; }, function () { kernel.seabornFailed = true; });
      }).then(function () { if (needs) kernel.libs = true; return py; });
    }).then(function (py) {
      if (kernel.seabornFailed && /\bseaborn\b/.test(code)) {
        c.prompt.textContent = "In [" + n + "]:";
        setStatus("ready", statusText());
        if (code === c.original) renderOutput(c, c.saved, T("savedSns"));
        else renderOutput(c, { stdout: "", value: null, error: null }, T("editedSns"));
        return;
      }
      setStatus("busy", statusText());
      setTimeout(function () {
        try {
          py.globals.set("_SRC", code);
          var res = py.runPython("run_cell(_SRC, _G)");
          var arr = res.toJs(); res.destroy();
          c.prompt.textContent = "In [" + n + "]:";
          renderOutput(c, { stdout: arr[0], value: arr[1] == null ? null : arr[1], error: arr[2] == null ? null : arr[2], images: arr[3] || [], html: arr[4] == null ? null : arr[4] });
        } catch (e) {
          c.prompt.textContent = "In [" + n + "]:";
          renderOutput(c, { stdout: "", value: null, error: String(e && e.message || e).split("\n").filter(Boolean).pop() });
        }
        setStatus("ready", statusText());
      }, 10);
    }).catch(function () {
      c.prompt.textContent = "In [" + n + "]:";
      if (code === c.original) renderOutput(c, c.saved, T("savedPy"));
      else renderOutput(c, { stdout: "", value: null, error: null }, T("editedPy"));
    });
  }

  function makeCell(host, spec) {

      '<div class="out-row" hidden><div class="prompt outp"></div><div class="output" dir="ltr"></div></div>';
    var c = {
      prompt: host.querySelector(".prompt"), pre: host.querySelector("pre"), ta: host.querySelector("textarea"),
      outRow: host.querySelector(".out-row"), outBox: host.querySelector(".output"), outPrompt: host.querySelector(".outp"),
      reset: host.querySelector(".reset"), original: spec.code, saved: spec.saved
    };
    function sync() {
      c.pre.innerHTML = hl(c.ta.value) + "\n";

      c.reset.hidden = c.ta.value === c.original;

  /* ---------- line-fitting playground (pure JavaScript, no Python needed) ---------- */
  function lineFitHTML() {
    return '<div class="linefit"><p class="lf-title">' + T("wTitle") + '</p><p class="lf-help">' + T("wHelp") + '</p>' +
      '<canvas width="640" height="340" aria-label="' + esc(T("wTitle")) + '"></canvas>' +
      '<div class="lf-controls" dir="ltr">' +
      '<label>m <input type="range" min="-5" max="5" step="0.1" value="0" data-p="m"><output data-o="m">0.0</output></label>' +
      '<label>q <input type="range" min="-8" max="8" step="0.1" value="0" data-p="q"><output data-o="q">0.0</output></label></div>' +
      '<div class="lf-read"><span class="lf-eq" dir="ltr"></span><span class="lf-mse"></span></div>' +
      '<div class="lf-btns"><button type="button" class="reveal" data-a="new">' + T("wNew") + '</button><button type="button" class="reveal" data-a="best">' + T("wShow") + '</button><span class="lf-best" dir="ltr" hidden></span></div></div>';
  }
  function initLineFit(box) {
    var cv = box.querySelector("canvas"), ctx = cv.getContext("2d");
    var mIn = box.querySelector('[data-p="m"]'), qIn = box.querySelector('[data-p="q"]');
    var pts = [], fit = null, showBest = false;
    function gauss() { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
    function newData() {
      var tm = Math.round((Math.random() * 6 - 3) * 10) / 10, tq = Math.round((Math.random() * 8 - 4) * 10) / 10;
      pts = [];
      for (var i = 0; i < 60; i++) { var x = -5 + 10 * i / 59; pts.push([x, tm * x + tq + 2 * gauss()]); }
      var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
      pts.forEach(function (p) { sx += p[0]; sy += p[1]; sxx += p[0] * p[0]; sxy += p[0] * p[1]; });
      var m = (n * sxy - sx * sy) / (n * sxx - sx * sx); fit = [m, (sy - m * sx) / n];
    }
    function fmt(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function eq(m, q) { return "y = " + fmt(m) + "x " + (q >= 0 ? "+ " : "− ") + fmt(Math.abs(q)); }
    function draw() {
      var css = getComputedStyle(document.documentElement), W = cv.width, H = cv.height, pad = 30;
      var R = Math.max(8, Math.max.apply(null, pts.map(function (p) { return Math.abs(p[1]); })) * 1.08);
      var X = function (x) { return pad + (x + 5) / 10 * (W - 2 * pad); }, Y = function (y) { return H / 2 - y / (2 * R) * (H - 2 * pad); };
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = css.getPropertyValue("--line"); ctx.lineWidth = 1;
      for (var g = -5; g <= 5; g++) { ctx.beginPath(); ctx.moveTo(X(g), pad / 2); ctx.lineTo(X(g), H - pad / 2); ctx.stroke(); }
      ctx.strokeStyle = css.getPropertyValue("--muted"); ctx.beginPath(); ctx.moveTo(X(-5), Y(0)); ctx.lineTo(X(5), Y(0)); ctx.moveTo(X(0), pad / 2); ctx.lineTo(X(0), H - pad / 2); ctx.stroke();
      ctx.fillStyle = css.getPropertyValue("--blue");
      pts.forEach(function (p) { ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 3.5, 0, 7); ctx.fill(); });
      if (showBest) { ctx.setLineDash([6, 5]); ctx.strokeStyle = css.getPropertyValue("--muted"); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(-5), Y(fit[0] * -5 + fit[1])); ctx.lineTo(X(5), Y(fit[0] * 5 + fit[1])); ctx.stroke(); ctx.setLineDash([]); }
      var m = +mIn.value, q = +qIn.value;
      ctx.strokeStyle = "#D1453B"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(-5), Y(-5 * m + q)); ctx.lineTo(X(5), Y(5 * m + q)); ctx.stroke();
      var mse = pts.reduce(function (s, p) { var e = p[1] - (m * p[0] + q); return s + e * e; }, 0) / pts.length;
      box.querySelector('[data-o="m"]').textContent = (+mIn.value).toFixed(1);
      box.querySelector('[data-o="q"]').textContent = (+qIn.value).toFixed(1);
      box.querySelector(".lf-eq").textContent = eq(m, q);
      box.querySelector(".lf-mse").textContent = T("wMse") + ": " + N(fmt(mse));
      var b = box.querySelector(".lf-best"); b.hidden = !showBest; b.textContent = T("wBest") + ": " + eq(fit[0], fit[1]);
    }
    mIn.addEventListener("input", draw); qIn.addEventListener("input", draw);
    box.querySelector('[data-a="new"]').addEventListener("click", function () { newData(); draw(); });
    box.querySelector('[data-a="best"]').addEventListener("click", function (e) { showBest = !showBest; e.target.textContent = showBest ? T("wHide") : T("wShow"); draw(); });
    newData(); draw();
  }

      '<p class="overview-h">' + T("inThisWeek") + '</p><div class="overview" id="overview">' +
      W.topics.map(function (t, i) { return '<a href="#' + P + t.id + '" data-id="' + t.id + '"><span class="n">' + pad(i + 1) + '</span><span>' + esc(t.title) + '</span></a>'; }).join("") +
      '</div></header>' +
      kernelBar() + '<div id="topics"></div>';
    h += '<section class="topic" id="' + P + 'errors" aria-labelledby="' + P + 'errors-h">' + head(P, "errors", T("kHelp"), T("hErrors")) +
      '<p class="summary">' + T("errorsSum")(W.n) + '</p>' +
      tableHTML({ head: T("errorsHead"), rows: W.errors.map(function (e) { return ['<code>' + e[0] + "</code>", '<code>' + esc(e[1]) + "</code>", esc(e[2])]; }) }) + "</section>";
    h += '<section class="topic" id="' + P + 'glossary" aria-labelledby="' + P + 'glossary-h">' + head(P, "glossary", T("kWords"), T("hGlossary")) +
      '<p class="summary">' + T("glossarySum") + '</p>' +
      tableHTML({ head: T("glossaryHead"), rows: W.glossary.map(function (g) { return ["<b>" + esc(g[0]) + "</b>", esc(g[1])]; }) }) + "</section>";
    h += '<section class="topic" id="' + P + 'quiz" aria-labelledby="' + P + 'quiz-h">' + head(P, "quiz", T("kCheck"), T("hQuiz")) +
      '<p class="summary">' + T("quizSum")(W.quiz.length, W.n) + '</p><div id="quizBody"></div>' +
      '<div class="score"><span>' + T("score") + ' <strong id="scoreNum">' + N(0) + '</strong> ' + (LANG === "fa" ? "از " : "/ ") + N(W.quiz.length) + '</span><span id="scoreMsg"></span><button class="btn" type="button" id="quizReset">' + T("resetQuiz") + '</button></div></section>';
    h += '<section class="topic" id="' + P + 'practice" aria-labelledby="' + P + 'practice-h">' + head(P, "practice", T("kPractice"), T("hPractice")) +
      '<p class="summary">' + T("practiceSum") + '</p><div id="exBody"></div></section>';
    h += '<section class="topic" id="' + P + 'assignment" aria-labelledby="' + P + 'assignment-h">' + head(P, "assignment", T("kGraded"), T("hAsg")) +
      '<p class="summary">' + T("asgSum")(W.assignment.length, W.n) + '</p><ul class="checklist" id="asgList"></ul></section>';
    h += '<section class="topic" id="' + P + 'next" aria-labelledby="' + P + 'next-h">' + head(P, "next", T("kNext"), esc(W.next.title)) +
      '<p class="summary">' + W.next.summary + '</p><ul>' + W.next.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("") + '</ul></section>';
    view.innerHTML = h;

    var topicsEl = document.getElementById("topics");
    var tocHTML = "";
    W.topics.forEach(function (t, i) {
      var num = pad(i + 1), id = P + t.id;
      var s = document.createElement("section");
      s.className = "topic"; s.id = id; s.setAttribute("aria-labelledby", id + "-h");
      var html = '<div class="topic-head"><span class="topic-num">' + num + '</span><h2 id="' + id + '-h">' + t.title + "</h2></div>" +
        '<p class="summary">' + t.summary + "</p><ul>" + t.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("") + "</ul>";
      (t.tables || []).forEach(function (tb) { html += tableHTML(tb); });
      if (t.formula) html += '<div class="formula" dir="ltr">' + esc(t.formula) + '</div>';
      if (t.widget === "linefit") html += lineFitHTML();
      t.cells.forEach(function (_, j) { html += '<div data-c="' + j + '"></div>'; });
      if (t.note) html += '<div class="callout note"><span class="tag">' + T("tNote") + '</span><div>' + t.note + "</div></div>";
      if (t.trap) html += '<div class="callout trap"><span class="tag">' + T("tTrap") + '</span><div>' + t.trap + "</div></div>";
      if (t.analyst) html += '<div class="callout note"><span class="tag">' + T("tThink") + '</span><div>' + t.analyst + "</div></div>";
      if (t.data) html += '<div class="callout data"><span class="tag">' + T("tData") + '</span><div>' + t.data + "</div></div>";
      html += '<div class="topic-foot"><button class="learn" type="button" aria-pressed="false" data-id="' + t.id + '">' + T("learn") + '</button></div>';
      s.innerHTML = html;
      topicsEl.appendChild(s);
      t.cells.forEach(function (c, j) { makeCell(s.querySelector('[data-c="' + j + '"]'), c); });
      if (t.widget === "linefit") initLineFit(s.querySelector(".linefit"));
      s.querySelector(".learn").addEventListener("click", function () { learned[t.id] = !learned[t.id]; store.set("dap-learned-w" + W.n, learned); paintLearned(); });
      tocHTML += '<li><a href="#' + id + '" data-id="' + t.id + '"><span class="n">' + num + "</span><span>" + t.title + '</span><span class="tick" aria-hidden="true"></span></a></li>';
    });
    tocHTML += '<li class="sep" aria-hidden="true"></li>';
    [["errors", T("hErrors"), "?!"], ["glossary", T("hGlossary"), "Aa"], ["quiz", T("hQuiz"), "✓"], ["practice", T("hPractice"), "Ex"], ["assignment", T("hAsg"), "Q"], ["next", W.next.title, LANG === "fa" ? "←" : "→"]].forEach(function (x) {
      tocHTML += '<li><a href="#' + P + x[0] + '"><span class="n">' + x[2] + "</span><span>" + x[1] + "</span><span></span></a></li>";
    });
    toc.innerHTML = tocHTML;
    document.querySelector(".progress").style.display = "";
    paintLearned();

    renderQuiz();
    var exBody = document.getElementById("exBody");
    W.exercises.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "ex";
      d.innerHTML = "<summary>" + N(i + 1) + ". " + esc(e.t) + '<span class="ex-level">' + e.lvl + "</span></summary>" +
        '<div class="ex-body"><p>' + e.task + "</p>" +
        '<button type="button" class="reveal" data-k="h">' + T("showHint") + '</button><button type="button" class="reveal" data-k="s">' + T("showSol") + '</button>' +
        '<p class="hint" hidden><b>' + T("hint") + '</b> ' + esc(e.hint) + '</p><div class="sol" hidden></div></div>';
      exBody.appendChild(d);
      var made = false;
      d.querySelectorAll(".reveal").forEach(function (b) {
        b.addEventListener("click", function () {
          var isHint = b.dataset.k === "h", el = d.querySelector(isHint ? ".hint" : ".sol");
          if (!isHint && !made) { makeCell(el.appendChild(document.createElement("div")), { code: e.sol, saved: e.saved, label: T("solution") }); made = true; }
          el.hidden = !el.hidden;
          b.textContent = isHint ? (el.hidden ? T("showHint") : T("hideHint")) : (el.hidden ? T("showSol") : T("hideSol"));
        });
      });
    });

    var asgDone = store.get("dap-asg-w" + W.n, {});
    var asgList = document.getElementById("asgList");
    W.assignment.forEach(function (text, i) {
      var li = document.createElement("li");
      li.innerHTML = '<label for="' + P + 'asg' + i + '"><input type="checkbox" id="' + P + 'asg' + i + '"' + (asgDone[i] ? " checked" : "") + '><span class="qn">Q' + (i + 1) + "</span><span>" + esc(text) + "</span></label>";
      asgList.appendChild(li);
      li.querySelector("input").addEventListener("change", function (ev) { asgDone[i] = ev.target.checked; store.set("dap-asg-w" + W.n, asgDone); });
    });
    document.getElementById("restart").addEventListener("click", restartKernel);
  }

  function paintLearned() {
    var n = 0;
    curWeek.topics.forEach(function (t) {
      var on = !!learned[t.id]; if (on) n++;
      var b = view.querySelector('.learn[data-id="' + t.id + '"]');
      if (b) { b.setAttribute("aria-pressed", on ? "true" : "false"); b.textContent = on ? T("learned") : T("learn"); }
      var a = toc.querySelector('a[data-id="' + t.id + '"]');
      if (a) a.classList.toggle("done", on);
      var o = view.querySelector('#overview a[data-id="' + t.id + '"]');
      if (o) o.classList.toggle("done", on);
    });
    document.getElementById("progText").textContent = frac(n, curWeek.topics.length);
    document.getElementById("progBar").style.width = (n / curWeek.topics.length * 100) + "%";
    document.getElementById("progLabel").textContent = T("progLabel")(curWeek.n);
  }

  var answers = {};
  function renderQuiz() {
    var qb = document.getElementById("quizBody");
    qb.innerHTML = "";
    answers = {};
    curWeek.quiz.forEach(function (item, i) {
      var d = document.createElement("div");
      d.className = "q";
      d.innerHTML = '<p class="qt">' + N(i + 1) + ". " + esc(item.q) + '</p><div class="opts">' +
        item.o.map(function (o, j) { return '<button type="button" class="opt" dir="auto" data-j="' + j + '">' + esc(o) + "</button>"; }).join("") + '</div><p class="why" hidden></p>';
      qb.appendChild(d);
      d.querySelectorAll(".opt").forEach(function (b) {
        b.addEventListener("click", function () {
          var j = +b.dataset.j;
          answers[i] = j === item.a;
          d.querySelectorAll(".opt").forEach(function (x) { x.disabled = true; if (+x.dataset.j === item.a) x.classList.add("right"); });
          if (j !== item.a) b.classList.add("wrong");
          var w = d.querySelector(".why");
          w.textContent = (j === item.a ? T("correct") : T("wrong")) + item.why;
          w.hidden = false;
          paintScore();
        });
      });
    });
    document.getElementById("quizReset").onclick = renderQuiz;
    paintScore();
  }
  function paintScore() {
    var total = curWeek.quiz.length, keys = Object.keys(answers), right = keys.filter(function (k) { return answers[k]; }).length;
    document.getElementById("scoreNum").textContent = N(right);
    var need = Math.ceil(total * 0.66), pct = Math.round(right / total * 100), msg = document.getElementById("scoreMsg");
    if (keys.length < total) msg.textContent = T("left")(total - keys.length, need);
    else msg.textContent = right >= need ? T("pass")(pct) : T("fail")(pct);
  }

  function renderPlaceholder(n) {
    cells = [];
    view.innerHTML = '<header class="hero placeholder"><p class="eyebrow">' + T("weekOf")(n) + '</p>' +
      "<h1>" + T("notAdded")(n) + "</h1>" +
      '<p class="lede">' + T("phLede") + "</p></header>" +
      '<section class="topic"><div class="topic-head"><span class="topic-num">' + T("kPlan") + '</span><h2>' + T("hPlan") + '</h2></div>' +
      '<p class="summary">' + T("planSum") + '</p><div class="plan">' +
      WEEKS.map(function (x) {
        var d = x.ready ? L(x.data) : null;
        return '<a href="#week-' + x.n + '" class="' + (x.ready ? "ready" : "locked") + '"><span class="wk">' + T("weekN")(String(x.n).padStart(2, "0")) + "</span><b>" + esc(d ? d.title : T("weekN")(x.n)) + '</b><span class="s">' + esc(d ? d.short : T("notYet")) + "</span></a>";
      }).join("") + "</div></section>";
    toc.innerHTML = WEEKS.filter(function (x) { return x.ready; }).map(function (x) { return '<li><a href="#week-' + x.n + '"><span class="n">' + pad(x.n) + '</span><span>' + esc(T("tocWeek")(x.n, L(x.data).title)) + '</span><span></span></a></li>'; }).join("");
    document.querySelector(".progress").style.display = "none";
  }

  var shownWeek = 0;
  function route() {
    var h = location.hash.replace(/^#/, ""), week = 1, target = null, m;
    if ((m = h.match(/^week-(\d+)$/))) week = Math.min(12, Math.max(1, +m[1]));
    else if ((m = h.match(/^w(\d+)-[a-z0-9-]+$/))) { week = +m[1]; target = h; }
    if (week !== shownWeek) {
      shownWeek = week;
      renderWeeksNav(week);
      if (WEEKS[week - 1].ready) renderWeek(L(WEEKS[week - 1].data)); else renderPlaceholder(week);
      if (!target) window.scrollTo(0, 0);
    }
    if (target) { var el = document.getElementById(target); if (el) el.scrollIntoView(); }
  }

  document.querySelectorAll("#langSwitch button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.l === LANG) return;
      var y = window.scrollY;
      LANG = b.dataset.l; store.set("dap-lang", LANG);
      applyLang();
      shownWeek = 0;
      var h = location.hash;
      if (/^#w\d+-/.test(h)) { route(); } else { route(); window.scrollTo(0, y); }
    });
  });
  applyLang();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
