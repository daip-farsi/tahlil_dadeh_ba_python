<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Analytics in Python | تحلیل داده با پایتون</title>
<meta name="description" content="A 12-week study site for Data Analytics in Python: lecture notes, live Python cells, quizzes and practice exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a 12-week course notebook. Left rail = course brand, week picker and this week's topics.
   Right = the week's lesson as notebook cells that run real Python in the browser, sharing one kernel.
   Python blue is the ink, Python yellow is the highlighter. */
:root {
  --paper: #F3F5F8; --surface: #FFFFFF; --ink: #142033; --muted: #5A6577; --line: #DCE2EA;
  --blue: #2F6BB0; --yellow: #FFD43B; --yellow-soft: #FFF4C4; --code-bg: #F7F9FC; --out-bg: #FBFCFE;
  --good: #1E8A55; --bad: #C2402F; --bad-soft: #FDEDEA; --good-soft: #E7F6EE;
  --k: #8E44AD; --s: #1E8A55; --n: #C26A00; --shadow: 0 1px 2px rgba(20,32,51,.05), 0 4px 16px rgba(20,32,51,.04);
  --display: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fa: "Vazirmatn", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1622; --surface: #161F2E; --ink: #E6ECF4; --muted: #96A2B4; --line: #26324A;
    --blue: #7FB0EA; --yellow-soft: #3A3315; --code-bg: #111A28; --out-bg: #131D2C;
    --good: #5FCB94; --bad: #FF8A78; --bad-soft: #3A1E1B; --good-soft: #15301F;
    --k: #C99BF0; --s: #8FD9A8; --n: #F2B36B; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1622; --surface: #161F2E; --ink: #E6ECF4; --muted: #96A2B4; --line: #26324A;
  --blue: #7FB0EA; --yellow-soft: #3A3315; --code-bg: #111A28; --out-bg: #131D2C;
  --good: #5FCB94; --bad: #FF8A78; --bad-soft: #3A1E1B; --good-soft: #15301F;
  --k: #C99BF0; --s: #8FD9A8; --n: #F2B36B; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
code, pre, textarea { font-family: var(--mono); }
:not(pre) > code { font-size: .88em; background: var(--code-bg); border: 1px solid var(--line); padding: .05em .35em; border-radius: 4px; }
[lang="fa"] { font-family: var(--fa); }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 44px; max-width: 1220px; margin: 0 auto; padding: 0 28px; }

/* Rail */
.rail { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 26px 4px 24px 0; }
.brandrow { display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); }
.logo { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 700 .95rem var(--mono); position: relative; overflow: hidden; }
.logo::after { content: ""; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; background: var(--yellow); border-top-left-radius: 6px; }
.brand { font: 700 1.02rem/1.2 var(--display); letter-spacing: -.01em; margin: 0; display: block; }
.brand span, .brand-fa span { color: var(--blue); }
.brand-fa { font: 600 .95rem/1.5 var(--fa); margin: 0; isolation: isolate; text-align: left; color: var(--muted); }
.brand-fa span { position: relative; }
.brand-fa span::after { content: none; }
.brand-sub { color: var(--muted); font-size: .8rem; margin: 14px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.rail h3 { font: 600 .72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.weeks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.weeks a { display: grid; place-items: center; height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 .8rem var(--mono); text-decoration: none; font-variant-numeric: tabular-nums; }
.weeks a.ready { color: var(--ink); border-color: var(--blue); }
.weeks a.current { background: var(--blue); border-color: var(--blue); color: #fff; }
.weeks a.locked { border-style: dashed; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 14px; }
.progress-top { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 7px; background: var(--line); border-radius: 99px; margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .4s ease; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc a { display: grid; grid-template-columns: 26px 1fr 14px; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .88rem; line-height: 1.35; }
.toc a:hover { background: var(--surface); }
.toc .n { font: 500 .72rem var(--mono); color: var(--muted); }
.toc .tick { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
.toc a.done .tick { background: var(--good); border-color: var(--good); }
.toc .sep { height: 1px; background: var(--line); margin: 6px 0; }

/* Main */
main { padding: 26px 0 80px; min-width: 0; }
.hero { padding: 18px 0 8px; }
.hero h1 { font: 700 clamp(1.9rem, 3.6vw, 2.6rem)/1.15 var(--display); letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
.week-sub { color: var(--muted); font-size: 1.02rem; margin: 0 0 18px; max-width: 64ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0 0 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font: 700 1.5rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.stat.accent { border-color: transparent; background: var(--ink); color: var(--paper); }
.stat.accent span { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 4px 0 20px; }
.overview a { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); text-decoration: none; font-size: .9rem; line-height: 1.35; }
.overview a:hover { border-color: var(--blue); }
.overview a .n { font: 600 .74rem var(--mono); color: var(--blue); }
.overview a.done { border-color: var(--good); }
.overview a.done .n { color: var(--good); }
.overview-h { font: 600 .75rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 8px; }
.eyebrow { font: 500 .78rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }

.hl { position: relative; white-space: nowrap; isolation: isolate; }
.hl::after { content: ""; position: absolute; left: -2%; right: -2%; bottom: .06em; height: .28em; background: var(--yellow); z-index: -1; border-radius: 3px; transform-origin: left; animation: swipe .9s .2s cubic-bezier(.6,.1,.2,1) both; }
@keyframes swipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 64ch; margin: 0 0 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { font: 500 .78rem var(--mono); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.chip.hot { background: var(--yellow-soft); border-color: transparent; color: var(--ink); }

.kernelbar { position: sticky; top: 8px; z-index: 4; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin: 6px 0 4px; font-size: .86rem; }
.kstat { display: inline-flex; align-items: center; gap: 8px; font: 500 .8rem var(--mono); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.kstat[data-s="loading"] .dot { background: var(--yellow); animation: pulse 1s infinite alternate; }
.kstat[data-s="ready"] .dot { background: var(--good); }
.kstat[data-s="busy"] .dot { background: var(--blue); animation: pulse .5s infinite alternate; }
.kstat[data-s="failed"] .dot { background: var(--bad); }
@keyframes pulse { to { opacity: .35; } }
.khelp { color: var(--muted); flex: 1 1 260px; }
.kbtn { font: 600 .8rem var(--body); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
.kbtn:hover { border-color: var(--ink); }

/* Cells */
.cell { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 0 10px; margin: 14px 0; }
.cell-label { grid-column: 2; font: 500 .72rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.prompt { font: 500 .78rem/1 var(--mono); color: var(--blue); text-align: right; padding-top: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.prompt.outp { color: var(--bad); }
.code { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.code:focus-within { border-color: var(--blue); }
.editor { position: relative; }
.editor pre, .editor textarea { margin: 0; padding: 12px 92px 12px 14px; font: .87rem/1.6 var(--mono); white-space: pre; tab-size: 4; letter-spacing: 0; word-spacing: 0; border: 0; }
.editor pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.editor textarea { position: relative; display: block; width: 100%; resize: none; overflow-x: auto; overflow-y: hidden; background: transparent; color: transparent; caret-color: var(--ink); outline: none; }
.editor textarea::selection { background: rgba(47,107,176,.25); }
.cell-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2; }
.run { display: inline-flex; align-items: center; gap: 6px; font: 600 .78rem var(--body); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
.run:hover { border-color: var(--blue); color: var(--blue); }
.run svg { width: 9px; height: 9px; fill: currentColor; }
.reset { font: 500 .74rem var(--body); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 5px 4px; text-decoration: underline; }
.reset[hidden] { display: none; }
.out-row { display: contents; }
.out-row[hidden] { display: none; }
.output { grid-column: 2; background: var(--out-bg); border: 1px dashed var(--line); border-radius: 10px; margin-top: 6px; padding: 9px 14px; font: .85rem/1.55 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.output .err { color: var(--bad); display: block; }
.output .empty, .output .note { color: var(--muted); font-style: italic; font-family: var(--body); font-size: .82rem; }
.output span { display: block; }
.output img { display: block; max-width: 100%; height: auto; margin: 8px 0 2px; background: #fff; border-radius: 6px; }
.output .df { overflow-x: auto; margin: 2px 0; }
.output .df table { border-collapse: collapse; font: .8rem/1.4 var(--mono); }
.output .df table, .output .df th, .output .df td { border: 0; }
.output .df th, .output .df td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.output .df thead th { background: var(--paper); font-weight: 600; }
.output .df tbody th { text-align: left; font-weight: 600; }
.formula { font: 1rem/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 14px 0; text-align: center; overflow-x: auto; }
.tok-k { color: var(--k); } .tok-s { color: var(--s); } .tok-c { color: var(--muted); font-style: italic; } .tok-n { color: var(--n); } .tok-f { color: var(--blue); }

/* Sections */
section.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px 22px; margin: 18px 0; scroll-margin-top: 70px; box-shadow: var(--shadow); }
.topic-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.topic-num { font: 600 .72rem var(--mono); color: var(--blue); white-space: nowrap; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; text-transform: uppercase; letter-spacing: .04em; }
section h2 { font: 600 1.32rem/1.25 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.summary { font-size: 1.02rem; margin: 12px 0 10px; max-width: 68ch; font-weight: 500; }
section ul { padding-left: 1.2em; margin: 8px 0; max-width: 70ch; }
section li { margin: 4px 0; }
.tbl { overflow-x: auto; margin: 14px 0; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl caption { text-align: left; font: 600 .78rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-bottom: 6px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-weight: 600; background: var(--paper); }
.tbl td:first-child { white-space: nowrap; }
.callout { display: grid; grid-template-columns: 1fr; gap: 3px; border-radius: 0 8px 8px 0; padding: 11px 14px; margin: 14px 0 6px; font-size: .93rem; border-left: 3px solid; }
.callout .tag { font: 600 .7rem var(--mono); text-transform: uppercase; letter-spacing: .08em; }
.callout.trap { background: var(--bad-soft); border-color: var(--bad); } .callout.trap .tag { color: var(--bad); }
.callout.data { background: var(--yellow-soft); border-color: #E0B100; } .callout.data .tag { color: var(--ink); }
.callout.note { background: var(--paper); border-color: var(--blue); } .callout.note .tag { color: var(--blue); }
.topic-foot { display: flex; justify-content: flex-end; margin-top: 14px; }
.learn { font: 600 .85rem var(--body); border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 99px; padding: 7px 14px; cursor: pointer; }
.learn:hover { border-color: var(--good); }
.learn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }

/* Quiz */
.q { border-top: 1px solid var(--line); padding: 16px 0 6px; }
.q:first-child { border-top: 0; }
.q p.qt { margin: 0 0 10px; font-weight: 600; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.opt { text-align: left; font: .92rem var(--body); background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.why { font-size: .9rem; color: var(--muted); margin: 8px 0 4px; }
.score { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--paper); border-radius: 12px; padding: 12px 16px; margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
.score strong { font: 800 1.6rem var(--display); }
.btn { font: 600 .85rem var(--body); background: var(--ink); color: var(--paper); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }

details.ex { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 10px 0; background: var(--paper); }
details.ex summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "+"; font: 600 1rem var(--mono); color: var(--blue); width: 1ch; }
details.ex[open] summary::before { content: "\2212"; }
.ex-level { margin-left: auto; font: 500 .72rem var(--mono); color: var(--muted); white-space: nowrap; }
.ex-body { padding: 6px 0 4px 22px; }
.ex-body .cell { grid-template-columns: minmax(0,1fr); gap: 0; }
.ex-body .cell-label, .ex-body .output { grid-column: 1; }
.ex-body .prompt { display: none; }
.reveal { font: 600 .8rem var(--body); background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 5px 10px; cursor: pointer; margin-right: 6px; }

.checklist { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; max-width: none; }
.checklist label { display: grid; grid-template-columns: 22px 44px 1fr; gap: 6px; align-items: baseline; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.checklist label:hover { background: var(--paper); }
.checklist input { accent-color: var(--good); width: 16px; height: 16px; }
.checklist .qn { font: 600 .8rem var(--mono); color: var(--blue); }
.checklist input:checked ~ span:last-child { color: var(--muted); text-decoration: line-through; }

.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.plan a { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); color: var(--ink); text-decoration: none; min-height: 92px; }
.plan a.ready { border-color: var(--blue); background: var(--surface); }
.plan a.locked { border-style: dashed; color: var(--muted); }
.plan b { font: 700 .95rem var(--display); display: block; margin: 2px 0 4px; color: var(--ink); }
.plan .wk { font: 500 .72rem var(--mono); color: var(--blue); }
.plan span.s { font-size: .82rem; }
.placeholder { text-align: left; }
footer { color: var(--muted); font-size: .85rem; margin-top: 28px; }


/* Language switch + right-to-left (Farsi) */
.lang { display: inline-flex; margin: 14px 0 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { font: 600 .8rem var(--body); padding: 6px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[lang="fa"] { font-family: var(--fa); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
code, .formula { unicode-bidi: isolate; }
html[lang="fa"] { --body: "Vazirmatn", Tahoma, sans-serif; --display: "Vazirmatn", Tahoma, sans-serif; }
html[lang="fa"] body { line-height: 1.85; }
html[lang="fa"] .eyebrow, html[lang="fa"] .rail h3, html[lang="fa"] .overview-h, html[lang="fa"] .cell-label,
html[lang="fa"] .tbl caption, html[lang="fa"] .topic-num, html[lang="fa"] .callout .tag, html[lang="fa"] .plan .wk,
html[lang="fa"] .ex-level, html[lang="fa"] .kstat, html[lang="fa"] .toc .n, html[lang="fa"] .overview a .n { letter-spacing: 0; text-transform: none; font-family: var(--fa); }
html[dir="rtl"] .brand-sub, html[dir="rtl"] .brandrow { text-align: right; }
html[dir="rtl"] .code, html[dir="rtl"] .output, html[dir="rtl"] .formula { direction: ltr; text-align: left; }
html[dir="rtl"] .prompt { text-align: left; direction: ltr; }
html[dir="rtl"] code, html[dir="rtl"] .qn { direction: ltr; unicode-bidi: isolate; }
html[dir="rtl"] .callout { border-left: 0; border-right: 3px solid; border-radius: 8px 0 0 8px; }
html[dir="rtl"] .callout.trap { border-color: var(--bad); } html[dir="rtl"] .callout.data { border-color: #E0B100; } html[dir="rtl"] .callout.note { border-color: var(--blue); }
html[dir="rtl"] .tbl th, html[dir="rtl"] .tbl td, html[dir="rtl"] .tbl caption { text-align: right; }
html[dir="rtl"] section ul { padding-left: 0; padding-right: 1.2em; }
html[dir="rtl"] .ex-level { margin-left: 0; margin-right: auto; }
html[dir="rtl"] .ex-body { padding: 6px 22px 4px 0; }
html[dir="rtl"] .reveal { margin-right: 0; margin-left: 6px; }
html[dir="rtl"] .opt { text-align: right; }
html[dir="rtl"] .rail { padding: 26px 0 24px 4px; }

@media (max-width: 880px) {
  .shell { grid-template-columns: 1fr; gap: 0; padding: 0 16px; }
  .rail { position: static; height: auto; padding: 16px 0 6px; }
  .toc, .rail .toc-h, .progress { display: none; }
  .weeks { grid-template-columns: repeat(12, minmax(32px, 1fr)); overflow-x: auto; }
  section.topic { padding: 20px 16px; }
  .cell { grid-template-columns: 1fr; }
  .cell-label, .output { grid-column: 1; }
  .prompt { text-align: left; padding: 0 0 4px; }
  .prompt.outp { padding-top: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

lecture", "code": "print(list(range(5)))\nprint(list(range(2, 10)))\nprint(list(range(0, 20, 5)))\nprint(list(range(10, 0, -3)))", "saved": {"stdout": "[0, 1, 2, 3, 4]\n[2, 3, 4, 5, 6, 7, 8, 9]\n[0, 5, 10, 15]\n[10, 7, 4, 1]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Index vs slice", "code": "r = range(10)\nprint(r[5])\nprint(r[3:5])\nprint(list(r[3:5]))\nprint(list(r[2:8:2]))", "saved": {"stdout": "5\nrange(3, 5)\n[3, 4]\n[2, 4, 6]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "daily_sales = [120, 95, 210, 180, 160, 75, 230]\nprint(daily_sales[:3])   # first three days\nprint(daily_sales[-2:])  # last two days\nprint(daily_sales[::2])  # every other day", "saved": {"stdout": "[120, 95, 210]\n[75, 230]\n[120, 210, 160, 230]\n", "value": null, "error": null, "images": [], "html": null}}], "note": "The notebook says <code>range(10)[3:5]<\/code> gives the items in positions 3 and 5. Because <code>stop<\/code> is excluded, it's really positions <b>3 and 4<\/b>, as the second cell shows.", "data": "Slicing is how you take the first rows of a dataset, the last week of a time series, or every n-th sample."}, {"id": "enumerate", "title": "Enumerate", "summary": "enumerate() gives you each element together with its position, as (index, element) pairs.", "bullets": ["In a <code>for<\/code> loop, bind two names at once: <code>for idx, el in enumerate(items):<\/code>.", "Wrap it in <code>list()<\/code> to see all the pairs.", "<code>enumerate(items, start=1)<\/code> counts from 1, which reads better in reports."], "cells": [{"label": "From the lecture", "code": "print(list(enumerate(range(3, 10, 2))))\nfor idx, el in enumerate(range(3, 10, 2)):\n    print('number', el, 'in position', idx)", "saved": {"stdout": "[(0, 3), (1, 5), (2, 7), (3, 9)]\nnumber 3 in position 0\nnumber 5 in position 1\nnumber 7 in position 2\nnumber 9 in position 3\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "products = [\"apple\", \"bread\", \"milk\"]\nfor rank, name in enumerate(products, start=1):\n    print(rank, name)", "saved": {"stdout": "1 apple\n2 bread\n3 milk\n", "value": null, "error": null, "images": [], "html": null}}]}, {"id": "zip", "title": "Zipping", "summary": "zip() walks through several lists at the same time and gives you tuples with one element from each.", "bullets": ["It works like <code>enumerate()<\/code>, but the pairs come from your own lists instead of a counter.", "This becomes very useful later, so take the time to understand it now.", "The lecture asks you to think about lists of <b>different lengths<\/b>. Edit the cell below to make one list shorter and see for yourself what <code>zip()<\/code> does."], "cells": [{"label": "Data example", "code": "products = [\"apple\", \"bread\", \"milk\"]\nprices = [0.5, 2.8, 1.6]\nfor name, price in zip(products, prices):\n    print(f\"{name}: {price:.2f} CHF\")\nprint(list(zip(products, prices)))", "saved": {"stdout": "apple: 0.50 CHF\nbread: 2.80 CHF\nmilk: 1.60 CHF\n[('apple', 0.5), ('bread', 2.8), ('milk', 1.6)]\n", "value": null, "error": null, "images": [], "html": null}}], "data": "<code>dict(zip(products, prices))<\/code> turns two matching columns into a lookup table in one line."}, {"id": "splat", "title": "Splat", "summary": "The splat * in an assignment means: this name takes the rest of the elements.", "bullets": ["It only works with iterables: lists, tuples, ranges and argument lists.", "You can have normal names before and after the splat, but only <b>one<\/b> splat per assignment.", "The splatted name always gets a list, even if it's empty."], "cells": [{"label": "From the lecture", "code": "a = list(range(3))\nb, *c = a\nprint('b', b, '- c', c)", "saved": {"stdout": "b 0 - c [1, 2]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "daily_sales = [120, 95, 210, 180, 160]\n*earlier, today = daily_sales\nprint('today:', today)\nprint('before:', earlier)", "saved": {"stdout": "today: 160\nbefore: [120, 95, 210, 180]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Only one splat allowed", "code": "a, *b, *c = [1, 2, 3, 4]", "saved": {"stdout": "", "value": null, "error": "SyntaxError: multiple starred expressions in assignment (line 1)", "images": [], "html": null}}]}, {"id": "args", "title": "Default values, named arguments and *args", "summary": "Arguments can have defaults, can be passed by name, and a splat can collect any number of them.", "bullets": ["An argument with a default is <i>optional<\/i>. One without a default is <i>mandatory<\/i>, and leaving it out raises an error.", "With many arguments, or a mix of optional and mandatory ones, pass them <b>by name<\/b>: it's clearer and order no longer matters.", "<code>def my_fn(x, *y):<\/code> collects every extra positional argument into <code>y<\/code>.", "The splat also works the other way round: <code>my_fn(*args)<\/code> spreads a list out into separate arguments."], "cells": [{"label": "Defaults and names", "code": "def my_fn(x, y=5):\n    print(x, y)\n\nmy_fn(2, 3)\nmy_fn(2)\nmy_fn(y=2, x=3)\nmy_fn(x=3)\nmy_fn(y=3)", "saved": {"stdout": "2 3\n2 5\n3 2\n3 5\n", "value": null, "error": "TypeError: my_fn() missing 1 required positional argument: 'x'", "images": [], "html": null}}, {"label": "Collecting arguments", "code": "def my_fn(x, *y):\n    print(x, y)\n\nmy_fn(2)\nmy_fn(2, 3)\nmy_fn(2, 3, 4, 5)", "saved": {"stdout": "2 ()\n2 (3,)\n2 (3, 4, 5)\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Spreading a list", "code": "def my_fn(a, b, c):\n    print(a, b, c)\n\nargs = [1, 2, 3]\nmy_fn(*args)\nmy_fn(args)", "saved": {"stdout": "1 2 3\n", "value": null, "error": "TypeError: my_fn() missing 2 required positional arguments: 'b' and 'c'", "images": [], "html": null}}], "trap": "<code>*y<\/code> collects a <b>tuple<\/b>, not a list. The notebook's comments show <code>[3, 4, 5]<\/code>, but Python prints <code>(3, 4, 5)<\/code>, as the second cell shows. Convert with <code>list(y)<\/code> when you need a list.", "analyst": "From here the questions ask you to <b>think<\/b>. A data analyst first understands the task (often complex and badly explained), then designs a solution, and only then writes the code. The exam is almost entirely questions like this, so build that habit week by week."}, {"id": "kwargs", "title": "Keyword arguments and double splat", "summary": "Arguments passed by position form a tuple. Arguments passed by name form a dictionary, collected with the double splat **.", "bullets": ["Named arguments are called <i>keyword arguments<\/i>, because the argument's name is used as the key.", "<code>def my_fn(*args, **kwargs):<\/code> accepts anything: <code>args<\/code> gets the unnamed ones, <code>kwargs<\/code> the named ones.", "<code>print(*args)<\/code> spreads the tuple out. <code>print(**kwargs)<\/code> only works if <code>print()<\/code> has arguments with those names.", "A dictionary of settings plus <code>**<\/code> is a readable way to configure a complex function. Here are the <a href=\"https://docs.python.org/3/library/functions.html#print\">options print() accepts<\/a>."], "cells": [{"label": "From the lecture", "code": "def my_fn(*args, **kwargs):\n    print(args)\n    print(*args)\n    print(kwargs)\n    print(**kwargs)\n\nmy_fn(1, 2, 3, x=4, y=5)", "saved": {"stdout": "(1, 2, 3)\n1 2 3\n{'x': 4, 'y': 5}\n", "value": null, "error": "TypeError: print() got an unexpected keyword argument 'x'", "images": [], "html": null}}, {"label": "Settings as a dict", "code": "conf = {\n    'sep': '; ',\n    'end': \"\\nThat's all!\\n\"\n}\nprint('one', 'two', 'three', **conf)", "saved": {"stdout": "one; two; three\nThat's all!\n", "value": null, "error": null, "images": [], "html": null}}], "data": "Later, plotting and data libraries take dozens of options. Keeping them in a dict and passing <code>**settings<\/code> makes analysis code much easier to read."}, {"id": "imports", "title": "Importing modules", "summary": "Modules (Python's word for libraries) are loaded with import. Many come with Python, others you install first.", "bullets": ["Install extra modules with <code>pipenv<\/code> (or <code>pip<\/code>), then load them with <code>import<\/code>.", "<code>import math<\/code> loads the whole module, and you use <code>math.factorial()<\/code>.", "<code>from math import factorial<\/code> loads just one name.", "<code>as<\/code> gives a shorter handle. The classic example is <code>import matplotlib.pyplot as plt<\/code>, which you'll use for charts.", "<code>from math import *<\/code> dumps everything into your namespace. It's bad practice: avoid it."], "cells": [{"label": "Three ways to import", "code": "import math\nprint(math.factorial(3))\n\nfrom math import factorial\nprint(factorial(3))\n\nimport statistics as st\nprint(st.mean([120, 95, 210, 180]))", "saved": {"stdout": "6\n6\n151.25\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "<code>from module import *<\/code> can silently overwrite names you already have, just like <code>sum = 0<\/code> did in Week 1. Always import what you need, or use <code>as<\/code>."}, {"id": "comprehensions", "title": "Comprehensions", "summary": "A comprehension builds a list or dict by describing its content in one line.", "bullets": ["List: <code>[expression for item in iterable]<\/code>.", "Dict: <code>{key: value for item in iterable}<\/code>. Note the colon between key and value.", "You can add <code>if<\/code> to keep only some items. The lecture covers this properly later."], "cells": [{"label": "From the lecture", "code": "lst = [f\"The square of {i} is {i**2}\" for i in range(2, 10, 2)]\nprint(*lst, sep='\\n', end='\\n[done]\\n')", "saved": {"stdout": "The square of 2 is 4\nThe square of 4 is 16\nThe square of 6 is 36\nThe square of 8 is 64\n[done]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Dict comprehension", "code": "print({i: i**2 for i in range(2, 11, 2)})", "saved": {"stdout": "{2: 4, 4: 16, 6: 36, 8: 64, 10: 100}\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "prices = [0.5, 2.8, 1.6]\nwith_vat = [round(p * 1.081, 2) for p in prices]\nprint(with_vat)\nprint([p for p in prices if p > 1])", "saved": {"stdout": "[0.54, 3.03, 1.73]\n[2.8, 1.6]\n", "value": null, "error": null, "images": [], "html": null}}], "note": "For Q8, follow the lecture's tip: first write a small example of the output, neatly laid out, then design the function."}, {"id": "underscores", "title": "Underscores", "summary": "The underscore _ is a normal character in names, but Python has conventions for it.", "bullets": ["A name starting with <code>_<\/code> is \"private\": not meant for users to call.", "Names with double underscores on both sides, like <code>__init__<\/code>, are special names reserved by Python.", "A lone <code>_<\/code> means \"I won't use this value\": <code>for _ in range(5):<\/code>."], "cells": [{"label": "Examples", "code": "for _ in range(3):\n    print('ALARM!')\n\nprint(len(\"abc\"), \"abc\".__len__())", "saved": {"stdout": "ALARM!\nALARM!\nALARM!\n3 3\n", "value": null, "error": null, "images": [], "html": null}}], "note": "<code>len(x)<\/code> actually calls the special method <code>x.__len__()<\/code>. Special names like this are how Python's built-ins work with your own classes."}, {"id": "lambdas", "title": "Lambdas", "summary": "A lambda is an unnamed one-line function that you can pass around like any other value.", "bullets": ["<code>lambda a, b: a + b<\/code> is the same as a <code>def<\/code> that returns <code>a + b<\/code>.", "Only use it for one expression. Anything with several steps belongs in a normal <code>def<\/code>.", "Lambdas shine when a function takes another function as input, such as <code>sorted(..., key=...)<\/code> or <code>map()<\/code>.", "The name comes from the Greek letter λ and lambda calculus. You don't need to know more than that."], "cells": [{"label": "From the lecture", "code": "def my_fn(a, b):\n    print(a, b)\n\nmy_fn_lambda = lambda a, b: print(a, b)\nmy_fn(1, 2)\nmy_fn_lambda(1, 2)", "saved": {"stdout": "1 2\n1 2\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example: sort by price", "code": "products = [(\"apple\", 0.5), (\"bread\", 2.8), (\"milk\", 1.6)]\nprint(sorted(products, key=lambda item: item[1], reverse=True))", "saved": {"stdout": "[('bread', 2.8), ('milk', 1.6), ('apple', 0.5)]\n", "value": null, "error": null, "images": [], "html": null}}], "data": "You'll pass small lambdas to data tools all the time: to sort, to transform a column, or to pick rows."}, {"id": "map", "title": "Mapping", "summary": "map() applies one function to every element of an iterable.", "bullets": ["<code>map()<\/code> returns a <i>map object<\/i>, not a list. It's lazy: it only computes values when you ask for them.", "Wrap it in <code>list()<\/code> to see the results.", "The function can be a lambda, a built-in like <code>float<\/code>, or any function you defined with <code>def<\/code>.", "Mapping, filtering and reducing together are very powerful for processing data. <a href=\"https://realpython.com/python-map-function/\">Real Python's guide to map()<\/a> goes further."], "cells": [{"label": "From the lecture", "code": "list(map(lambda x: x**2, range(2, 9, 2)))", "saved": {"stdout": "", "value": "[4, 16, 36, 64]", "error": null, "images": [], "html": null}}, {"label": "It's lazy", "code": "m = map(lambda x: x**2, range(3))\nprint(type(m))\nprint(list(m))\nprint(list(m))", "saved": {"stdout": "<class 'map'>\n[0, 1, 4]\n[]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "prices_text = [\"0.5\", \"2.8\", \"1.6\"]\nprices = list(map(float, prices_text))\nprint(prices)\nprint(list(filter(lambda p: p > 1, prices)))", "saved": {"stdout": "[0.5, 2.8, 1.6]\n[2.8, 1.6]\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "A map object can only be used once. The second <code>list(m)<\/code> in the middle cell is empty, because the values were already consumed.", "note": "For Q9, the lecture's tip helps: <code>dict()<\/code> can build a dictionary from a list of (key, value) pairs."}, {"id": "classes", "title": "Basic classes and object-oriented programming", "summary": "A class bundles data and the functions that work on it. Each object you create from it is an instance.", "bullets": ["Class names use TitleCase: <code>SalesLog<\/code>, <code>Square<\/code>.", "Every instance method takes <code>self<\/code> first. It refers to the object the method is called on.", "<code>__init__()<\/code> runs when you create an instance with <code>ClassName(...)<\/code> and sets up its data.", "<code>self.length = length<\/code> stores the argument on the object, so other methods can use it later."], "cells": [{"label": "From the lecture", "code": "class Square:\n    def __init__(self, length):\n        self.length = length\n\n    def area(self):\n        return self.length**2\n\nmy_square = Square(length=2)\nprint(my_square.area())", "saved": {"stdout": "4\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "class SalesLog:\n    def __init__(self, store, sales):\n        self.store = store\n        self.sales = sales\n\n    def total(self):\n        return sum(self.sales)\n\n    def average(self):\n        return self.total() / len(self.sales)\n\nzurich = SalesLog(\"Zurich\", [120, 95, 210, 180])\nprint(zurich.store, zurich.total(), zurich.average())", "saved": {"stdout": "Zurich 605 151.25\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "Forgetting <code>self<\/code> is the classic mistake. Writing <code>length<\/code> instead of <code>self.length<\/code> inside a method gives <code>NameError: name 'length' is not defined<\/code>."}, {"id": "inheritance", "title": "Basic inheritance", "summary": "A subclass inherits everything from its parent class and can replace (override) any method.", "bullets": ["<code>class Cube(Square):<\/code> makes <code>Square<\/code> the parent of <code>Cube<\/code>.", "When you call a method, Python looks in the object's own class first, then in each parent in order. <code>__init__()<\/code> is found the same way.", "A class can have several parents, listed in the brackets.", "<code>isinstance(obj, Parent)<\/code> is <code>True<\/code> for instances of subclasses too."], "cells": [{"label": "From the lecture", "code": "class Square:\n    def __init__(self, length):\n        self.length = length\n\n    def area(self):\n        return self.length**2\n\nclass Cube(Square):\n    def area(self):\n        return self.length**3\n\nmy_cube = Cube(length=2)\nprint(my_cube.area())\nprint(isinstance(my_cube, Square))", "saved": {"stdout": "8\nTrue\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "Inheritance means \"is a\": every subclass instance <b>is a<\/b> parent instance. A cube is not a kind of square, so this design is wrong even though it runs, and Q10 asks you to fix it. Ask yourself: is every child truly a kind of parent?"}, {"id": "exceptions", "title": "Interrupts, exceptions and errors", "summary": "When something goes wrong, Python raises an exception. You can catch specific ones with try / except, or raise your own.", "bullets": ["Errors are your best friends: you want code to fail loudly. The dangerous case is code that runs fine but gives wrong output.", "An error creates an exception object with information about the problem, and execution jumps to an exception handler. With no handler, the program stops and prints the message.", "<code>try: ... except ZeroDivisionError as e:<\/code> catches one specific type of error.", "<code>raise ValueError('message')<\/code> throws an exception yourself.", "<b>Never<\/b> use a bare <code>except:<\/code> with no error type. It catches everything and hides the real cause."], "cells": [{"label": "An unhandled error", "code": "print(8/0)", "saved": {"stdout": "", "value": null, "error": "ZeroDivisionError: division by zero", "images": [], "html": null}}, {"label": "Catching it", "code": "try:\n    print(8/0)\nexcept ZeroDivisionError as e:\n    print(\"Oops, division by zero:\", e)\n    print(type(e).__name__)", "saved": {"stdout": "Oops, division by zero: division by zero\nZeroDivisionError\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example: messy values", "code": "raw = [\"12\", \"n/a\", \"7\", \"\"]\nclean = []\nfor value in raw:\n    try:\n        clean.append(int(value))\n    except ValueError:\n        print(\"skipping\", repr(value))\nprint(clean, sum(clean))", "saved": {"stdout": "skipping 'n/a'\nskipping ''\n[12, 7] 19\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Raising your own", "code": "def check_price(p):\n    if p < 0:\n        raise ValueError(f\"price can't be negative: {p}\")\n    return p\n\nprint(check_price(2.8))\ncheck_price(-1)", "saved": {"stdout": "2.8\n", "value": null, "error": "ValueError: price can't be negative: -1", "images": [], "html": null}}], "analyst": "<b>Red, green, refactor.<\/b> First write a small test of what you need, which fails (red). Then write code that works, even if it isn't pretty (green). Then, as soon as you have time, rewrite it to be clearer or faster (refactor). The lecture is serious about the last step: at the exam you can reuse old exercises, but only clean code is quick to adapt."}], "errors": [["ZeroDivisionError", "division by zero", "You divided by 0. Check the value first, or catch the error with try / except."], ["TypeError", "my_fn() missing 1 required positional argument: 'x'", "A mandatory argument wasn't given."], ["TypeError", "my_fn() got an unexpected keyword argument 'z'", "You passed a name the function doesn't have. Check the spelling."], ["TypeError", "print() got an unexpected keyword argument 'x'", "You double-splatted a dict with keys the function doesn't accept. Older Python versions word it as 'x' is an invalid keyword argument for print()."], ["SyntaxError", "multiple starred expressions in assignment", "Only one * is allowed on the left of an assignment."], ["NameError", "name 'length' is not defined", "Inside a method you probably forgot self., as in self.length."], ["AttributeError", "'Square' object has no attribute 'lenght'", "A typo in an attribute name, or it was never set in __init__."], ["ModuleNotFoundError", "No module named 'pandas'", "The module isn't installed. Install it with pipenv or pip first."], ["ValueError", "invalid literal for int() with base 10: 'n/a'", "The text can't be turned into a number. Clean it or catch the error."]], "glossary": [["start, stop, step", "The three arguments of range() and of slices. stop is excluded."], ["Slice", "Part of a sequence, written seq[start:stop:step]."], ["enumerate()", "Pairs each element with its position: (index, element)."], ["zip()", "Walks through several iterables together, one element from each."], ["Splat (*)", "Takes the rest of the elements, or spreads a list out into arguments."], ["Optional argument", "An argument with a default value."], ["Keyword argument", "An argument passed by name, like y=2."], ["*args / **kwargs", "Collect extra positional arguments (a tuple) and keyword arguments (a dict)."], ["Module", "Python's word for a library, loaded with import."], ["Comprehension", "A one-line way to build a list or dict from an iterable."], ["Lambda", "An unnamed one-line function."], ["map()", "Applies a function to every element. Returns a lazy map object."], ["Lazy evaluation", "Values are only computed when you ask for them."], ["Class / instance", "A blueprint, and an object made from it."], ["self", "The instance a method is working on."], ["__init__()", "The method that sets up a new instance."], ["Inheritance", "A subclass reusing and overriding a parent class's code."], ["Exception", "An object Python creates when an error happens."], ["Refactor", "Rewrite working code so it's clearer or faster."]], "fa": {"title": "دوره‌ی فشرده‌ی پایتون، بخش ۲", "short": "بازه‌ها، zip، اسپلت، کامپرهنشن، لامبدا، کلاس‌ها و خطاها", "topics": [{"title": "بازه‌ها و گام", "summary": "range() تا سه آرگومان می‌گیرد، start، stop و step، و همین ایده پشت برش با [start:stop:step] است.", "bullets": ["<code>range(5)<\/code> عدد 5 را به‌عنوان <code>stop<\/code> می‌گیرد. با <code>start<\/code> از جای دیگری شروع کنید و با <code>step<\/code> بیش از یکی‌یکی جلو بروید. گام می‌تواند منفی باشد.", "<code>stop<\/code> همیشه کنار گذاشته می‌شود: <code>range(2, 5)<\/code> اعداد 2، 3 و 4 را می‌دهد.", "کروشه با یک عدد <i>اندیس<\/i> می‌گیرد. با دونقطه <i>برش<\/i> می‌زند: <code>seq[start:stop:step]<\/code>.", "هر بخش را خالی بگذارید تا مقدار پیش‌فرضش استفاده شود: شروع 0، پایان تا انتها، گام 1. اعداد منفی از انتها می‌شمارند.", "یک range را داخل <code>list()<\/code> بگذارید تا همه‌ی اعدادش را یک‌جا ببینید."], "note": "نوت‌بوک می‌گوید <code>range(10)[3:5]<\/code> عضوهای جایگاه 3 و 5 را می‌دهد. چون <code>stop<\/code> کنار گذاشته می‌شود، در واقع جایگاه‌های <b>3 و 4<\/b> است، همان‌طور که سلول دوم نشان می‌دهد.", "data": "با برش، ردیف‌های اول یک مجموعه‌داده، هفته‌ی آخر یک سری زمانی یا هر n-امین نمونه را برمی‌دارید.", "labels": ["از درس", "اندیس در برابر برش", "مثال داده"]}, {"title": "Enumerate", "summary": "enumerate() هر عضو را همراه با جایگاهش، به شکل جفت‌های (index, element)، به شما می‌دهد.", "bullets": ["در یک حلقه‌ی <code>for<\/code> دو نام را با هم بگیرید: <code>for idx, el in enumerate(items):<\/code>.", "آن را داخل <code>list()<\/code> بگذارید تا همه‌ی جفت‌ها را ببینید.", "<code>enumerate(items, start=1)<\/code> از 1 می‌شمارد که در گزارش‌ها خواناتر است."], "labels": ["از درس", "مثال داده"]}, {"title": "Zip کردن", "summary": "zip() هم‌زمان از چند لیست عبور می‌کند و تاپل‌هایی با یک عضو از هر لیست به شما می‌دهد.", "bullets": ["مثل <code>enumerate()<\/code> کار می‌کند، اما جفت‌ها به‌جای شمارنده از لیست‌های خودتان می‌آیند.", "این بعداً خیلی به کار می‌آید، پس حالا برای فهمیدنش وقت بگذارید.", "درس از شما می‌خواهد درباره‌ی لیست‌هایی با <b>طول‌های متفاوت<\/b> فکر کنید. سلول پایین را ویرایش کنید تا یکی از لیست‌ها کوتاه‌تر شود و خودتان ببینید <code>zip()<\/code> چه می‌کند."], "data": "<code>dict(zip(products, prices))<\/code> دو ستون هم‌خوان را در یک خط به یک جدول جست‌وجو تبدیل می‌کند.", "labels": ["مثال داده"]}, {"title": "اسپلت (Splat)", "summary": "اسپلت * در یک مقداردهی یعنی: این نام بقیه‌ی عضوها را می‌گیرد.", "bullets": ["فقط با پیمایش‌پذیرها کار می‌کند: لیست‌ها، تاپل‌ها، بازه‌ها و فهرست آرگومان‌ها.", "می‌توانید پیش و پس از اسپلت نام‌های معمولی بگذارید، اما در هر مقداردهی فقط <b>یک<\/b> اسپلت مجاز است.", "نام اسپلت‌شده همیشه یک لیست می‌گیرد، حتی اگر خالی باشد."], "labels": ["از درس", "مثال داده", "فقط یک اسپلت مجاز است"]}, {"title": "مقادیر پیش‌فرض، آرگومان‌های نام‌دار و *args", "summary": "آرگومان‌ها می‌توانند مقدار پیش‌فرض داشته باشند، با نام فرستاده شوند و یک اسپلت می‌تواند هر تعدادی از آن‌ها را جمع کند.", "bullets": ["آرگومانی که پیش‌فرض دارد <i>اختیاری<\/i> است. آرگومان بدون پیش‌فرض <i>اجباری<\/i> است و اگر ندهیدش خطا می‌گیرید.", "وقتی آرگومان‌ها زیادند، یا ترکیبی از اختیاری و اجباری‌اند، آن‌ها را <b>با نام<\/b> بفرستید: واضح‌تر است و ترتیب دیگر مهم نیست.", "<code>def my_fn(x, *y):<\/code> هر آرگومان موقعیتی اضافه را در <code>y<\/code> جمع می‌کند.", "اسپلت برعکس هم کار می‌کند: <code>my_fn(*args)<\/code> یک لیست را به آرگومان‌های جداگانه باز می‌کند."], "trap": "<code>*y<\/code> یک <b>تاپل<\/b> جمع می‌کند، نه لیست. توضیح‌های نوت‌بوک <code>[3, 4, 5]<\/code> نشان می‌دهند، اما پایتون <code>(3, 4, 5)<\/code> چاپ می‌کند، همان‌طور که سلول دوم نشان می‌دهد. هر جا لیست لازم دارید با <code>list(y)<\/code> تبدیلش کنید.", "analyst": "از اینجا به بعد سؤال‌ها از شما می‌خواهند <b>فکر کنید<\/b>. یک تحلیلگر داده اول کار را می‌فهمد (که اغلب پیچیده و بد توضیح داده شده)، بعد راه‌حلی طراحی می‌کند و تازه آن موقع کد می‌نویسد. امتحان تقریباً همه‌اش از همین نوع سؤال‌هاست، پس این عادت را هفته‌به‌هفته بسازید.", "labels": ["پیش‌فرض‌ها و نام‌ها", "جمع کردن آرگومان‌ها", "باز کردن یک لیست"]}, {"title": "آرگومان‌های کلیدواژه‌ای و اسپلت دوتایی", "summary": "آرگومان‌هایی که با موقعیت فرستاده می‌شوند یک تاپل می‌سازند. آرگومان‌هایی که با نام فرستاده می‌شوند یک دیکشنری می‌سازند که با اسپلت دوتایی ** جمع می‌شود.", "bullets": ["به آرگومان‌های نام‌دار <i>آرگومان کلیدواژه‌ای<\/i> می‌گویند، چون نام آرگومان به‌عنوان کلید استفاده می‌شود.", "<code>def my_fn(*args, **kwargs):<\/code> هر چیزی را می‌پذیرد: <code>args<\/code> بی‌نام‌ها را می‌گیرد و <code>kwargs<\/code> نام‌دارها را.", "<code>print(*args)<\/code> تاپل را باز می‌کند. <code>print(**kwargs)<\/code> فقط وقتی کار می‌کند که <code>print()<\/code> آرگومان‌هایی با همان نام‌ها داشته باشد.", "یک دیکشنری از تنظیمات به‌همراه <code>**<\/code> راه خوانایی برای پیکربندی یک تابع پیچیده است. <a href=\"https://docs.python.org/3/library/functions.html#print\">گزینه‌هایی که print() می‌پذیرد<\/a> را اینجا ببینید."], "data": "بعداً کتابخانه‌های رسم نمودار و داده ده‌ها گزینه می‌گیرند. نگه داشتن آن‌ها در یک دیکشنری و فرستادن <code>**settings<\/code> کد تحلیل را خیلی خواناتر می‌کند.", "labels": ["از درس", "تنظیمات به شکل دیکشنری"]}, {"title": "وارد کردن ماژول‌ها", "summary": "ماژول‌ها (اسم کتابخانه در پایتون) با import بارگذاری می‌شوند. خیلی‌هایشان همراه پایتون می‌آیند و بقیه را اول نصب می‌کنید.", "bullets": ["ماژول‌های اضافه را با <code>pipenv<\/code> (یا <code>pip<\/code>) نصب کنید و بعد با <code>import<\/code> بارگذاری کنید.", "<code>import math<\/code> کل ماژول را بارگذاری می‌کند و از <code>math.factorial()<\/code> استفاده می‌کنید.", "<code>from math import factorial<\/code> فقط یک نام را بارگذاری می‌کند.", "<code>as<\/code> یک نام کوتاه‌تر می‌دهد. مثال معروف <code>import matplotlib.pyplot as plt<\/code> است که برای نمودارها به کارش می‌برید.", "<code>from math import *<\/code> همه‌چیز را در فضای نام شما می‌ریزد. کار بدی است: از آن پرهیز کنید."], "trap": "<code>from module import *<\/code> می‌تواند بی‌صدا نام‌هایی را که از قبل دارید بازنویسی کند، درست مثل <code>sum = 0<\/code> در هفته‌ی ۱. همیشه فقط چیزی را که لازم دارید وارد کنید یا از <code>as<\/code> استفاده کنید.", "labels": ["سه روش import"]}, {"title": "کامپرهنشن‌ها (Comprehensions)", "summary": "کامپرهنشن یک لیست یا دیکشنری را با توصیف محتوایش در یک خط می‌سازد.", "bullets": ["لیست: <code>[expression for item in iterable]<\/code>.", "دیکشنری: <code>{key: value for item in iterable}<\/code>. به دونقطه‌ی بین کلید و مقدار دقت کنید.", "می‌توانید <code>if<\/code> اضافه کنید تا فقط بعضی عضوها بمانند. درس بعداً این را کامل توضیح می‌دهد."], "note": "برای Q8 از نکته‌ی درس پیروی کنید: اول یک نمونه‌ی کوچک و مرتب از خروجی بنویسید و بعد تابع را طراحی کنید.", "labels": ["از درس", "کامپرهنشن دیکشنری", "مثال داده"]}, {"title": "زیرخط‌ها", "summary": "زیرخط _ در نام‌ها یک کاراکتر معمولی است، اما پایتون قراردادهایی برایش دارد.", "bullets": ["نامی که با <code>_<\/code> شروع شود «خصوصی» است: قرار نیست کاربر صدایش بزند.", "نام‌هایی با دو زیرخط در دو طرف، مثل <code>__init__<\/code>، نام‌های ویژه‌ای هستند که پایتون رزرو کرده است.", "یک <code>_<\/code> تنها یعنی «از این مقدار استفاده نمی‌کنم»: <code>for _ in range(5):<\/code>."], "note": "<code>len(x)<\/code> در واقع متد ویژه‌ی <code>x.__len__()<\/code> را صدا می‌زند. نام‌های ویژه‌ای مثل این، راهی است که توابع داخلی پایتون با کلاس‌های خودتان کار می‌کنند.", "labels": ["مثال‌ها"]}, {"title": "لامبداها", "summary": "لامبدا یک تابع یک‌خطی بی‌نام است که می‌توانید مثل هر مقدار دیگری جابه‌جایش کنید.", "bullets": ["<code>lambda a, b: a + b<\/code> همان تابعی است که با <code>def<\/code> تعریف شود و <code>a + b<\/code> را برگرداند.", "فقط برای یک عبارت از آن استفاده کنید. هر چیزی با چند مرحله در یک <code>def<\/code> معمولی جا دارد.", "لامبداها وقتی می‌درخشند که تابعی، تابع دیگری را ورودی بگیرد، مثل <code>sorted(..., key=...)<\/code> یا <code>map()<\/code>.", "نامش از حرف یونانی λ و حساب لامبدا آمده ا : ["<code>*args<\/code>، <code>**kwargs<\/code> و کامپرهنشن‌ها را حتی جایی که سؤالی نمی‌خواهد تمرین کنید. در سؤال‌های بعدی برمی‌گردند.", "سؤال‌ها حالا از شما می‌خواهند اول راه‌حل را طراحی کنید. پیش از کد نوشتن، نمونه‌ی کوچکی از خروجی بنویسید.", "وقتی جواب‌هایتان کار کرد، بازسازی‌شان کنید. می‌توانید در امتحان از آن‌ها استفاده کنید، اما فقط اگر واضح باشند."]}}, "quiz": [{"q": "What does list(range(2, 10, 3)) give?", "o": ["[2, 5, 8]", "[2, 5, 8, 11]", "[3, 6, 9]", "[2, 3, 4]"], "a": 0, "why": "Start at 2, add 3 each time, and stop before 10."}, {"q": "What does 'abcdef'[1:4] give?", "o": ["'abcd'", "'bcd'", "'bcde'", "'b'"], "a": 1, "why": "Positions 1, 2 and 3. The stop position 4 is excluded."}, {"q": "What does daily_sales[-2:] give?", "o": ["The first two items", "Everything except the last two", "The last two items", "An error"], "a": 2, "why": "-2 starts two from the end, and an empty stop goes to the end."}, {"q": "What does list(enumerate(['a', 'b'])) give?", "o": ["['a', 'b']", "[(0, 'a'), (1, 'b')]", "[(1, 'a'), (2, 'b')]", "[0, 1]"], "a": 1, "why": "enumerate counts from 0 unless you pass start=."}, {"q": "After first, *rest = [1, 2, 3], what is rest?", "o": ["3", "[2, 3]", "(2, 3)", "[1, 2, 3]"], "a": 1, "why": "The splat takes the rest of the elements, as a list."}, {"q": "def f(x, y=5): print(x, y). What does f(2) print?", "o": ["2 5", "2", "5 2", "An error"], "a": 0, "why": "y is optional, so its default 5 is used."}, {"q": "With the same f, what happens with f(y=3)?", "o": ["Prints None 3", "Prints 3 5", "TypeError: missing argument 'x'", "Prints 3"], "a": 2, "why": "x has no default, so it's mandatory."}, {"q": "In def f(*args), what type is args?", "o": ["list", "tuple", "dict", "set"], "a": 1, "why": "*args collects a tuple, whatever the notebook comments suggest."}, {"q": "In def f(**kwargs), what type is kwargs?", "o": ["list", "tuple", "dict", "str"], "a": 2, "why": "Keyword arguments arrive as a dictionary of name: value."}, {"q": "What does [i * 2 for i in range(3)] give?", "o": ["[0, 2, 4]", "[2, 4, 6]", "[0, 1, 2]", "6"], "a": 0, "why": "range(3) is 0, 1, 2, and each is doubled."}, {"q": "What does map() return?", "o": ["A list", "A dict", "A lazy map object", "None"], "a": 2, "why": "Wrap it in list() to get the values."}, {"q": "What is a lambda?", "o": ["A loop", "An unnamed one-line function", "A type of list", "A module"], "a": 1, "why": "lambda x: x + 1 is a function without a name."}, {"q": "What does self refer to in a method?", "o": ["The class", "The parent class", "The instance the method is called on", "The module"], "a": 2, "why": "self is the specific object, such as my_square."}, {"q": "When does __init__() run?", "o": ["When you import the class", "When you create an instance with ClassName()", "When the program ends", "Never automatically"], "a": 1, "why": "It prepares each new instance."}, {"q": "Why is a bare except: a bad idea?", "o": ["It's slower", "It catches every error and hides the real cause", "It's a syntax error", "It only catches ZeroDivisionError"], "a": 1, "why": "Always name the exception you expect."}, {"q": "What does a lone _ as a variable name mean?", "o": ["A private variable", "A special Python name", "A value you won't use", "An error"], "a": 2, "why": "for _ in range(5): repeats without using the counter."}], "exercises": [{"t": "Every other day", "lvl": "Easy", "task": "From <code>daily_sales = [120, 95, 210, 180, 160, 75, 230]<\/code>, print the first three days, the last three days and every other day, using slices only.", "hint": "seq[:3], seq[-3:] and seq[::2].", "sol": "daily_sales = [120, 95, 210, 180, 160, 75, 230]\nprint(daily_sales[:3])\nprint(daily_sales[-3:])\nprint(daily_sales[::2])", "saved": {"stdout": "[120, 95, 210]\n[160, 75, 230]\n[120, 210, 160, 230]\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Ranking report", "lvl": "Easy", "task": "Sort <code>[210, 95, 180, 120]<\/code> from highest to lowest and print each value with its rank, starting at 1.", "hint": "sorted(..., reverse=True), then enumerate(..., start=1).", "sol": "sales = [210, 95, 180, 120]\nfor rank, value in enumerate(sorted(sales, reverse=True), start=1):\n    print(f\"#{rank}: {value}\")", "saved": {"stdout": "#1: 210\n#2: 180\n#3: 120\n#4: 95\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Price lookup", "lvl": "Easy", "task": "Combine <code>products = [\"apple\", \"bread\", \"milk\"]<\/code> and <code>prices = [0.5, 2.8, 1.6]<\/code> into a dictionary, then print the price of bread.", "hint": "dict(zip(a, b)) builds the lookup in one line.", "sol": "products = [\"apple\", \"bread\", \"milk\"]\nprices = [0.5, 2.8, 1.6]\nprice_of = dict(zip(products, prices))\nprint(price_of)\nprint(price_of[\"bread\"])", "saved": {"stdout": "{'apple': 0.5, 'bread': 2.8, 'milk': 1.6}\n2.8\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Parse prices", "lvl": "Medium", "task": "Turn <code>[\"2.80 CHF\", \"1.60 CHF\", \"0.50 CHF\"]<\/code> into a list of floats using <code>map()<\/code> and a lambda, then print the total.", "hint": "Inside the lambda: remove \" CHF\" with .replace(), then float().", "sol": "raw = [\"2.80 CHF\", \"1.60 CHF\", \"0.50 CHF\"]\nprices = list(map(lambda s: float(s.replace(\" CHF\", \"\")), raw))\nprint(prices)\nprint(round(sum(prices), 2))", "saved": {"stdout": "[2.8, 1.6, 0.5]\n4.9\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Summary with options", "lvl": "Medium", "task": "Write <code>summarize(values, decimals=1, label=\"Average\")<\/code> that prints the label and the rounded average. Call it with defaults, and with keyword arguments.", "hint": "Defaults go in the def line. Call with summarize(data, label=\"Mean\", decimals=2).", "sol": "def summarize(values, decimals=1, label=\"Average\"):\n    avg = sum(values) / len(values)\n    print(f\"{label}: {round(avg, decimals)}\")\n\ndata = [120, 95, 210, 180]\nsummarize(data)\nsummarize(data, label=\"Mean sales\", decimals=2)", "saved": {"stdout": "Average: 151.2\nMean sales: 151.25\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Discount list", "lvl": "Medium", "task": "Use a list comprehension to apply a 15% discount to <code>[19.9, 4.5, 12.0]<\/code>, rounding to 2 decimals. Then keep only prices under 10.", "hint": "[round(p * 0.85, 2) for p in prices], then add if p < 10.", "sol": "prices = [19.9, 4.5, 12.0]\ndiscounted = [round(p * 0.85, 2) for p in prices]\nprint(discounted)\nprint([p for p in discounted if p < 10])", "saved": {"stdout": "[16.91, 3.82, 10.2]\n[3.82]\n", "value": null, "error": null, "images": [], "html": null}}, {"t": "Store class", "lvl": "Harder", "task": "Write a class <code>Store<\/code> with a name and a list of daily sales, and methods <code>total()<\/code> and <code>best_day()<\/code> that returns the position of the highest sale.", "hint": "Store the data in __init__ with self. Use max() and .index() in best_day().", "sol": "class Store:\n    def __init__(self, name, sales):\n        self.name = name\n        self.sales = sales\n\n    def total(self):\n        return sum(self.sales)\n\n    def best_day(self):\n        return self.sales.index(max(self.sales))\n\nbern = Store(\"Bern\", [80, 140, 95, 160])\nprint(bern.name, bern.total(), bern.best_day())", "saved": {"stdout": "Bern 475 3\n", "value": null, "error": null, "images": [], "html": null}}], "assignment": ["Using range(), create and print a list containing [4, 2, 0, -2, -4].", "Use the slice operator to reverse a list of the numbers 0 to 4.", "Write a function that prints n tuples (i, n-i) using a reversed list and enumerate(), without subtraction.", "Make a list from 4 to 10 and one from 8 to 2, zip them and print the product of each pair.", "From [0, 2, 4, 6] made with range(), write one assignment equivalent to a=0; b=[2,4]; c=6.", "Define a function that accepts any number of arguments (including 0) and returns them in a list.", "Define a function with a mandatory, an optional (None) and a splat argument that prints how many arguments it got. Test with 1, 2 and 3.", "Write a function returning a dict from 0 to n-1, where each value lists the squares from 0 to the key. Use a dict comprehension with a list comprehension inside.", "Produce the same output as Q8 using map().", "Write a better parent class and subclass example than Square and Cube.", "Define a safe fraction function that returns 1/n, or 0 when it catches a ZeroDivisionError."], "next": {"title": "Before Week 3", "summary": "The intermediate features, lambdas, map, classes and exceptions, take time to sink in. That's normal: know they exist, play with them now, and you'll practise them for real when you need them.", "bullets": ["Practise <code>*args<\/code>, <code>**kwargs<\/code> and comprehensions even where no question asks you to. They come back in later questions.", "Questions now ask you to design a solution first. Write a small example of the output before you code.", "Refactor your answers once they work. You can reuse them at the exam, but only if they're clear."]}}, {"n": 3, "title": "Data and plotting", "short": "Data, dimensions, NumPy, pandas, and your first plots with seaborn", "topics": [{"id": "data", "title": "What is data", "summary": "Data is the recorded output of a process. Each record describes one data point through several features.", "bullets": ["A record (also called a line, sample or element) is a collection of values. Each value describes the data point by one characteristic, called a <b>feature<\/b>.", "Example from the lecture: tracking temperatures in two cities. One record is <code>[date_time, t_be, t_fr]<\/code>: the time, the temperature in Bern and the temperature in Fribourg.", "A dataset is a collection of these records: <code>[r1, r2, r3, ...]<\/code>.", "Read this a few times until it makes sense. That's normal."], "cells": [{"label": "Records in a dataset", "code": "features = [\"date_time\", \"t_be\", \"t_fr\"]\nr1 = [\"2026-11-17 08:00\", 3.5, 4.1]\nr2 = [\"2026-11-17 12:00\", 7.2, 7.9]\nr3 = [\"2026-11-17 18:00\", 4.8, 5.0]\ndataset = [r1, r2, r3]\nprint(len(dataset), \"records with\", len(features), \"features each\")\nprint(dataset[1])", "saved": {"stdout": "3 records with 3 features each\n['2026-11-17 12:00', 7.2, 7.9]\n", "value": null, "error": null, "images": [], "html": null}}], "data": "In every table you'll analyse, each <b>row<\/b> is a record and each <b>column<\/b> is a feature. Keep that picture in mind for the rest of the course."}, {"id": "dims", "title": "Dimensions", "summary": "Numbers come in shapes: a scalar has no dimensions, a vector one, a matrix two, and anything beyond is a tensor.", "bullets": ["<b>Scalar<\/b>: a single number, 0 dimensions. <b>Vector<\/b>: a list of numbers, 1 dimension. <b>Matrix<\/b>: a list of lists, 2 dimensions (rows and columns).", "<b>Tensor<\/b> is the general name: a scalar is a 0d tensor, a vector 1d, a matrix 2d, a list of matrices 3d, and so on.", "Watch the brackets: <code>4<\/code> is a scalar, <code>[4]<\/code> is a vector with one element, <code>[[4]]<\/code> is a 1×1 matrix.", "<b>Dimensions are not sizes.<\/b> A 3×2 matrix has 2 dimensions, with sizes 3 (rows) and 2 (columns). Its <i>shape<\/i> is <code>(3, 2)<\/code>.", "The length of the shape is the number of dimensions: shape <code>(2, 3, 4, 3)<\/code> means a 4d tensor."], "tables": [{"caption": "Real-world examples from the lecture", "head": ["Data", "Dimensions", "Why"], "rows": [["One temperature reading", "0 (scalar)", "A single number"], ["Sound", "1 (vector)", "Intensities over time"], ["Black-and-white image", "2 (matrix)", "Rows × columns of pixels"], ["Colour image", "3", "Height × width × colour channels (red, green, blue)"], ["Video", "4", "A list of colour images over time"], ["Weather for many cities", "3", "Cities × time, one matrix per measure (temperature, wind, rain…)"]]}], "cells": [{"label": "Shapes with NumPy", "code": "import numpy as np\nprint(np.array(4).ndim, np.array([4]).ndim, np.array([[4]]).ndim)\nm = np.zeros((3, 2))\nprint(m.shape, m.ndim)\nphoto = np.zeros((480, 640, 3))\nprint(photo.shape, photo.ndim)", "saved": {"stdout": "0 1 2\n(3, 2) 2\n(480, 640, 3) 3\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "A dimension with a fixed size still counts. Colour channels are always 3, yet they add a whole dimension. A one-hour film has tens of thousands of frames, yet time is still just one dimension.", "note": "Q1 deliberately uses code that takes hours to run, so you can't just look at the output. Read it like English and work out the answer in your head, or find what makes it slow and shrink it without changing the answer."}, {"id": "order", "title": "Ordering dimensions", "summary": "The same data can be stored records-first (a list of rows) or features-first (a dict of columns). Data analytics mostly uses features-first.", "bullets": ["Records-first: easy for a human to read one dog, but you access features by number and need the separate <code>features<\/code> list to know what each number means.", "Features-first, as a <code>dict<\/code> of lists: each feature is reached by its name, which is clearer and easier to process.", "Python lets you continue a list on a new line after a comma, even with different indentation. Use that to make data <b>readable<\/b>.", "Write code for humans first, including your future self at the exam. The computer runs it the same either way.", "To get the feature names of a dict, look up the <code>keys()<\/code> method in the <code>dict<\/code> documentation, and convert strange results with <code>list()<\/code>."], "cells": [{"label": "Records-first (from the lecture)", "code": "features = ['name', 'age', 'weight', 'character']\ndogs = [['Spiffy', 6, 10, 'affectionate'],\n        ['Fido', 4, 15, 'introvert'],\n        ['Rocky', 8, 35, 'affectionate']]\nprint(dogs[0])\nprint([dog[0] for dog in dogs])\nprint([(dog[2], dog[1]) for dog in dogs])", "saved": {"stdout": "['Spiffy', 6, 10, 'affectionate']\n['Spiffy', 'Fido', 'Rocky']\n[(10, 6), (15, 4), (35, 8)]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Features-first (from the lecture)", "code": "dogs = {\n    'name':      ['Spiffy', 'Fido', 'Rocky'],\n    'age':       [6, 4, 8],\n    'weight':    [10, 15, 35],\n    'character': ['hyperactive', 'cuddly', 'cuddly']\n}\nprint(dogs['name'])\nprint(list(zip(dogs['weight'], dogs['age'])))\nprint(max(dogs['weight']))", "saved": {"stdout": "['Spiffy', 'Fido', 'Rocky']\n[(10, 6), (15, 4), (35, 8)]\n35\n", "value": null, "error": null, "images": [], "html": null}}], "data": "Features-first is exactly how pandas stores a table: one named column per feature. That's why the lecture builds up to it."}, {"id": "generate", "title": "Generating data", "summary": "A process can be seen as an underlying function y = f(x). Analysis tries to approximate it with a model f̂ that predicts ŷ.", "bullets": ["Something always changes, an input or simply time, and each change produces a new data point.", "<b>f<\/b> is the original, underlying function: the true process. We usually can't see it. Its outputs are the real data, <b>y<\/b> (the labels).", "<b>f̂<\/b> (\"f hat\") is the <b>model<\/b>: our approximation, picked from a family such as linear functions, polynomials or neural networks. Its outputs are predictions, <b>ŷ<\/b>.", "People often drop the hat on f, so work out from context whether f means the model (most of the time) or the true process. The instructor mixes them on purpose.", "Never mix up <b>y<\/b> and <b>ŷ<\/b>: you always have both, and comparing them is how you judge a model.", "Machine learning, and even AI, is about approximating such functions."], "cells": [{"label": "Data example: f, f̂, y and ŷ", "code": "f = lambda x: 2 * x + 1          # the underlying process\nf_hat = lambda x: 2.1 * x + 0.5   # our model, a guess\n\nxs = list(range(5))\ny = [f(x) for x in xs]            # real data (labels)\ny_hat = [f_hat(x) for x in xs]    # predictions\nprint(\"y    :\", y)\nprint(\"y_hat:\", [round(v, 2) for v in y_hat])\nprint(\"errors:\", [round(a - b, 2) for a, b in zip(y, y_hat)])", "saved": {"stdout": "y    : [1, 3, 5, 7, 9]\ny_hat: [0.5, 2.6, 4.7, 6.8, 8.9]\nerrors: [0.5, 0.4, 0.3, 0.2, 0.1]\n", "value": null, "error": null, "images": [], "html": null}}], "note": "For Q4, the tips in the notebook point back to Week 2: store a function in a variable, call it, and repeat that to build a list of outputs."}, {"id": "plotting", "title": "Basic plotting", "summary": "matplotlib is Python's standard plotting library. seaborn wraps it so plots look good from the start.", "bullets": ["Import them as <code>import seaborn as sns<\/code> and <code>import matplotlib.pyplot as plt<\/code>. Everyone uses these names, and conventions help people communicate.", "Start with two plots: <b>scatterplots<\/b> draw points, and <b>lineplots<\/b> also connect them with a line.", "Plots here are 2D, so every point needs two coordinates.", "<b>Jargon switch:<\/b> in functions, x is the input and y the output. In plots, x is the horizontal axis and y the vertical one. They only match for simple one-input functions.", "In <code>sns.scatterplot(x=x, y=y)<\/code>, the first <code>x<\/code> is the function's parameter and the second is your variable. Scope keeps them apart.", "Typical workflow: get most of the way with seaborn, then fine-tune with matplotlib."], "cells": [{"label": "From the lecture", "code": "import seaborn as sns\nx = range(1, 101)\ny = [n**2 for n in x]\nsns.scatterplot(x=x, y=y)", "saved": {"stdout": "", "value": "<Axes: >", "error": null, "images": ["iVBORw0KGgoAAAANSUhEUgAAAZcAAAErCAYAAAASbs4DAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAJDtJREFUeF7t3Ql0k2X2+PHbYsvSUsCyyW6hAw6LAgVRwDmCKKKyiQgcZKeIKKCO24gwzsEzo4wgIMryUwT0P5SDguKgoywKKKhFEBGrYGWTrY }], "note": "The last value of a cell is shown as text above the chart, such as <code>&lt;Axes: &gt;<\/code>. Ending a cell with <code>None<\/code> hides it, as the second cell does."}, {"id": "numpy", "title": "NumPy", "summary": "NumPy makes numerical work fast: its ndarray is a tensor stored and processed by optimised C code.", "bullets": ["Python loops are slow, as Q1 shows. NumPy runs numerical code written in C, which is why it's fast. Import it as <code>import numpy as np<\/code>.", "Its main structure, the <code>ndarray<\/code>, can have any number of dimensions. Arrays of one type take less memory and run much faster than lists.", "Arithmetic is <b>element-wise<\/b>: <code>np.array([1, 2]) + np.array([3, 4])<\/code> gives <code>[4, 6]<\/code>. With lists, <code>+<\/code> joins them instead.", "Ready-made arrays: <code>np.zeros()<\/code>, <code>np.ones()<\/code>, <code>np.eye()<\/code> (identity matrix), <code>np.diag(arr)<\/code> (values on the diagonal).", "<code>np.linspace(start, stop, num)<\/code> gives evenly spaced numbers, often used for x-axis values. Read its <a href=\"https://numpy.org/doc/stable/reference/generated/numpy.linspace.html\">documentation<\/a> for Q6."], "cells": [{"label": "List vs array", "code": "import numpy as np\nprint([1, 2] + [3, 4])\nprint(np.array([1, 2]) + np.array([3, 4]))\nprint(np.array([1, 2, 3]) * 10)", "saved": {"stdout": "[1, 2, 3, 4]\n[4 6]\n[10 20 30]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Building arrays", "code": "import numpy as np\nprint(np.zeros(3))\nprint(np.eye(2))\nprint(np.diag([5, 7]))\nprint(np.linspace(0, 1, 5))", "saved": {"stdout": "[0. 0. 0.]\n[[1. 0.]\n [0. 1.]]\n[[5 0]\n [0 7]]\n[0.   0.25 0.5  0.75 1.  ]\n", "value": null, "error": null, "images": [], "html": null}}, {"label": "Data example", "code": "import numpy as np\ncelsius = np.array([3.5, 7.2, 4.8, -1.0])\nfahrenheit = celsius * 9 / 5 + 32\nprint(fahrenheit)\nprint(celsius.mean(), celsius.max())", "saved": {"stdout": "[38.3  44.96 40.64 30.2 ]\n3.625 7.2\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "The notebook writes <code>zero()<\/code>, but the function is <code>np.zeros()<\/code>, with an s."}, {"id": "dot", "title": "Linear algebra and the dot product", "summary": "NumPy's linalg module does algebra between tensors. The operation you'll use most is the dot product.", "bullets": ["The dot product takes two lists of the same length, multiplies each pair of elements, then adds up the results.", "It's available as <code>np.dot(a, b)<\/code> and as the method <code>a.dot(b)<\/code>.", "Convert a list to an array with <code>np.array(lst)<\/code>, and back with <code>arr.tolist()<\/code>.", "<code>np.linalg<\/code> holds more advanced tools, such as <code>np.linalg.svd()<\/code>, used later for dimensionality reduction."], "formula": "(2, 3, 4) · (1, 1, 1) = 2×1 + 3×1 + 4×1 = 2 + 3 + 4 = 9", "cells": [{"label": "From the lecture", "code": "import numpy as np\na = np.array([2, 3, 4])\nb = np.ones(3)\nprint(a.dot(b))\nprint(np.dot(a, b))\nprint(a.tolist())", "saved": {"stdout": "9.0\n9.0\n[2, 3, 4]\n", "value": null, "error": null, "images": [], "html": null}}], "trap": "The notebook writes <code>arr.to_list()<\/code>. The real method is <code>arr.tolist()<\/code>, with no underscore. The other one raises an AttributeError.", "data": "A dot product is a weighted sum: quantities · prices is a total bill. You'll see it inside regression, similarity scores and neural networks."}, {"id": "pandas", "title": "Pandas", "summary": "pandas is the standard tool for data manipulation. It builds on everything so far: think of a DataFrame as a dict of columns with superpowers.", "bullets": ["Import it as <code>import pandas as pd<\/code>. It can feel unintuitive at first, so be patient: the computer is always right.", "<b>Series<\/b>: a NumPy array with superpowers, one feature with a name and extra metadata.", "<b>DataFrame<\/b>: a dict of Series, like the features-first <code>dogs<\/code> data. You can convert between dict and DataFrame.", "<b>Index<\/b>: labels for the rows. By default it's a counter, but it can be timestamps (making a time series), names or anything else.", "<code>df['age']<\/code> gets one column as a Series. <code>df.index<\/code> is a <i>property<\/i>, so it has no parentheses.", "<code>inplace=True<\/code> changes the DataFrame itself. Without it, the method returns a changed copy."], "cells": [{"label": "From the lecture", "code": "import pandas as pd\ndogs = {\n    'name':      ['Spiffy', 'Fido', 'Rocky'],\n    'age':       [6, 4, 8],\n    'weight':    [10, 15, 35],\n    'character': ['hyperactive', 'cuddly', 'cuddly']\n}\ndf = pd.DataFrame(dogs)\ndf.set_index('name', inplace=True)\nprint(\"type:\", type(df))\ndf", "saved": {"stdout": "type: <class 'pandas.DataFrame'>\n", "value": null, "error": null, "images": [], "html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>age<\/th>\n      <th>weight<\/th>\n      <th>character<\/th>\n    <\/tr>\n    <tr>\n      <th>name<\/th>\n      <th><\/th>\n      <th><\/th>\n      <th><\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>Spiffy<\/th>\n      <td>6<\/td>\n      <td>10<\/td>\n      <td>hyperactive<\/td>\n    <\/tr>\n    <tr>\n      <th>Fido<\/th>\n      <td>4<\/td>\n      <td>15<\/td>\n      <td>cuddly<\/td>\n    <\/tr>\n    <tr>\n      <th>Rocky<\/th>\n      <td>8<\/td>\n      <td>35<\/td>\n      <td>cuddly<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}, {"label": "Sorting", "code": "import pandas as pd\ndf = pd.DataFrame({'name': ['Spiffy', 'Fido', 'Rocky'], 'age': [6, 4, 8], 'weight': [10, 15, 35]}).set_ مان"], ["تصویر سیاه‌وسفید", "۲ (ماتریس)", "ردیف‌ها × ستون‌های پیکسل"], ["تصویر رنگی", "۳", "ارتفاع × عرض × کانال‌های رنگ (قرمز، سبز، آبی)"], ["ویدیو", "۴", "لیستی از تصاویر رنگی در طول زمان"], ["آب‌وهوای چند شهر", "۳", "شهرها × زمان، یک ماتریس برای هر سنجه (دما، باد، باران…)"]]}], "note": "Q1 عمداً کدی دارد که اجرایش ساعت‌ها طول می‌کشد، پس نمی‌توانید فقط به خروجی نگاه کنید. آن را مثل انگلیسی بخوانید و جواب را در ذهن پیدا کنید، یا بفهمید چه چیزی کندش می‌کند و بدون تغییر جواب کوچکش کنید.", "trap": "بُعدی که اندازه‌اش ثابت است هم یک بُعد حساب می‌شود. کانال‌های رنگ همیشه ۳ تا هستند، اما یک بُعد کامل اضافه می‌کنند. یک فیلم یک‌ساعته ده‌ها هزار فریم دارد، اما زمان همچنان فقط یک بُعد است.", "labels": ["شکل‌ها با NumPy"]}, {"title": "ترتیب ابعاد", "summary": "یک داده را می‌شود رکوردمحور (لیستی از ردیف‌ها) یا ویژگی‌محور (دیکشنری‌ای از ستون‌ها) ذخیره کرد. تحلیل داده بیشتر از روش ویژگی‌محور استفاده می‌کند.", "bullets": ["رکوردمحور: خواندن یک سگ برای انسان راحت است، اما به ویژگی‌ها با شماره دسترسی دارید و برای دانستن معنای هر عدد به لیست جداگانه‌ی <code>features<\/code> نیاز دارید.", "ویژگی‌محور، به شکل <code>dict<\/code> از لیست‌ها: به هر ویژگی با نامش دسترسی دارید که واضح‌تر و پردازشش راحت‌تر است.", "پایتون اجازه می‌دهد بعد از یک ویرگول، لیست را در خط جدید ادامه دهید، حتی با تورفتگی متفاوت. از آن برای <b>خوانا<\/b> کردن داده استفاده کنید.", "کد را اول برای انسان بنویسید، از جمله خودِ آینده‌تان سر امتحان. کامپیوتر در هر حال آن را یکسان اجرا می‌کند.", "برای گرفتن نام ویژگی‌های یک دیکشنری، متد <code>keys()<\/code> را در مستندات <code>dict<\/code> پیدا کنید و نتیجه‌های عجیب را با <code>list()<\/code> تبدیل کنید."], "data": "ویژگی‌محور دقیقاً همان روشی است که پانداس یک جدول را ذخیره می‌کند: یک ستون نام‌دار برای هر ویژگی. برای همین درس به سمت آن پیش می‌رود.", "labels": ["رکوردمحور (از درس)", "ویژگی‌محور (از درس)"]}, {"title": "تولید داده", "summary": "یک فرایند را می‌شود به شکل یک تابع زیربنایی y = f(x) دید. تحلیل تلاش می‌کند آن را با مدلی f̂ تقریب بزند که ŷ را پیش‌بینی می‌کند.", "bullets": ["همیشه چیزی تغییر می‌کند، یک ورودی یا فقط زمان، و هر تغییر یک نقطه‌ی داده‌ی تازه می‌سازد.", "<b>f<\/b> تابع اصلی و زیربنایی است: فرایند واقعی. معمولاً آن را نمی‌بینیم. خروجی‌هایش داده‌های واقعی‌اند، یعنی <b>y<\/b> (برچسب‌ها).", "<b>f̂<\/b> («اف کلاه») <b>مدل<\/b> است: تقریب ما، که از خانواده‌ای مثل توابع خطی، چندجمله‌ای‌ها یا شبکه‌های عصبی انتخاب می‌شود. خروجی‌هایش پیش‌بینی‌ها هستند، یعنی <b>ŷ<\/b>.", "معمولاً کلاه روی f را نمی‌گذارند، پس از متن بفهمید که f یعنی مدل (بیشتر وقت‌ها) یا فرایند واقعی. مدرس عمداً این دو را قاطی می‌کند.", "هرگز <b>y<\/b> و <b>ŷ<\/b> را قاطی نکنید: همیشه هر دو را دارید و مقایسه‌شان راه سنجیدن یک مدل است.", "یادگیری ماشین، و حتی هوش مصنوعی، درباره‌ی تقریب زدن چنین توابعی است."], "note": "برای Q4، نکته‌های نوت‌بوک به هفته‌ی ۲ اشاره می‌کنند: یک تابع را در یک متغیر بگذارید، صدایش بزنید و این کار را تکرار کنید تا لیستی از خروجی‌ها بسازید.", "labels": ["مثال داده: f، f̂، y و ŷ"]}, {"title": "رسم نمودار پایه", "summary": "matplotlib کتابخانه‌ی استاندارد رسم نمودار در پایتون است. seaborn آن را طوری می‌پوشاند که نمودارها از همان اول خوب به نظر برسند.", "bullets": ["آن‌ها را به شکل <code>import seaborn as sns<\/code> و <code>import matplotlib.pyplot as plt<\/code> وارد کنید. همه از همین نام‌ها استفاده می‌کنند و قراردادها به ارتباط کمک می‌کنند.", "با دو نمودار شروع کنید: <b>نمودار پراکندگی<\/b> نقطه‌ها را می‌کشد و <b>نمودار خطی<\/b> آن‌ها را با یک خط هم وصل می‌کند.", "نمودارها اینجا دوبعدی‌اند، پس هر نقطه دو مختصات لازم دارد.", "<b>تغییر اصطلاح:<\/b> در توابع، x ورودی است و y خروجی. در نمودارها، x محور افقی است و y محور عمودی. این دو فقط برای توابع ساده‌ی تک‌ورودی یکی‌اند.", "در <code>sns.scatterplot(x=x, y=y)<\/code>، اولین <code>x<\/code> پارامتر تابع است و دومی متغیر شما. اسکوپ آن‌ها را از هم جدا نگه می‌دارد.", "روال معمول: بیشتر راه را با seaborn بروید و بعد با matplotlib جزئیات را تنظیم کنید."], "note": "آخرین مقدار یک سلول به شکل متن بالای نمودار نمایش داده می‌شود، مثل <code>&lt;Axes: &gt;<\/code>. پایان دادن سلول با <code>None<\/code
